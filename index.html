   Qn(T1,"El proveedor también falta a la segunda audiencia. ¿Qué consecuencia hay?","Nueva medida de apremio y se tiene por presuntamente cierto lo manifestado por el reclamante",["Se archiva el asunto","Se cita a una tercera audiencia"],"La ley lo prevé tras la segunda ausencia.","LFPC, art. 112"),
   Qn(T1,"El reclamante no asiste a la audiencia y no justifica su ausencia en los siguientes 10 días. ¿Qué ocurre?","Se le tiene por desistido de la reclamación",["Se cita otra audiencia","Se resuelve a su favor"],"Debe presentar justificación fehaciente.","LFPC, art. 112"),
   Qn(T1,"En la audiencia, el conciliador resume la reclamación y presenta opciones de solución sin prejuzgar. ¿Qué debe salvaguardar?","Los derechos del consumidor",["Los intereses del proveedor","La reserva de la información"],"Así lo ordena el artículo 113.","LFPC, art. 113"),
   Qn(T1,"No hubo conciliación. ¿Qué propone el conciliador a las partes?","Designar como árbitro a la Procuraduría o a uno independiente",["Acudir al amparo","Cerrar el asunto"],"Es el paso siguiente a la falta de acuerdo.","LFPC, art. 116"),
   Qn(T1,"Si las partes no aceptan el arbitraje, ¿qué ocurre con sus derechos?","Quedan a salvo",["Se pierden","Prescriben en 10 días"],"Pueden acudir a otra vía.","LFPC, art. 116"),
   Qn(T1,"Un consumidor y un proveedor quieren que la Procuraduría arbitre su conflicto sin haber presentado reclamación. ¿Es posible?","Sí, si la designan como árbitro, sin reclamación ni conciliación previas",["No, requiere conciliación previa","Solo si ya hubo multa"],"La Procuraduría puede actuar como árbitro cuando los interesados así lo decidan.","LFPC, art. 117"),
   Qn(T1,"Al designar árbitro se levanta acta ante la Procuraduría. ¿Qué debe precisarse en ella?","Los puntos esenciales de la controversia y si el arbitraje es en estricto derecho o amigable composición",["El monto de la multa","El domicilio de los testigos"],"Así queda delimitado el arbitraje.","LFPC, art. 118"),
   Qn(T1,"La ley no aclara si un plazo es de días naturales o hábiles. ¿Cómo se entiende?","Como días naturales",["Como días hábiles","Como semanas"],"Si concluye en día inhábil, corre al hábil siguiente.","LFPC, art. 108"),
   Qn(T1,"¿Qué naturaleza tiene la Procuraduría Federal del Consumidor?","Organismo descentralizado de servicio social con funciones de autoridad administrativa",["Órgano constitucional autónomo","Dependencia centralizada sin patrimonio"],"Tiene personalidad jurídica y patrimonio propios.","LFPC, art. 20")]},

 {t:"Procedimiento administrativo y recurso de revisión", ley:"Ley Federal de Procedimiento Administrativo",
  cards:[
   Cn("Elementos del acto administrativo","Órgano competente; objeto determinado o determinable; finalidad de interés público; constar por escrito con firma autógrafa; fundado y motivado; sin error, dolo ni violencia; mencionar el órgano, lugar y fecha.","LFPA, art. 3"),
   Cn("Validez del acto","Es válido hasta que su invalidez sea declarada por autoridad administrativa o jurisdiccional.","LFPA, art. 8"),
   Cn("Plazo para resolver","No excede de tres meses, salvo otra disposición. Transcurrido, se entiende negativa, salvo que se prevea lo contrario. La constancia se expide en dos días hábiles.","LFPA, art. 17"),
   Cn("Prevención","Se previene por escrito y una sola vez, con al menos cinco días hábiles. Si no se desahoga, se desecha el trámite.","LFPA, art. 17-A"),
   Cn("Recurso de revisión","Se interpone en quince días desde que surtió efectos la notificación, ante la autoridad que emitió el acto; lo resuelve su superior jerárquico, o el titular si él lo emitió.","LFPA, arts. 85 y 86"),
   Cn("Suspensión, improcedencia y resolución","Se suspende la ejecución si se solicita, procede el recurso, no hay perjuicio al interés social ni a terceros y, en multas, se garantiza el crédito fiscal. Se desecha si hay otro recurso pendiente, el acto no afecta intereses, es irreparable o fue consentido. No se modifica lo no impugnado.","LFPA, arts. 87, 89 y 93")],
  qs:[
   Qn(T1,"Una resolución administrativa no señala el fundamento legal en que se apoya. ¿Qué elemento del acto administrativo incumple?","Estar fundado y motivado",["Ser expedido por órgano competente","Mencionar lugar y fecha de emisión"],"El fundamento y la motivación son un elemento del acto.","LFPA, art. 3"),
   Qn(T1,"Un oficio sancionador es firmado por un servidor público sin facultades para emitirlo. ¿Qué elemento falta?","Ser expedido por órgano competente",["Ser expedido sin dolo","Constar por escrito"],"El acto debe emitirlo el órgano competente por medio de un servidor público.","LFPA, art. 3"),
   Qn(T1,"Un acto administrativo se emitió mediando violencia contra la persona interesada. ¿Qué elemento incumple?","Ser expedido sin que medie dolo o violencia",["Tener objeto determinado","Constar el lugar de emisión"],"Es uno de los requisitos de validez.","LFPA, art. 3"),
   Qn(T1,"Un acto administrativo es ilegal, pero ninguna autoridad ha declarado su invalidez. ¿Es válido mientras tanto?","Sí, hasta que su invalidez sea declarada por autoridad administrativa o jurisdiccional",["No, es nulo desde su emisión","Solo durante quince días"],"La ley presume su validez hasta la declaración.","LFPA, art. 8"),
   Qn(T1,"Una persona presenta una solicitud y pasan más de tres meses sin respuesta, sin que otra ley fije un plazo. ¿Qué se entiende?","Que la resolución es en sentido negativo",["Que es en sentido positivo","Que el trámite quedó suspendido"],"Salvo que otra disposición prevea lo contrario.","LFPA, art. 17"),
   Qn(T1,"Ese solicitante pide constancia de la negativa. ¿En cuánto tiempo debe expedirse?","Dentro de los dos días hábiles siguientes a la solicitud",["En diez días naturales","En un mes"],"Así lo dispone el artículo 17.","LFPA, art. 17"),
   Qn(T1,"El escrito de un particular omite un requisito. ¿Cuántas veces puede prevenirlo la autoridad y con qué plazo mínimo?","Una sola vez, con al menos cinco días hábiles",["Dos veces, con tres días","Las veces necesarias, sin plazo"],"La prevención es única y por escrito.","LFPA, art. 17-A"),
   Qn(T1,"El particular no atiende la prevención dentro del plazo. ¿Qué procede?","Se desecha el trámite",["Se resuelve a su favor","Se archiva sin efectos"],"Es la consecuencia de no desahogarla.","LFPA, art. 17-A"),
   Qn(T1,"Un plazo de diez días se cuenta en una semana con sábado y domingo. ¿Se cuentan esos días?","No, en plazos por días no se cuentan los inhábiles, salvo disposición en contrario",["Sí, todos los días","Solo los sábados"],"Las actuaciones se practican en días y horas hábiles.","LFPA, art. 28"),
   Qn(T1,"Una empresa recibe una resolución que pone fin a un procedimiento administrativo y la considera ilegal. ¿Qué medio tiene, además de la vía jurisdiccional?","El recurso de revisión",["El recurso de queja","El juicio político"],"Procede contra actos que pongan fin al procedimiento.","LFPA, art. 83"),
   Qn(T1,"Una resolución se notificó el lunes y surtió efectos el martes. ¿Con qué plazo cuenta para interponer el recurso de revisión?","Quince días contados desde el día siguiente al en que surtió efectos",["Cinco días","Treinta días"],"El cómputo inicia después de que surta efectos la notificación.","LFPA, art. 85"),
   Qn(T1,"Una empresa interpone revisión contra un acto de un director general. ¿Ante quién lo presenta y quién lo resuelve?","Ante quien emitió el acto; lo resuelve su superior jerárquico",["Ante la Suprema Corte; lo resuelve el Pleno","Ante el Congreso; lo resuelve la Cámara"],"Si el acto es del titular de una dependencia, lo resuelve él mismo.","LFPA, art. 86"),
   Qn(T1,"Una empresa quiere suspender la ejecución de una multa mientras se resuelve el recurso. Además de solicitarlo expresamente, ¿qué debe hacer?","Garantizar el crédito fiscal en alguna forma del Código Fiscal",["Pagar la mitad de la multa","Nada más"],"Es un requisito específico tratándose de multas.","LFPA, art. 87"),
   Qn(T1,"Un particular interpone un segundo recurso contra el mismo acto mientras otro está pendiente. ¿Qué procede con el segundo?","Se desecha por improcedente",["Se acumula sin más trámite","Se resuelve antes que el primero"],"Es improcedente el recurso contra actos que sean materia de otro pendiente, del mismo recurrente.","LFPA, art. 89"),
   Qn(T1,"Al resolver un recurso, la autoridad quiere modificar el acto en una parte que el recurrente no impugnó. ¿Puede?","No, no se pueden revocar ni modificar los actos en la parte no impugnada",["Sí, siempre","Solo si beneficia a la autoridad"],"La resolución debe precisar los actos que modifique.","LFPA, art. 93"),
   Qn(T1,"Seleccione una facultad de la autoridad que resuelve el recurso de revisión.","Confirmar el acto impugnado",["Imponer prisión al recurrente","Condenar en costas al recurrente"],"También puede desecharlo, sobreseerlo, declarar su nulidad o modificarlo.","LFPA, art. 91")]}
];

AREAS[2].bloques = AREAS[2].bloques.concat([
 {t:"Comisión Nacional de los Derechos Humanos", ley:"Ley de la Comisión Nacional de los Derechos Humanos",
  cards:[
   Cn("Naturaleza y competencia","Organismo con autonomía de gestión y presupuestaria, personalidad jurídica y patrimonio propios. Conoce de quejas contra autoridades y servidores públicos federales, salvo los del Poder Judicial de la Federación. Si hay autoridades federales y locales en un mismo hecho, es competente.","LCNDH, arts. 2 y 3"),
   Cn("Lo que no conoce","Actos y resoluciones de organismos y autoridades electorales, resoluciones jurisdiccionales y consultas sobre interpretación de disposiciones constitucionales y legales.","LCNDH, art. 7"),
   Cn("Quién puede quejarse y plazo","Cualquier persona, directamente o por representante; parientes o vecinos si la víctima está privada de la libertad o se ignora su paradero (incluso menores); y organizaciones no gubernamentales. La queja se presenta en un año, ampliable en infracciones graves; no hay plazo en lesa humanidad.","LCNDH, arts. 25 y 26"),
   Cn("Trámite","La instancia manifiestamente improcedente se rechaza de inmediato. Si no es de su competencia, se orienta a quien reclama. Las conclusiones se fundan exclusivamente en el expediente.","LCNDH, arts. 33 y 42"),
   Cn("Recomendación","Es pública y no imperativa; no anula ni modifica actos. La autoridad informa en quince días hábiles si la acepta y en otros quince entrega pruebas de cumplimiento.","LCNDH, art. 46"),
   Cn("Presidencia","La elige el Senado por dos terceras partes de los presentes (o la Comisión Permanente en recesos). Dura cinco años y puede reelegirse una sola vez.","LCNDH, arts. 10 y 11")],
  qs:[
   Qn(T3,"Una persona denuncia presunto abuso por un elemento de una corporación federal. ¿Es competente la Comisión Nacional?","Sí, por tratarse de servidores públicos federales",["No, solo conoce de autoridades estatales","No, solo conoce del Poder Judicial"],"Conoce de quejas contra autoridades y servidores públicos federales.","LCNDH, art. 3"),
   Qn(T3,"Un litigante considera que una sentencia de un juez del Poder Judicial de la Federación viola derechos humanos. ¿Puede conocer la Comisión Nacional?","No, no conoce de resoluciones jurisdiccionales ni de servidores del Poder Judicial de la Federación",["Sí, puede anular la sentencia","Sí, si hay queja de un partido"],"Las resoluciones jurisdiccionales están excluidas.","LCNDH, arts. 3 y 7"),
   Qn(T3,"Un partido se queja de una resolución de un organismo electoral. ¿Puede conocer la Comisión Nacional?","No, no conoce de actos y resoluciones electorales",["Sí, en todos los casos","Sí, si el partido es nacional"],"Es una exclusión expresa.","LCNDH, art. 7"),
   Qn(T3,"En un mismo hecho intervienen autoridades federales y municipales. ¿A quién corresponde la competencia?","A la Comisión Nacional",["A la comisión estatal","Al municipio"],"La competencia se surte a favor de la Comisión Nacional.","LCNDH, art. 3"),
   Qn(T3,"Una persona está privada de su libertad y se desconoce su paradero. Sus vecinos quieren presentar la queja. ¿Pueden?","Sí, parientes o vecinos pueden denunciar, incluso menores de edad",["No, solo la víctima","Solo abogados"],"Es una regla para personas privadas de la libertad o sin paradero conocido.","LCNDH, art. 25"),
   Qn(T3,"Una organización no gubernamental legalmente constituida quiere denunciar violaciones contra personas que no pueden acudir por sí mismas. ¿Puede?","Sí, puede acudir a denunciar",["No, solo particulares","Solo con autorización del Senado"],"Se reconoce su legitimación en casos de personas en condiciones de vulnerabilidad.","LCNDH, art. 25"),
   Qn(T3,"Una persona presenta su queja catorce meses después de ejecutados los hechos. ¿Es oportuna?","No, el plazo es de un año, salvo ampliación excepcional en infracciones graves",["Sí, sin límite","Sí, tiene dos años"],"La ampliación requiere resolución razonada.","LCNDH, art. 26"),
   Qn(T3,"Los hechos denunciados pueden considerarse violaciones de lesa humanidad. ¿Qué plazo rige para la queja?","No corre plazo alguno",["Un año","Cinco años"],"Es una excepción por la gravedad de los hechos.","LCNDH, art. 26"),
   Qn(T3,"Una queja resulta manifiestamente improcedente. ¿Qué hace la Comisión Nacional?","La rechaza de inmediato",["La admite y espera pruebas","La turna a los tribunales"],"Así lo ordena el artículo 33.","LCNDH, art. 33"),
   Qn(T3,"Una queja no corresponde de manera ostensible a la competencia de la Comisión. ¿Qué debe hacer?","Proporcionar orientación para que acuda a la autoridad que corresponda",["Resolverla de todos modos","Archivarla sin avisar"],"Se orienta a la persona reclamante.","LCNDH, art. 33"),
   Qn(T3,"Una autoridad recibe una recomendación y considera que no procede. ¿Puede la recomendación anular por sí misma el acto reclamado?","No, es pública y no imperativa y no anula ni modifica actos",["Sí, en todos los casos","Solo con aprobación del Senado"],"Carece de carácter imperativo.","LCNDH, art. 46"),
   Qn(T3,"Una autoridad recibe una recomendación. ¿En cuánto tiempo debe informar si la acepta?","Quince días hábiles",["Tres días","Treinta días naturales"],"Después dispone de otros quince para entregar pruebas de cumplimiento.","LCNDH, art. 46"),
   Qn(T3,"La autoridad aceptó la recomendación. ¿De cuánto tiempo dispone para entregar las pruebas de su cumplimiento?","Otros quince días, ampliables según la naturaleza de la recomendación",["Cinco días","Un año"],"El plazo puede ampliarse.","LCNDH, art. 46"),
   Qn(T3,"Quien preside la Comisión Nacional termina su primer periodo de cinco años. ¿Puede continuar?","Sí, puede ser reelecto por una sola vez",["No, no hay reelección","Sí, sin límite"],"La reelección es única.","LCNDH, art. 11"),
   Qn(T3,"¿Quién elige a la persona titular de la presidencia de la Comisión Nacional?","Dos terceras partes de los miembros presentes del Senado, o la Comisión Permanente en recesos",["El Presidente de la República","El Poder Judicial de la Federación"],"Se realiza tras una amplia auscultación social.","LCNDH, art. 10"),
   Qn(T3,"Seleccione uno de los principios que rigen la defensa y promoción de los derechos humanos.","Universalidad",["Territorialidad","Reciprocidad"],"También: interdependencia, indivisibilidad y progresividad.","LCNDH, art. 4")]},

 {t:"Víctimas y reparación integral", ley:"Ley General de Víctimas",
  cards:[
   Cn("Tipos de víctima","Directas: quienes sufren el daño por un delito o violación de derechos humanos. Indirectas: familiares o personas a cargo con relación inmediata. Potenciales: quienes peligran por asistir a la víctima. También lo son grupos, comunidades y organizaciones afectadas.","LGV, art. 4"),
   Cn("Cómo se adquiere la calidad","Con la acreditación del daño, aunque no se identifique, aprehenda o condene al responsable, y con independencia de que participe en un procedimiento.","LGV, art. 4"),
   Cn("Derechos","Investigación pronta y eficaz, reparación integral, conocer la verdad, protección, trato digno, ayuda y asistencia, y un recurso judicial adecuado y efectivo.","LGV, arts. 7 y 10"),
   Cn("Reparación integral","Restitución (devolver a la situación anterior), rehabilitación, compensación (perjuicios evaluables), satisfacción (restablecer la dignidad) y no repetición. Además: reparación colectiva, declaración que restablezca la dignidad y disculpa pública si participó un servidor público.","LGV, arts. 26 y 27"),
   Cn("Instituciones","La Comisión Ejecutiva es un organismo con personalidad jurídica y patrimonio propios y autonomía técnica y de gestión. El Registro Nacional de Víctimas es el mecanismo administrativo y técnico para su ingreso y registro.","LGV, arts. 84 y 96")],
  qs:[
   Qn(T3,"Una persona sufre lesiones por un delito. ¿Qué carácter tiene conforme a la ley?","Víctima directa",["Víctima indirecta","Víctima potencial"],"Es quien sufre el daño como consecuencia del delito.","LGV, art. 4"),
   Qn(T3,"Los hijos que dependen económicamente de la persona lesionada por un delito. ¿Qué carácter tienen?","Víctimas indirectas",["Víctimas directas","Víctimas potenciales"],"Son familiares o personas a cargo con relación inmediata.","LGV, art. 4"),
   Qn(T3,"Una vecina auxilia a la víctima de un delito y por ello su integridad corre peligro. ¿Qué carácter tiene?","Víctima potencial",["Víctima directa","Testigo sin calidad de víctima"],"Se protege a quien peligra por prestar asistencia.","LGV, art. 4"),
   Qn(T3,"El responsable de un delito no ha sido identificado ni detenido. ¿La persona afectada puede adquirir la calidad de víctima?","Sí, con la acreditación del daño, sin importar que se identifique o condene al responsable",["No, hasta que haya sentencia","Solo si participa en el juicio"],"La calidad no depende del proceso penal.","LGV, art. 4"),
   Qn(T3,"Una comunidad indígena ve afectados sus bienes jurídicos colectivos por un delito. ¿Puede ser víctima?","Sí, los grupos, comunidades u organizaciones sociales afectadas también lo son",["No, solo las personas físicas","Solo si tiene personalidad jurídica"],"La ley reconoce afectaciones a derechos colectivos.","LGV, art. 4"),
   Qn(T3,"A una víctima se le devuelve a la situación anterior a la violación de sus derechos. ¿Qué medida es?","Restitución",["Compensación","Satisfacción"],"Busca regresar a la situación previa.","LGV, art. 27"),
   Qn(T3,"Una víctima recibe atención para hacer frente a los efectos sufridos por el hecho. ¿Qué medida es?","Rehabilitación",["Restitución","No repetición"],"Facilita afrontar las consecuencias del hecho.","LGV, art. 27"),
   Qn(T3,"Se paga a una víctima por los perjuicios, sufrimientos y pérdidas económicamente evaluables. ¿Qué medida es?","Compensación",["Rehabilitación","Satisfacción"],"Debe ser proporcional a la gravedad del hecho.","LGV, art. 27"),
   Qn(T3,"Una declaración oficial restablece la dignidad y la reputación de la víctima. ¿Qué medida de reparación es?","Satisfacción",["Compensación","Restitución"],"Busca reconocer y restablecer la dignidad.","LGV, art. 27"),
   Qn(T3,"Se reforma un protocolo institucional para que el hecho no vuelva a ocurrir. ¿Qué medida es?","Medida de no repetición",["Compensación","Rehabilitación"],"Busca evitar que la violación se repita.","LGV, art. 27"),
   Qn(T3,"En un delito participó un agente de policía. ¿Qué medida específica procede además de la reparación?","Disculpa pública de reconocimiento de hechos y aceptación de responsabilidad",["Un exhorto interno","La condonación de multas"],"Aplica cuando participa un servidor público o agente de autoridad.","LGV, art. 27"),
   Qn(T3,"Un grupo social fue afectado por violaciones a los derechos individuales de sus miembros. ¿Qué reparación puede reclamar?","Reparación colectiva",["Solo reparación individual","Ninguna"],"Los grupos y comunidades son titulares de ese derecho.","LGV, art. 27"),
   Qn(T3,"Una víctima quiere que la autoridad le informe los resultados de las investigaciones sobre su caso. ¿Qué derecho ejerce?","El derecho a conocer la verdad",["El derecho a la compensación","El derecho a la restitución"],"La autoridad debe informar los resultados.","LGV, art. 7"),
   Qn(T3,"Una víctima pide que su caso se ingrese al Registro Nacional de Víctimas. ¿Qué es ese Registro?","El mecanismo administrativo y técnico que soporta el ingreso y registro de víctimas",["Un tribunal especializado","Un fondo de compensación"],"Facilita el acceso oportuno a las medidas de ayuda.","LGV, art. 96"),
   Qn(T3,"¿Cuál de estas NO es una medida de reparación integral?","La prisión preventiva del imputado",["La rehabilitación","La compensación"],"Las medidas son restitución, rehabilitación, compensación, satisfacción y no repetición.","LGV, art. 26"),
   Qn(T3,"¿Qué naturaleza tiene la Comisión Ejecutiva de Atención a Víctimas?","Organismo con personalidad jurídica, patrimonio propio y autonomía técnica y de gestión",["Dependencia centralizada sin patrimonio","Órgano del Poder Judicial"],"Sus recursos se asignan en el Presupuesto de Egresos.","LGV, art. 84")]},

 {t:"Correduría pública", ley:"Ley Federal de Correduría Pública",
  cards:[
   Cn("Autoridad y habilitación","Se aplica por el Ejecutivo Federal a través de la Secretaría de Economía. Solo se ostentan como corredores las personas habilitadas; si no, hay multa de hasta 500 veces el salario mínimo, diaria mientras persista, y responsabilidad penal.","Ley de Correduría, arts. 2 y 7"),
   Cn("Funciones","Agente mediador, perito valuador, asesor jurídico de comerciantes, árbitro, fedatario para contratos, convenios y actos mercantiles (excepto inmuebles), fedatario en la constitución de sociedades mercantiles y certificador de copias.","Ley de Correduría, art. 6"),
   Cn("Plaza","Puede ejercer fuera de su plaza, pero como fedatario solo dentro de la plaza para la que fue habilitado, aunque los actos se refieran a otro lugar. Cambiar de plaza requiere autorización de la Secretaría.","Ley de Correduría, art. 5"),
   Cn("Requisitos","Ciudadano mexicano por nacimiento que no adquiera otra nacionalidad, título de licenciado en derecho y cédula, sin condena por delito intencional con pena corporal, y aprobar el examen de aspirante y el definitivo para obtener la habilitación.","Ley de Correduría, art. 8"),
   Cn("Póliza y acta","Póliza: instrumento para hacer constar un acto jurídico, convenio o contrato mercantil. Acta: relación escrita de un hecho jurídico mercantil. Son instrumentos públicos y hacen prueba plena. El corredor lleva archivo y un libro de registro con volúmenes de 250 hojas foliadas.","Ley de Correduría, arts. 16 y 18")],
  qs:[
   Qn(T4,"Dos comerciantes piden a un corredor público que transmita propuestas entre ellos y asesore la celebración de un contrato mercantil. ¿Qué función ejerce?","Agente mediador",["Perito valuador","Árbitro"],"Transmite propuestas entre dos o más partes y asesora en contratos mercantiles.","Ley de Correduría, art. 6"),
   Qn(T4,"Una autoridad nombra a un corredor para estimar el valor de bienes y derechos. ¿Qué función ejerce?","Perito valuador",["Agente mediador","Fedatario"],"Estima, cuantifica y valora bienes, servicios, derechos y obligaciones.","Ley de Correduría, art. 6"),
   Qn(T4,"Dos empresas piden a un corredor que resuelva una controversia mercantil entre ellas. ¿Qué función ejerce?","Árbitro",["Perito valuador","Agente mediador"],"Actúa como árbitro a solicitud de las partes.","Ley de Correduría, art. 6"),
   Qn(T4,"Unos socios quieren constituir una sociedad mercantil con fe pública. ¿Qué puede hacer el corredor?","Actuar como fedatario en su constitución",["Solo valuar el capital","Nada, solo lo hace un notario"],"La ley lo faculta como fedatario en actos de la Ley General de Sociedades Mercantiles.","Ley de Correduría, art. 6"),
   Qn(T4,"Una persona pide a un corredor que haga constar la compraventa de un inmueble. ¿Puede hacerlo?","No, su fe pública en actos mercantiles excluye los inmuebles",["Sí, en cualquier caso","Solo si el inmueble es comercial"],"Los inmuebles quedan fuera de su fe pública.","Ley de Correduría, art. 6"),
   Qn(T4,"Un corredor habilitado en una plaza quiere actuar como fedatario en otra plaza. ¿Puede?","No, como fedatario solo dentro de su plaza, aunque los actos se refieran a otro lugar",["Sí, en cualquier plaza","Sí, con aviso al colegio"],"Fuera de su plaza puede ejercer otras funciones.","Ley de Correduría, art. 5"),
   Qn(T4,"Un corredor quiere cambiar de plaza. ¿Qué necesita?","Autorización de la Secretaría de Economía",["Aprobación del colegio local","Nada, es libre"],"Solo puede cambiar de plaza previa autorización.","Ley de Correduría, art. 5"),
   Qn(T4,"Una persona sin habilitación se ostenta como corredor público. ¿Qué consecuencia enfrenta?","Multa de hasta 500 veces el salario mínimo, diaria mientras persista, sin perjuicio de la responsabilidad penal",["Solo una amonestación","Ninguna"],"Solo pueden ostentarse quienes fueron habilitados.","Ley de Correduría, art. 7"),
   Qn(T4,"Un abogado mexicano por nacimiento, con título y cédula, sin condena por delito intencional, quiere ser corredor. ¿Qué más necesita?","Aprobar el examen de aspirante y el definitivo y obtener la habilitación",["Ser notario","Tener cinco años de litigio"],"Son los requisitos que completan el artículo 8.","Ley de Correduría, art. 8"),
   Qn(T4,"Una persona naturalizada mexicana aspira a ser corredor público. ¿Cumple el requisito de nacionalidad?","No, se requiere ser ciudadano mexicano por nacimiento",["Sí, basta ser mexicana","Sí, con autorización de la Secretaría"],"Además no debe adquirir otra nacionalidad.","Ley de Correduría, art. 8"),
   Qn(T4,"Se integra el jurado del examen definitivo para aspirantes a corredor. ¿Quién debe estar presente para que pueda celebrarse?","El representante de la Secretaría de Economía",["El representante del Poder Judicial","Un notario público"],"Sin su presencia no puede celebrarse el examen.","Ley de Correduría, art. 10"),
   Qn(T4,"¿Cómo debe llevar su archivo un corredor?","Diariamente, por orden de fecha y con numeración progresiva, con extracto en el libro de registro",["Por materias, sin numeración","Solo con copias digitales"],"El libro se forma de volúmenes de doscientas cincuenta hojas foliadas.","Ley de Correduría, art. 16"),
   Qn(T4,"Un corredor deja de ejercer. ¿A quién se entrega su libro de registro y archivo?","Al colegio de corredores respectivo o, si no lo hay, a la Secretaría",["Al Archivo General de la Nación","A su heredero"],"Es una regla para su guarda.","Ley de Correduría, art. 17"),
   Qn(T4,"Un corredor redacta el instrumento para hacer constar un contrato mercantil en el que puede intervenir como fedatario. ¿Cómo se llama?","Póliza",["Acta","Escritura pública"],"La póliza recoge actos, convenios o contratos mercantiles.","Ley de Correduría, art. 18"),
   Qn(T4,"Un corredor deja constancia escrita de un hecho jurídico de naturaleza mercantil. ¿Cómo se llama ese instrumento?","Acta",["Póliza","Escritura pública"],"El acta es la relación escrita de un hecho jurídico mercantil.","Ley de Correduría, art. 18"),
   Qn(T4,"¿Qué dependencia aplica la Ley Federal de Correduría Pública?","La Secretaría de Economía",["La Secretaría de Gobernación","La Secretaría de Hacienda"],"Con la participación de las autoridades estatales.","Ley de Correduría, art. 2")]},

 {t:"Propiedad industrial", ley:"Ley Federal de Protección a la Propiedad Industrial",
  cards:[
   Cn("Autoridad","La aplicación administrativa corresponde al Ejecutivo Federal por conducto del Instituto Mexicano de la Propiedad Industrial. En lo no previsto se aplica primero la Ley Federal de Procedimiento Administrativo.","LFPPI, arts. 1 y 3"),
   Cn("Patentes","Vigencia de veinte años improrrogables. No se consideran invenciones los descubrimientos, los métodos matemáticos, las obras literarias o artísticas, los programas de computación y las formas de presentar información, entre otros.","LFPPI, arts. 47 y 53"),
   Cn("Otras figuras y vigencias","Modelos de utilidad: 15 años improrrogables. Diseños industriales: 5 años, renovables hasta 25. Esquemas de trazado de circuitos integrados: 10 años improrrogables.","LFPPI, arts. 62, 78 y 87"),
   Cn("Marcas","Signo perceptible que distingue productos o servicios. Vigencia de diez años, renovable por periodos iguales, con declaración bajo protesta de que los productos o servicios están libres de engaño. Caduca si no se usa tres años consecutivos.","LFPPI, arts. 171, 178 y 235"),
   Cn("Avisos y nombres comerciales","El registro de un aviso comercial dura diez años. El nombre comercial está protegido sin necesidad de registro en la zona de la clientela efectiva, y en toda la República si hay difusión masiva y constante a nivel nacional.","LFPPI, arts. 204 y 206"),
   Cn("Marca notoria","Es notoriamente conocida cuando un sector determinado del público o de los círculos comerciales la conoce por actividades comerciales o por su promoción. Es famosa cuando la conoce la mayoría del público.","LFPPI, art. 190")],
  qs:[
   Qn(T4,"Un inventor obtiene una patente. ¿Cuánto dura su vigencia?","Veinte años improrrogables",["Diez años renovables","Quince años improrrogables"],"No admite prórroga.","LFPPI, art. 53"),
   Qn(T4,"Un empresario registra un modelo de utilidad. ¿Cuál es su vigencia?","Quince años improrrogables",["Veinte años renovables","Cinco años renovables"],"Se cuenta desde la presentación de la solicitud.","LFPPI, art. 62"),
   Qn(T4,"Una diseñadora registra un diseño industrial. ¿Cuánto dura y hasta cuándo puede renovarse?","Cinco años, renovables por periodos iguales hasta un máximo de veinticinco",["Diez años improrrogables","Veinte años renovables sin límite"],"Su renovación se sujeta al pago de tarifas.","LFPPI, art. 78"),
   Qn(T4,"Una empresa registra un esquema de trazado de circuitos integrados. ¿Cuál es su vigencia?","Diez años improrrogables",["Cinco años renovables","Veinte años renovables"],"No se puede prorrogar.","LFPPI, art. 87"),
   Qn(T4,"Una empresa obtiene el registro de su marca. ¿Cuánto dura?","Diez años, renovables por periodos de la misma duración",["Cinco años improrrogables","Veinte años improrrogables"],"Al renovar se declara bajo protesta que no hay engaño ni mala fe.","LFPPI, art. 178"),
   Qn(T4,"Una empresa registra un aviso comercial. ¿Cuánto dura su registro?","Diez años",["Cinco años","Veinte años"],"Se cuenta a partir de su otorgamiento.","LFPPI, art. 204"),
   Qn(T4,"Una panadería usa el nombre comercial de su negocio sin haberlo registrado. ¿Está protegido?","Sí, sin necesidad de registro, en la zona de su clientela efectiva",["No, solo si se registra","Sí, en toda la República siempre"],"La protección es local salvo difusión masiva y constante nacional.","LFPPI, art. 206"),
   Qn(T4,"Ese nombre comercial tiene difusión masiva y constante a nivel nacional. ¿Qué alcance tiene su protección?","Se extiende a toda la República",["Sigue limitada a la zona de la clientela","Se extiende al extranjero"],"La difusión nacional amplía el alcance.","LFPPI, art. 206"),
   Qn(T4,"Una marca registrada no se usa durante tres años consecutivos para los productos que ampara. ¿Qué procede?","La caducidad del registro, total o parcial",["La renovación automática","La cesión obligatoria"],"Salvo que exista uso por su titular o licenciatario.","LFPPI, art. 235"),
   Qn(T4,"Un programador solicita una patente para su programa de computación. ¿Es patentable?","No, los programas de computación no se consideran invenciones",["Sí, siempre","Sí, si es original"],"Se protegen por derechos de autor.","LFPPI, art. 47"),
   Qn(T4,"Una escritora pretende patentar su novela. ¿Procede?","No, las obras literarias no se consideran invenciones",["Sí, por su novedad","Sí, si tiene aplicación industrial"],"Son creaciones estéticas, no invenciones patentables.","LFPPI, art. 47"),
   Qn(T4,"Una marca es conocida por un sector determinado del público a consecuencia de actividades comerciales. ¿Cómo se considera?","Notoriamente conocida",["Famosa","Aviso comercial"],"Es famosa cuando la conoce la mayoría del público.","LFPPI, art. 190"),
   Qn(T4,"Al solicitar el registro de una marca, ¿qué declara la persona interesada?","Bajo protesta de decir verdad, que los productos o servicios están libres de engaño o mala fe",["Que ningún tercero usa un signo similar","Que pagó el impuesto sobre la renta"],"Si se viola una ley aplicable, el Instituto puede iniciar la nulidad.","LFPPI, art. 178"),
   Qn(T4,"Sobre lo que la ley no prevé, ¿qué ordenamiento se aplica primero de manera supletoria?","La Ley Federal de Procedimiento Administrativo",["El Código Penal Federal","La Ley Federal del Trabajo"],"Después, el Código Nacional de Procedimientos Civiles y Familiares.","LFPPI, art. 3"),
   Qn(T4,"¿Qué es una marca según la ley?","Todo signo perceptible por los sentidos y susceptible de representarse que distinga productos o servicios en el mercado",["Todo invento con aplicación industrial","Toda obra literaria o artística"],"Debe permitir determinar el objeto de la protección.","LFPPI, art. 171"),
   Qn(T4,"¿Qué autoridad aplica administrativamente la Ley Federal de Protección a la Propiedad Industrial?","El Ejecutivo Federal por conducto del Instituto Mexicano de la Propiedad Industrial",["El Instituto Nacional del Derecho de Autor","La Comisión Federal de Competencia"],"Así lo dispone el artículo 1.","LFPPI, art. 1")]},

 {t:"Derecho de autor", ley:"Ley Federal del Derecho de Autor",
  cards:[
   Cn("Protección","Desde que la obra se fija en un soporte material, sin importar su mérito, destino o modo de expresión. No requiere registro ni formalidad alguna. El Registro Público da seguridad jurídica y publicidad, pero las obras quedan protegidas aunque no se registren.","LFDA, arts. 5 y 162"),
   Cn("Ramas","Literaria, musical, dramática, danza, pictórica, escultórica, caricatura e historieta, arquitectónica, cinematográfica y audiovisual, radio y televisión, programas de cómputo, fotográfica, arte aplicado y de compilación.","LFDA, art. 13"),
   Cn("Derecho moral","Corresponde al autor, único, primigenio y perpetuo titular. Es inalienable, imprescriptible, irrenunciable e inembargable. Permite decidir la divulgación, exigir reconocimiento de autor, divulgar de forma anónima o seudónima y exigir respeto a la obra.","LFDA, arts. 18, 19 y 21"),
   Cn("Derecho patrimonial","Permite explotar la obra de forma exclusiva o autorizar su explotación. Vigencia: vida del autor más cien años (desde la muerte del último coautor). Toda transmisión es onerosa y temporal.","LFDA, arts. 24, 29 y 30"),
   Cn("Obra por encargo","Salvo pacto en contrario, quien comisiona o produce la obra con colaboración remunerada tiene la titularidad patrimonial. Quienes participan tienen derecho a que se les mencione como autores.","LFDA, art. 83"),
   Cn("Reserva de derechos e Instituto","La reserva de derechos permite usar y explotar en exclusiva títulos, nombres y características distintivas, por ejemplo de publicaciones periódicas. El Instituto Nacional del Derecho de Autor es un órgano desconcentrado de la Secretaría de Cultura.","LFDA, arts. 173 y 208")],
  qs:[
   Qn(T4,"Una escritora termina su novela y la guarda en su computadora, sin registrarla. ¿Está protegida?","Sí, desde que se fija en un soporte material, sin registro ni formalidad",["No, solo desde su registro","Solo si se publica"],"El reconocimiento no exige registro.","LFDA, art. 5"),
   Qn(T4,"Un fotógrafo toma imágenes originales para un reportaje. ¿Están dentro de las ramas de obras protegidas?","Sí, la rama fotográfica",["No, solo las obras literarias","Solo si se exponen"],"La fotográfica es una de las ramas del artículo 13.","LFDA, art. 13"),
   Qn(T4,"Una desarrolladora crea un programa de cómputo. ¿Está en una rama de obras protegidas por derecho de autor?","Sí, los programas de cómputo son una rama protegida",["No, solo los protege la propiedad industrial","No, solo las obras artísticas"],"La ley los incluye expresamente.","LFDA, art. 13"),
   Qn(T4,"Una autora vende todos sus derechos y cree haber perdido el derecho moral. ¿Es así?","No, el derecho moral es inalienable, imprescriptible, irrenunciable e inembargable",["Sí, se transmite con la venta","Sí, por diez años"],"Sigue unido al autor.","LFDA, art. 19"),
   Qn(T4,"Un editor deforma y mutila una obra sin permiso del autor. ¿Qué derecho moral ejerce el autor?","Exigir respeto a la obra y oponerse a toda deformación o mutilación",["Explotar la obra en exclusiva","Cobrar regalías por cien años"],"Es una facultad del derecho moral.","LFDA, art. 21"),
   Qn(T4,"Un autor quiere divulgar su obra sin su nombre verdadero. ¿Puede?","Sí, puede disponer que se divulgue como anónima o seudónima",["No, siempre debe usar su nombre","Solo con permiso del Instituto"],"Es parte del derecho moral.","LFDA, art. 21"),
   Qn(T4,"Una obra tiene un solo autor. ¿Cuánto duran los derechos patrimoniales?","La vida del autor y cien años más a partir de su muerte",["Cincuenta años desde la divulgación","Su vida únicamente"],"Es la regla general del artículo 29.","LFDA, art. 29"),
   Qn(T4,"Una obra tiene tres coautores. ¿Desde cuándo se cuentan los cien años posteriores?","Desde la muerte del último coautor",["Desde la muerte del primero","Desde la divulgación"],"Así lo precisa la ley.","LFDA, art. 29"),
   Qn(T4,"Una editorial adquiere los derechos patrimoniales de un autor. ¿Cómo debe ser la transmisión?","Onerosa y temporal",["Gratuita y perpetua","Onerosa y perpetua"],"Los tribunales fijan la remuneración si no hay acuerdo.","LFDA, art. 30"),
   Qn(T4,"Una agencia comisiona un jingle y lo produce con colaboración remunerada, sin pacto alguno. ¿Quién tiene los derechos patrimoniales?","La agencia que comisiona y produce la obra",["El compositor exclusivamente","Nadie, hasta su registro"],"Salvo pacto en contrario.","LFDA, art. 83"),
   Qn(T4,"Las personas que participaron en esa obra de forma remunerada, ¿qué derecho conservan?","Que se les mencione expresamente su calidad de autor, artista, intérprete o ejecutante",["Los derechos patrimoniales","Ninguno"],"Es un derecho aun en obras por encargo.","LFDA, art. 83"),
   Qn(T4,"Una revista quiere usar en exclusiva el título de su publicación periódica. ¿Qué figura le corresponde?","La reserva de derechos",["El derecho moral","El registro de una patente"],"Protege títulos y nombres distintivos de ciertos géneros.","LFDA, art. 173"),
   Qn(T4,"Un músico compone una canción y no la registra ante el Instituto. Un tercero la explota sin autorización. ¿Puede reclamar?","Sí, la obra está protegida aunque no se registre",["No, sin registro no hay derechos","Solo si la vende primero"],"El registro da publicidad, pero no es requisito.","LFDA, arts. 5 y 162"),
   Qn(T4,"¿Quién es la autoridad administrativa en materia de derechos de autor?","El Instituto Nacional del Derecho de Autor, órgano desconcentrado de la Secretaría de Cultura",["El Instituto Mexicano de la Propiedad Industrial","La Procuraduría Federal del Consumidor"],"Así lo dispone el artículo 208.","LFDA, art. 208"),
   Qn(T4,"¿Qué garantiza el Registro Público del Derecho de Autor?","La seguridad jurídica de autores y titulares y la publicidad de obras, actos y documentos",["La titularidad exclusiva de quien registra primero","La protección solo de obras registradas"],"Las obras quedan protegidas aun sin registro.","LFDA, art. 162"),
   Qn(T4,"¿Cómo se llaman las dos clases de prerrogativas del derecho de autor?","Derecho moral y derecho patrimonial",["Derecho real y derecho personal","Derecho público y derecho privado"],"Los primeros son personales y los segundos patrimoniales.","LFDA, art. 11")]}
]);

 {t:"Acuerdos reparatorios", ley:"Código Nacional de Procedimientos Penales",

   Cn("Qué es","Acuerdo entre la víctima u ofendido y el imputado que, aprobado por el Ministerio Público o el Juez de control y cumplido en sus términos, extingue la acción penal.","CNPP, art. 186"),
   Cn("Cuándo procede","En delitos de querella o que admiten perdón, delitos culposos y delitos patrimoniales sin violencia. No procede si el imputado celebró antes acuerdos por los mismos delitos dolosos, en violencia familiar, ni si incumplió un acuerdo previo (salvo absolución).","CNPP, art. 187"),

   Qn(T2,"Se dictó auto de vinculación a proceso y aún no se abre juicio. Las partes necesitan tiempo para concretar el acuerdo. ¿Qué puede hacer el Juez de control?","Suspender el proceso hasta por treinta días, a petición de las partes",["Cerrar la investigación","Ordenar el juicio oral inmediato"],"Lo hace con apoyo de la autoridad especializada.","CNPP, art. 188"),
   Qn(T2,"Víctima e imputado quieren celebrar un acuerdo reparatorio cuando ya se dictó el auto de apertura de juicio. ¿Pueden?","No, procede hasta antes de ese auto",["Sí, en cualquier momento","Solo en la audiencia de juicio"],"El límite es el auto de apertura de juicio.","CNPP, art. 188"),
   Qn(T2,"Las partes pactan un cumplimiento diferido sin señalar plazo. ¿Cuál se entiende?","Un año",["Seis meses","Tres años"],"Es el plazo supletorio de la ley.","CNPP, art. 189"),
   Qn(T2,"Durante el plazo de cumplimiento diferido de un acuerdo reparatorio, ¿qué ocurre con el proceso y la prescripción?","Se suspenden el trámite del proceso y la prescripción de la acción penal",["Solo se suspende la prescripción","Continúan sin cambios"],"El plazo de cumplimiento tiene ese efecto.","CNPP, art. 189"),
   Qn(T2,"El imputado incumple sin justa causa lo pactado en un acuerdo reparatorio. ¿Qué ocurre?","La investigación o el proceso continúa como si no se hubiera celebrado acuerdo",["Se extingue la acción penal","Se archiva el asunto"],"El acuerdo pierde efectos si no se cumple.","CNPP, art. 189"),
   Qn(T2,"El Ministerio Público aprueba un acuerdo en la investigación inicial y una parte cree que el mecanismo no se desarrolló conforme a la ley. ¿En cuánto tiempo puede acudir al Juez de control?","Dentro de los cinco días siguientes a la aprobación",["Dentro de treinta días","En cualquier momento"],"El juez puede declarar como no celebrado el acuerdo.","CNPP, art. 190"),
   Qn(T2,"Antes de aprobar un acuerdo reparatorio, ¿qué debe verificar el Juez de control o el Ministerio Público?","Que las obligaciones no sean notoriamente desproporcionadas y que no hubo intimidación, amenaza o coacción",["Que la víctima haya sido indemnizada en efectivo","Que el imputado confiese el delito"],"También que hubo igualdad para negociar.","CNPP, art. 190"),
   Qn(T2,"El imputado cumplió plenamente las obligaciones de un acuerdo reparatorio. ¿Qué decreta el juez?","La extinción de la acción penal, con efecto de sentencia ejecutoriada",["Una condena reducida","La suspensión del proceso"],"Así concluye el proceso por esa vía.","CNPP, art. 189"),
   Qn(T2,"¿Cuál de estas es una solución alterna del procedimiento penal?","El acuerdo reparatorio",["El procedimiento abreviado","La prisión preventiva"],"El abreviado es forma de terminación anticipada.","CNPP, arts. 184 y 185"),
   Qn(T2,"¿Qué información generada por un acuerdo reparatorio puede usarse en perjuicio de las partes dentro del proceso penal?","Ninguna",["Toda la aportada por el imputado","La aportada por la víctima"],"La ley prohíbe usarla en su perjuicio.","CNPP, art. 189")]},

 {t:"Suspensión condicional del proceso", ley:"Código Nacional de Procedimientos Penales",
  cards:[
   Cn("Qué es","Planteamiento del Ministerio Público o del imputado con un plan detallado de reparación del daño y sometimiento a condiciones. Si se cumple, extingue la acción penal.","CNPP, art. 191"),
   Cn("Procedencia","Solicitud del imputado o del Ministerio Público con su acuerdo. Requiere vinculación por un delito cuya media aritmética de pena no exceda cinco años, sin oposición fundada de la víctima, y dos años desde el cumplimiento o cinco desde el incumplimiento de una suspensión anterior.","CNPP, art. 192"),
   Cn("Oportunidad y plan","Tras la vinculación y hasta antes de la apertura de juicio; no impide la acción civil. En la audiencia el imputado plantea un plan de reparación y plazos.","CNPP, arts. 193 y 194"),
   Cn("Plazo y condiciones","El Juez de control fija un plazo de seis meses a tres años e impone una o varias condiciones: residir en un lugar, abstenerse de drogas, programas contra adicciones, capacitación, servicio social, tratamiento médico o psicológico, tener empleo, entre otras.","CNPP, art. 195"),
   Cn("Trámite","La víctima es citada, pero su ausencia no impide resolver. La sola falta de recursos del imputado no basta para rechazar. La información generada no se usa si el proceso continúa.","CNPP, art. 196"),
   Cn("Revocación y extinción","Se revoca si se incumplen condiciones o plan, o si hay condena posterior. El plazo puede ampliarse hasta dos años más, una sola vez. Interrumpe la prescripción; cumplido el plan, se extingue la acción penal y se decreta el sobreseimiento.","CNPP, arts. 198 y 199")],
  qs:[
   Qn(T2,"Un imputado, vinculado a proceso por un delito con media aritmética de pena de cuatro años, pide la suspensión condicional. ¿Cumple ese requisito?","Sí, la media aritmética no excede cinco años",["No, debe ser menor de un año","No, solo procede en delitos culposos"],"Es el primer requisito del artículo 192.","CNPP, art. 192"),
   Qn(T2,"El delito tiene una media aritmética de pena de siete años. ¿Procede la suspensión condicional?","No, la media aritmética excede cinco años",["Sí, si el imputado repara el daño","Sí, con acuerdo del Ministerio Público"],"El límite es de cinco años.","CNPP, art. 192"),
   Qn(T2,"La víctima se opone con fundamento a la suspensión condicional. ¿Procede?","No, se requiere que no exista oposición fundada",["Sí, la oposición no cuenta","Solo si el Ministerio Público insiste"],"La oposición fundada impide la suspensión.","CNPP, art. 192"),
   Qn(T2,"Un imputado cumplió una suspensión condicional anterior hace un año y pide otra. ¿Procede?","No, deben haber transcurrido dos años desde el cumplimiento",["Sí, sin espera","Sí, si paga una fianza"],"Es el tercer requisito de procedencia.","CNPP, art. 192"),
   Qn(T2,"Un imputado incumplió una suspensión anterior hace tres años y pide otra. ¿Procede?","No, deben transcurrir cinco años desde el incumplimiento",["Sí, tras dos años","Sí, tras un año"],"Salvo que haya sido absuelto en ese procedimiento.","CNPP, art. 192"),
   Qn(T2,"El auto de apertura de juicio ya se acordó. ¿Puede solicitarse la suspensión condicional?","No, se solicita tras la vinculación y hasta antes de la apertura de juicio",["Sí, en cualquier etapa","Solo en la sentencia"],"Ese es el momento procesal.","CNPP, art. 193"),
   Qn(T2,"En la audiencia sobre la suspensión condicional, ¿qué debe plantear el imputado?","Un plan de reparación del daño y plazos para cumplirlo",["Su confesión del delito","Un pago inmediato en efectivo"],"El juez puede modificar el plan.","CNPP, art. 194"),
   Qn(T2,"El Juez de control concede la suspensión condicional. ¿Qué plazo puede fijar?","No menor de seis meses ni mayor de tres años",["De uno a cinco años","De tres meses a un año"],"Es el rango del artículo 195.","CNPP, art. 195"),
   Qn(T2,"Como condición, el juez ordena abstenerse de consumir drogas y participar en un programa contra las adicciones. ¿Es una condición válida?","Sí, son condiciones previstas por la ley",["No, solo procede residir en un lugar","No, corresponde al Ministerio Público"],"La lista es enunciativa y no limitativa.","CNPP, art. 195"),
   Qn(T2,"La víctima, debidamente citada, no asiste a la audiencia de suspensión condicional. ¿Puede el juez resolver?","Sí, su incomparecencia no lo impide",["No, debe repetirse la audiencia","Solo si el imputado consiente"],"Se resuelve sobre la procedencia y términos de la solicitud.","CNPP, art. 196"),
   Qn(T2,"El imputado carece de recursos económicos. ¿Puede rechazarse la suspensión solo por eso?","No, la falta de recursos no es razón suficiente",["Sí, siempre","Solo si la víctima lo pide"],"Así lo dispone el artículo 196.","CNPP, art. 196"),
   Qn(T2,"El imputado deja de cumplir injustificadamente las condiciones. ¿Qué procede?","Una audiencia para debatir la revocación de la suspensión",["La extinción de la acción penal","Su libertad definitiva"],"El juez resuelve de inmediato lo que proceda.","CNPP, art. 198"),
   Qn(T2,"El Juez de control quiere ampliar el plazo de la suspensión. ¿Cuánto y cuántas veces puede hacerlo?","Hasta dos años más, por una sola vez",["Hasta un año más, sin límite","Hasta cinco años, dos veces"],"La ampliación es única.","CNPP, art. 198"),
   Qn(T2,"El imputado cumplió las condiciones y el plan en el plazo, sin revocación. ¿Qué decreta el juez?","La extinción de la acción penal mediante el sobreseimiento",["Una sentencia condenatoria","La reapertura de la investigación"],"Puede hacerlo de oficio o a petición de parte.","CNPP, art. 199"),
   Qn(T2,"¿Qué efecto tiene la suspensión condicional sobre la prescripción de la acción penal?","La interrumpe",["No la afecta","La acelera"],"Así lo dice el artículo 199.","CNPP, art. 199"),
   Qn(T2,"¿Quién puede solicitar la suspensión condicional del proceso?","El imputado, o el Ministerio Público con acuerdo de aquél",["Solo la víctima","Solo el Juez de control"],"Es la regla del artículo 192.","CNPP, art. 192")]},

 {t:"Procedimiento abreviado", ley:"Código Nacional de Procedimientos Penales",
  cards:[
   Cn("Naturaleza y requisitos","Es una forma de terminación anticipada del proceso. El Juez de control verifica que el Ministerio Público lo solicite con la acusación y los datos de prueba, que la víctima no presente oposición fundada y que el imputado esté informado, renuncie expresamente al juicio oral y consienta el procedimiento.","CNPP, arts. 185 y 201"),
   Cn("Oportunidad","Después del auto de vinculación a proceso y hasta antes del auto de apertura a juicio oral. La ausencia de la víctima, debidamente citada, no impide que el juez se pronuncie.","CNPP, art. 202"),
   Cn("Reducción de la pena","Sin condena previa por delito doloso y con media aritmética de hasta cinco años: hasta la mitad de la pena mínima en dolosos y hasta dos terceras partes en culposos. En cualquier caso: hasta un tercio de la mínima en dolosos y hasta una mitad en culposos.","CNPP, art. 202"),
   Cn("Admisión","El juez admite la solicitud si existen medios de convicción que corroboren la imputación. Si no la admite, se tiene por no formulada la acusación, continúa el procedimiento ordinario y se eliminan los antecedentes. Puede presentarse de nuevo si se subsanan inconsistencias.","CNPP, art. 203"),
   Cn("Oposición y sentencia","La oposición de la víctima solo procede si no está garantizada la reparación del daño. El juez emite el fallo en la misma audiencia y da lectura y explicación pública de la sentencia en 48 horas. No puede imponer una pena distinta o mayor a la solicitada y aceptada. Varios coimputados no impiden aplicarlo individualmente.","CNPP, arts. 204, 206 y 207")],
  qs:[
   Qn(T2,"Un imputado ya vinculado a proceso quiere renunciar al juicio oral y aceptar el procedimiento abreviado. ¿Quién debe solicitarlo al juez?","El Ministerio Público, con la acusación y los datos de prueba",["El propio imputado, sin acusación","La víctima"],"El Ministerio Público formula la acusación y expone los datos de prueba.","CNPP, art. 201"),
   Qn(T2,"Ya se dictó el auto de apertura a juicio oral. ¿Puede el Ministerio Público solicitar el procedimiento abreviado?","No, solo hasta antes de ese auto",["Sí, hasta la sentencia","Solo en la apelación"],"La oportunidad va de la vinculación a la apertura a juicio.","CNPP, art. 202"),
   Qn(T2,"La víctima, debidamente citada, no comparece a la audiencia del procedimiento abreviado. ¿Puede el juez pronunciarse?","Sí, su incomparecencia no lo impide",["No, debe repetirse la audiencia","Solo si el imputado lo pide"],"Así lo dispone el artículo 202.","CNPP, art. 202"),
   Qn(T2,"La víctima se opone al procedimiento abreviado porque el daño no está garantizado. ¿Qué efecto tiene su oposición?","Es procedente y vinculante, por estar fundada",["No tiene efecto alguno","Suspende el proceso por un año"],"La oposición solo procede si no está garantizada la reparación del daño.","CNPP, arts. 201 y 204"),
   Qn(T2,"La víctima se opone sin acreditar que la reparación no está garantizada. ¿Qué efecto tiene?","No vincula al juez",["Impide el procedimiento","Obliga a repetir la audiencia"],"Solo la oposición fundada es vinculante.","CNPP, arts. 201 y 204"),
   Qn(T2,"Un acusado sin condena previa por delito doloso enfrenta un delito doloso con media aritmética de cuatro años. ¿Qué reducción máxima puede solicitar el Ministerio Público sobre la pena mínima?","Hasta la mitad",["Hasta dos terceras partes","Hasta tres cuartas partes"],"Es la reducción para delitos dolosos en ese supuesto.","CNPP, art. 202"),
   Qn(T2,"El delito es culposo, con media aritmética menor de cinco años, y el acusado no tiene condena previa por delito doloso. ¿Qué reducción máxima puede pedirse sobre la pena mínima?","Hasta dos terceras partes",["Hasta la mitad","Hasta un tercio"],"La ley prevé mayor reducción en culposos.","CNPP, art. 202"),
   Qn(T2,"El acusado tiene una condena previa por delito doloso y se le imputa otro delito doloso. ¿Qué reducción máxima puede pedirse sobre la pena mínima?","Hasta un tercio",["Hasta la mitad","Ninguna"],"Es la regla aplicable en cualquier caso.","CNPP, art. 202"),
   Qn(T2,"Existen medios de convicción que corroboran la imputación y se cumplen los requisitos. ¿Qué hace el Juez de control?","Admite la solicitud del Ministerio Público",["La rechaza de oficio","Ordena el juicio oral"],"Verifica los medios de convicción de la carpeta de investigación.","CNPP, art. 203"),
   Qn(T2,"El juez no admite el procedimiento abreviado. ¿Qué pasa con la acusación oral del Ministerio Público?","Se tiene por no formulada y se continúa el procedimiento ordinario",["Queda firme para el juicio","Se convierte en sentencia"],"Además se eliminan del registro los antecedentes.","CNPP, art. 203"),
   Qn(T2,"La solicitud no se admitió por inconsistencias en los planteamientos del Ministerio Público. ¿Puede presentarla de nuevo?","Sí, una vez subsanados los defectos",["No, nunca","Solo con autorización del imputado"],"La ley lo permite expresamente.","CNPP, art. 203"),
   Qn(T2,"Concluido el debate del procedimiento abreviado, ¿qué debe hacer el Juez de control?","Emitir su fallo en la misma audiencia y dar lectura y explicación pública de la sentencia en 48 horas",["Esperar diez días para resolver","Remitir el asunto a un tribunal de juicio"],"Debe explicar de forma concisa fundamentos y motivos.","CNPP, art. 206"),
   Qn(T2,"El juez pretende imponer una pena mayor a la que solicitó el Ministerio Público y aceptó el acusado. ¿Puede?","No, no puede imponer una pena distinta o de mayor alcance",["Sí, si lo considera justo","Solo si la víctima lo pide"],"La pena está limitada a lo solicitado y aceptado.","CNPP, art. 206"),
   Qn(T2,"Hay varios coimputados y solo uno acepta el procedimiento abreviado. ¿Puede aplicarse?","Sí, en forma individual",["No, deben aceptarlo todos","Solo si la víctima lo autoriza"],"La existencia de coimputados no lo impide.","CNPP, art. 207"),
   Qn(T2,"¿Qué naturaleza tiene el procedimiento abreviado?","Forma de terminación anticipada del proceso",["Solución alterna del procedimiento","Medida cautelar"],"Las soluciones alternas son el acuerdo reparatorio y la suspensión condicional.","CNPP, art. 185"),
   Qn(T2,"Seleccione un requisito que debe cumplir el imputado para el procedimiento abreviado.","Renunciar expresamente al juicio oral",["Pagar una fianza","Declarar ante la víctima"],"También debe estar informado y consentir su aplicación.","CNPP, art. 201")]},

 {t:"Mecanismos alternativos en materia penal", ley:"Ley Nacional de Mecanismos Alternativos de Solución de Controversias en Materia Penal",
  cards:[
   Cn("Objeto","Establecer los principios, bases, requisitos y condiciones de los mecanismos alternativos que conduzcan a las soluciones alternas, mediante diálogo, oralidad, economía procesal y confidencialidad.","LNMASCMP, art. 1"),
   Cn("Principios","Voluntariedad, información, confidencialidad, flexibilidad y simplicidad, imparcialidad, equidad y honestidad. La confidencialidad cede si se está cometiendo o es inminente un delito que ponga en peligro la vida o la integridad de una persona: el facilitador lo comunica al Ministerio Público.","LNMASCMP, art. 4"),
   Cn("Oportunidad y prescripción","Pueden aplicarse desde el inicio del procedimiento y hasta antes del auto de apertura a juicio o de las conclusiones. La prescripción de la acción penal se suspende desde la primera sesión hasta la conclusión.","LNMASCMP, arts. 6 y 18"),
   Cn("Mediación, conciliación y junta restaurativa","Mediación: el facilitador propicia la comunicación y las partes construyen las opciones; las sesiones son orales y solo se registra el acuerdo. Conciliación: el facilitador puede presentar alternativas con criterios objetivos. Junta restaurativa: participan víctima, imputado y, en su caso, la comunidad afectada.","LNMASCMP, arts. 21 a 27"),
   Cn("Detención y medidas cautelares","Si el imputado está detenido por flagrancia, el Ministerio Público puede disponer su libertad durante la investigación (artículo 140 del CNPP). Si tiene prisión preventiva, se modifica la medida (artículo 161 del CNPP).","LNMASCMP, art. 20"),
   Cn("Acuerdos y facilitadores","El acuerdo es válido y exigible. El Ministerio Público o el Juez aprueban su cumplimiento y resuelven la extinción de la acción o el sobreseimiento, con efectos de sentencia ejecutoriada; el incumplimiento continúa el procedimiento. La certificación de facilitadores dura tres años, renovable.","LNMASCMP, arts. 34, 35 y 49")],
  qs:[
   Qn(T2,"En un mecanismo, el facilitador propicia la comunicación y el entendimiento mutuo entre víctima e imputado, y ellos construyen las opciones. ¿Qué mecanismo es?","Mediación",["Conciliación","Junta restaurativa"],"Es el concepto del artículo 21.","LNMASCMP, art. 21"),
   Qn(T2,"El facilitador, sobre la base de criterios objetivos, presenta alternativas de solución diversas. ¿Qué mecanismo aplica?","Conciliación",["Mediación","Junta restaurativa"],"Además de propiciar la comunicación, puede proponer alternativas.","LNMASCMP, art. 25"),
   Qn(T2,"Participan la víctima, el imputado y la comunidad afectada para buscar un acuerdo que atienda necesidades individuales y colectivas y recomponga el tejido social. ¿Qué mecanismo es?","Junta restaurativa",["Mediación","Conciliación"],"Busca la reintegración a la comunidad.","LNMASCMP, art. 27"),
   Qn(T2,"Todas las sesiones de una mediación son orales. ¿Qué se registra?","Solo el acuerdo alcanzado, en su caso",["Toda la sesión, con audio","Las manifestaciones de cada parte"],"Así lo dispone el artículo 23.","LNMASCMP, art. 23"),
   Qn(T2,"Una sesión de mediación no fue suficiente. ¿Qué procede?","Se cita de común acuerdo a sesiones subsecuentes, sin agravar la controversia",["Se cierra el mecanismo","Se turna al juez"],"Se procura conservar la voluntad de participar.","LNMASCMP, art. 24"),
   Qn(T2,"Durante una sesión, el facilitador se entera de que se está cometiendo un delito que pone en peligro la vida de una persona. ¿Qué debe hacer?","Comunicarlo al Ministerio Público, aunque rija la confidencialidad",["Guardar el secreto absoluto","Avisar solo a la otra parte"],"Es la excepción al principio de confidencialidad.","LNMASCMP, art. 4"),
   Qn(T2,"Una persona es obligada por su empleador a participar en un mecanismo alternativo. ¿Qué principio se vulnera?","Voluntariedad",["Equidad","Información"],"La participación debe ser libre de toda coacción.","LNMASCMP, art. 4"),
   Qn(T2,"Ya se dictó el auto de apertura a juicio. ¿Puede aplicarse un mecanismo alternativo?","No, solo hasta antes de ese auto o de las conclusiones, según corresponda",["Sí, hasta la sentencia","Sí, solo si el imputado lo pide"],"Ese es el límite de oportunidad.","LNMASCMP, art. 6"),
   Qn(T2,"Inicia la primera sesión de un mecanismo alternativo. ¿Qué ocurre con la prescripción de la acción penal?","Se suspende hasta que se actualice una causal de conclusión",["Sigue corriendo","Se extingue de inmediato"],"La suspensión corre desde la primera sesión.","LNMASCMP, art. 18"),
   Qn(T2,"Un imputado detenido en flagrancia quiere participar en un mecanismo alternativo. ¿Qué puede disponer el Ministerio Público?","Su libertad durante la investigación, en términos del artículo 140 del CNPP",["Su prisión preventiva","La apertura de juicio"],"Así puede participar en el mecanismo.","LNMASCMP, art. 20"),
   Qn(T2,"Un imputado con prisión preventiva desea participar en un mecanismo alternativo. ¿Qué se prevé?","Modificar la medida cautelar conforme al artículo 161 del CNPP",["Negar su participación","Sustituirla por una multa"],"La medida se ajusta para que pueda participar.","LNMASCMP, art. 20"),
   Qn(T2,"En una junta restaurativa, el imputado ofrece una disculpa y se compromete a no repetir la conducta. ¿A qué corresponde?","Al alcance de la reparación del daño",["A una pena accesoria","A una medida cautelar"],"La reparación puede incluir reconocimiento de responsabilidad y no repetición.","LNMASCMP, art. 29"),
   Qn(T2,"Las partes firman un acuerdo con las formalidades de la ley. ¿Qué carácter tiene?","Es válido y exigible en sus términos",["Solo es una recomendación","Requiere sentencia para valer"],"Así lo dispone el artículo 34.","LNMASCMP, art. 34"),
   Qn(T2,"El imputado incumple el acuerdo alcanzado. ¿Qué sucede?","Continúa el procedimiento penal; el cumplimiento parcial pecuniario se toma en cuenta en la reparación del daño",["Se extingue la acción penal","Se anula el proceso"],"Solo el cumplimiento produce la extinción.","LNMASCMP, art. 35"),
   Qn(T2,"¿Cuál es la vigencia de la certificación de las personas facilitadoras?","Tres años, renovable",["Un año","Diez años"],"Se evalúa periódicamente.","LNMASCMP, art. 49"),
   Qn(T2,"¿Cuál de estos NO es un principio rector de los mecanismos alternativos en materia penal?","Territorialidad",["Honestidad","Equidad"],"Los principios están en el artículo 4.","LNMASCMP, art. 4")]}
]);

 {t:"Notariado: función y patente", ley:"Ley del Notariado del Estado de Jalisco",
  cards:[
   Cn("Objeto y función notarial","La ley establece las bases y principios rectores de la actividad notarial y regula su organización y funcionamiento. La función notarial conforma el instrumento al que se da fuerza legal y reconocimiento público en los términos del artículo 121 constitucional.","LNJ, arts. 1 y 2"),
   Cn("Notario público","Profesional del derecho que desempeña una función pública, investido por delegación del Estado a través del Titular del Poder Ejecutivo, para formalizar y dar fe de hechos, actos y negocios jurídicos. También puede ser mediador, conciliador o árbitro, y tramitar asuntos de jurisdicción voluntaria si no hay controversia y la legislación civil lo autoriza.","LNJ, art. 3"),
   Cn("Asesoría imparcial","El notario asesora personalmente e ilustra con imparcialidad, recibe, interpreta y da forma a la voluntad de quien solicita sus servicios, propone medios legales adecuados y advierte las consecuencias legales.","LNJ, art. 4"),
   Cn("Patente de aspirante","Solo puede ser notario quien tenga patente de aspirante. Requisitos: mexicano por nacimiento, 27 años de edad mínima, abogado o licenciado en derecho con postgrado afín al derecho notarial y cinco años de ejercicio profesional, y pleno goce de derechos civiles y políticos.","LNJ, arts. 8 y 9"),
   Cn("Otros requisitos","Domicilio y residencia habitual en Jalisco con cinco años de antigüedad, práctica de tres años en notarías del Estado, sin enfermedad o impedimento que afecte sus funciones, sin condena por delito doloso con pena privativa de libertad ni suspensión de pagos o concurso, y sin separación definitiva por sanción del notariado.","LNJ, art. 9")],
  qs:[
   Qn(T4,"Un abogado de 26 años, con postgrado en derecho notarial y seis años de ejercicio, pide la patente de aspirante en Jalisco. ¿Cumple los requisitos?","No, la edad mínima es de veintisiete años",["Sí, cumple todos","No, se requiere ser notario adscrito"],"La edad mínima es un requisito expreso.","LNJ, art. 9"),
   Qn(T4,"Una persona mexicana por naturalización solicita la patente de aspirante. ¿Procede?","No, se requiere ser mexicano por nacimiento",["Sí, basta ser mexicana","Sí, con aval del Colegio"],"Es el primer requisito del artículo 9.","LNJ, art. 9"),
   Qn(T4,"Una licenciada en derecho, con cinco años de ejercicio pero sin postgrado en disciplinas afines al notariado, solicita la patente. ¿Cumple?","No, se requiere postgrado afín y cinco años de ejercicio profesional",["Sí, el postgrado es opcional","Sí, con siete años de ejercicio"],"Ambos requisitos van juntos.","LNJ, art. 9"),
   Qn(T4,"Un aspirante acredita dos años de práctica en notarías del Estado. ¿Cumple el requisito?","No, se requieren al menos tres años",["Sí, bastan dos","Sí, si trabajó en otro estado"],"La práctica debe ser en notarías del Estado.","LNJ, art. 9"),
   Qn(T4,"Un aspirante tiene tres años de residencia habitual en Jalisco. ¿Cumple el requisito de residencia?","No, se requiere una antigüedad no menor de cinco años",["Sí, bastan tres","Sí, con dos años"],"Cuenta a la fecha de la solicitud.","LNJ, art. 9"),
   Qn(T4,"Un abogado fue condenado por sentencia ejecutoria a pena privativa de libertad por un delito doloso. ¿Puede obtener la patente de aspirante?","No, ese antecedente lo impide",["Sí, si ya cumplió su pena","Sí, con aprobación del Ejecutivo"],"Es un requisito negativo del artículo 9.","LNJ, art. 9"),
   Qn(T4,"Un notario separado definitivamente del notariado como sanción quiere obtener una nueva patente. ¿Procede?","No, quien fue separado definitivamente por sanción no cumple los requisitos",["Sí, tras cinco años","Sí, si paga una multa"],"La separación definitiva es un impedimento.","LNJ, art. 9"),
   Qn(T4,"Una persona pretende ejercer como notario en Jalisco sin tener la patente de aspirante. ¿Puede?","No, solo puede ser notario quien tenga la patente",["Sí, con cédula profesional","Sí, si es abogado"],"La patente es indispensable.","LNJ, art. 8"),
   Qn(T4,"Un particular pregunta si el notario puede intervenir como mediador o conciliador. ¿Qué respuesta corresponde?","Sí, la ley le faculta a intervenir como mediador, conciliador o árbitro",["No, solo da fe","Solo como árbitro"],"Además puede tramitar asuntos de jurisdicción voluntaria.","LNJ, art. 3"),
   Qn(T4,"Un asunto de jurisdicción voluntaria no tiene controversia entre los interesados y la legislación civil autoriza al notario a tramitarlo. ¿Puede hacerlo?","Sí, en concurrencia con los órganos jurisdiccionales",["No, solo el juez","Solo si el Colegio lo aprueba"],"Es una facultad del artículo 3.","LNJ, art. 3"),
   Qn(T4,"Una persona pide al notario que firme lo que ella redactó, sin asesoría. ¿Qué obligación tiene el notario?","Asesorar personalmente, ilustrar con imparcialidad y advertir las consecuencias legales",["Solo autorizar el documento","Redactar a favor de la parte que paga"],"La asesoría imparcial es obligatoria.","LNJ, art. 4"),
   Qn(T4,"¿De dónde deriva la investidura del notario público?","De una delegación del Estado a través del Titular del Poder Ejecutivo",["De una elección del Colegio de Notarios","De un examen ante el Poder Judicial"],"Ejerce una función pública por delegación.","LNJ, art. 3"),
   Qn(T4,"Un instrumento notarial de Jalisco se presenta en otro estado. ¿En qué artículo constitucional se apoya su reconocimiento público?","En el artículo 121",["En el artículo 5","En el artículo 73"],"Es el fundamento que cita el artículo 2.","LNJ, art. 2"),
   Qn(T4,"Al formalizar y dar fe de un negocio jurídico, ¿qué otorga el notario al acto?","Autenticidad y seguridad jurídica",["Fuerza de cosa juzgada","Efectos de sentencia ejecutoriada"],"Es la finalidad de la función notarial.","LNJ, art. 3"),
   Qn(T4,"¿Cuál es el objeto de la Ley del Notariado del Estado de Jalisco?","Establecer las bases y principios rectores de la actividad notarial y regular su organización y funcionamiento",["Regular la propiedad inmobiliaria","Fijar las tarifas de los registros"],"Así lo dice el artículo 1.","LNJ, art. 1"),
   Qn(T4,"Seleccione un requisito para obtener la patente de aspirante al ejercicio del notariado.","Ser mexicano por nacimiento",["Ser ciudadano de cualquier nacionalidad","Ser servidor público"],"Es el primer requisito.","LNJ, art. 9")]},

 {t:"Notariado: instrumentos y protocolo", ley:"Ley del Notariado del Estado de Jalisco",
  cards:[
   Cn("Protocolo","Conjunto de folios ordenados numérica y cronológicamente en los que el notario asienta las escrituras y actas que se otorguen ante su fe. También forman parte los libros de documentos, los índices, las actas de apertura y cierre de cada tomo y sus soportes informáticos.","LNJ, art. 61"),
   Cn("Escritura pública","Instrumento que el notario asienta en el protocolo para hacer constar hechos, actos o negocios jurídicos, que autoriza con su firma y sello, o con firma electrónica en el protocolo informático.","LNJ, art. 83"),
   Cn("Redacción","En español, con letra clara y sin abreviaturas, con fechas y cantidades en número y letra; si no coinciden, prevalece la letra. Puede usar expresiones técnicas en otro idioma. Las cláusulas deben ser claras y concisas, y los bienes puntualizados. Los documentos insertados se copian tal como están.","LNJ, arts. 84, 85 y 94"),
   Cn("Firma","Los intervinientes firman dentro de los treinta días hábiles siguientes al otorgamiento, salvo los testamentos, que se firman de inmediato. El notario autoriza con su firma y sello inmediatamente después de la firma de los otorgantes. Quien no conoce el español se asiste de un traductor.","LNJ, arts. 97 y 98"),
   Cn("Registro y responsabilidad fiscal","Si el instrumento debe inscribirse, el notario lo presenta al Registro Público de la Propiedad y paga los derechos a costa del interesado. Es solidariamente responsable con las partes en favor de la hacienda. Puede otorgarse escritura rectificatoria a petición de la parte legitimada.","LNJ, arts. 86, 88 y 101"),
   Cn("Testimonio","Documento con la trascripción fiel y literal del instrumento asentado en el protocolo, de las firmas, del sello y de las notas. Es el único instrumento legítimo que acredita que el acto puede entrar a la circulación jurídica. Lo pueden solicitar quienes intervinieron o tienen interés legítimo.","LNJ, arts. 128 y 129")],
  qs:[
   Qn(T4,"Un notario pretende asentar un acto en hojas sueltas fuera del protocolo. ¿Qué exige la ley?","Que las escrituras y actas se asienten en el protocolo, en folios ordenados numérica y cronológicamente",["Nada, basta su firma","Que se guarden en el Colegio de Notarios"],"El protocolo es el conjunto de folios donde se asientan.","LNJ, art. 61"),
   Qn(T4,"En una escritura, una cantidad aparece en número como 100,000 y en letra como diez mil pesos. ¿Cuál prevalece?","La escrita en letra, si no altera el contexto del documento",["La escrita en número","La mayor de las dos"],"Cuando no coinciden prevalece lo escrito en letra.","LNJ, art. 84"),
   Qn(T4,"Una escritura incluye una expresión técnica en inglés. ¿Es válido?","Sí, se pueden usar expresiones en otro idioma cuando sean de carácter técnico",["No, todo debe ir en español","Solo con traducción certificada"],"El instrumento se redacta en español.","LNJ, art. 84"),
   Qn(T4,"Las partes otorgan una compraventa el 1 de marzo y no firman dentro de treinta días hábiles. ¿Qué consecuencia hay?","Se deja sin efecto el instrumento por falta de firma",["Se entiende firmado por el notario","Se convierte en acta"],"La falta de firma de algún compareciente motiva que se deje sin efecto.","LNJ, art. 98"),
   Qn(T4,"Se otorga un testamento ante notario. ¿Cuándo se firma?","De inmediato, conforme al Código Civil del Estado",["En treinta días hábiles","Dentro de un año"],"Es la excepción a los treinta días hábiles.","LNJ, art. 98"),
   Qn(T4,"Los otorgantes firman una escritura. ¿Cuándo autoriza el notario con su firma y sello?","Inmediatamente después de la firma de los otorgantes",["Al día siguiente","Cuando se expida el testimonio"],"Así lo ordena el artículo 98.","LNJ, art. 98"),
   Qn(T4,"Una escritura debe inscribirse en el Registro Público de la Propiedad. ¿Quién la presenta y a costa de quién?","El notario, a costa del interesado",["El interesado, a costa del notario","El Registro, a costa del Estado"],"El notario paga los derechos por cuenta del interesado.","LNJ, art. 86"),
   Qn(T4,"Por un acto en el que intervino, el notario tiene una obligación frente a la hacienda pública. ¿Qué responsabilidad tiene?","Es solidariamente responsable con las partes",["Ninguna, es un tercero","Responsable exclusivo"],"La ley lo hace responsable solidario en favor de la hacienda.","LNJ, art. 101"),
   Qn(T4,"Un comprador necesita el documento que acredita que el acto pasado ante notario cumplió todos los requisitos y puede circular jurídicamente. ¿Qué documento es?","El testimonio",["El apéndice","El índice del protocolo"],"Es el único instrumento legítimo para esos efectos.","LNJ, art. 128"),
   Qn(T4,"¿Cómo debe ser el contenido de un testimonio?","Una trascripción fiel y literal del instrumento, de las firmas, del sello y de las notas",["Un resumen del acto","Solo las cláusulas principales"],"Debe llevar el sello de autorizar y rúbrica en cada hoja.","LNJ, art. 128"),
   Qn(T4,"Una persona con interés legítimo en un instrumento pide varios testimonios. ¿Puede?","Sí, se expiden con la expresión del número y orden que les corresponda",["No, solo uno","Solo con orden judicial"],"Lo pueden solicitar quienes intervinieron o tienen interés legítimo.","LNJ, art. 129"),
   Qn(T4,"Una escritura tiene un error y las partes quieren corregirlo. ¿Qué puede otorgarse?","Una escritura rectificatoria, a petición de la parte legitimada",["Un nuevo protocolo","Un poder notarial"],"Procede a petición de la parte legitimada e interesada.","LNJ, art. 88"),
   Qn(T4,"Un compareciente no conoce el idioma español. ¿Qué se requiere?","Que se asista de un traductor",["Que el notario lo traduzca en secreto","Nada especial"],"Así lo dispone el artículo 97.","LNJ, art. 97"),
   Qn(T4,"Al notario le corresponde insertar un documento en la escritura. ¿Cómo debe hacerlo?","Tal y como está",["Resumiéndolo","Reescribiéndolo con sus palabras"],"La inserción debe ser fiel.","LNJ, art. 94"),
   Qn(T4,"¿Qué es el protocolo notarial?","El conjunto de folios ordenados numérica y cronológicamente en los que el notario asienta escrituras y actas",["El libro de firmas del Colegio","El archivo de testimonios"],"También incluye libros de documentos, índices y actas de apertura y cierre.","LNJ, art. 61"),
   Qn(T4,"¿Qué es una escritura pública?","El instrumento que el notario asienta en el protocolo para hacer constar hechos, actos o negocios jurídicos",["El testimonio que se entrega al interesado","El acta de apertura de un tomo"],"La autoriza con su firma y sello.","LNJ, art. 83")]}
]);
