var GUIA={"defs": [["Área 1. Función pública", "Se abordan las diferentes competencias, facultades y funciones de los entes públicos federales, locales y municipales, así como las obligaciones y los derechos de las personas sometidas a su jurisdicción y las instancias ante las cuales se hacen exigibles, a fin de identificar la estructura del Estado, su forma de gobierno y los límites de las autoridades públicas en el ejercicio del poder, con fundamento en la Constitución Política de los Estados Unidos Mexicanos."], ["Área 2. Litigio", "Se abordan las formas, los medios y las vías de intervención en todas las controversias jurisdiccionales suscitadas por pretensiones diversas entre las partes y que se resuelven ante un órgano judicial o administrativo, de acuerdo con la legislación sustantiva y adjetiva."], ["Área 3. Justicia alternativa y fe pública", "Se abordarán las vías no jurisdiccionales para resolver conflictos y controversias jurídicas, incluyendo las soluciones alternas y la forma de terminación anticipada en materia penal y el sistema no jurisdiccional de protección de los derechos humanos, así como las gestiones registrales y notariales destinadas a dar certeza a los actos jurídicos. 12"]], "desc": [["Función pública", "Satisfactorio Sobresaliente El sustentante con nivel de desempeño Satisfactorio es capaz de distinguir las facultades, competencias y límites de actuación de los entes públicos establecidos en la Constitución Política de los Estados Unidos Mexicanos; también reconoce sus diversas jurisdicciones, funciones, atribuciones, jurisprudencia, niveles y órganos de gobierno. Además, es capaz de determinar los derechos y obligaciones generales de la población y los específicos de determinados grupos poblacionales de atención prioritaria, así como los requisitos para su ejercicio.", "Además de lo señalado en el nivel Satisfactorio, el sustentante es capaz de determinar las facultades concurrentes, las funciones de los órganos constitucionales autónomos federales, los principios de elección popular, las responsabilidades de las personas servidoras públicas, el procedimiento de sustitución presidencial, las instancias de justicia internacional, incluidas las competentes para conocer de violaciones a derechos humanos cometidas por el Estado mexicano. Además, cuenta con habilidades para determinar los procedimientos pertinentes contra las violaciones a derechos humanos, así como identificar el alcance y las diferencias del control de convencionalidad, constitucionalidad y legalidad."], ["Litigio", "Satisfactorio Sobresaliente El sustentante con nivel de desempeño Satisfactorio es capaz de distinguir las vías procesales que permiten solucionar controversias en el ámbito del Derecho Público, Privado y Social, así como sus requisitos de procedencia y su sustanciación. Además, puede elegir los recursos, medios de impugnación o juicios procedentes para combatir actos de autoridad.", "Además de lo señalado en el nivel Satisfactorio, el sustentante es capaz de determinar la conducta delictiva y su modalidad, el tipo de interés (legítimo, jurídico, simple) para la defensa de derechos individuales y colectivos, las acciones en el procedimiento sancionador en materia fiscal y la procedencia de las acciones de inconstitucionalidad, de las controversias constitucionales, del ejercicio del derecho de huelga y de los incidentes en los procesos civiles. También cuenta con habilidades para elegir el recurso de impugnación procedente, evaluar decisiones judiciales, distinguir la vía idónea, así como la etapa en que se encuentran los juicios penal, fiscal, civil, mercantil y agrario. 14"], ["Justicia alternativa y fe pública", "Satisfactorio Sobresaliente El sustentante con nivel de desempeño Satisfactorio es capaz de distinguir la procedencia de vías no jurisdiccionales para la solución de conflictos jurídicos, incluyendo las soluciones alternas y la forma de terminación anticipada en materia penal y el sistema no jurisdiccional de protección de los derechos humanos. Además, puede gestionar trámites notariales y registrales que den certeza a los actos jurídicos.", "Además de lo señalado en el nivel Satisfactorio, el sustentante es capaz de distinguir las medidas de reparación de los derechos humanos y los procedimientos de los organismos públicos de protección, la acreditación del concubinato, los mecanismos de solución de controversias laborales individuales y colectivos, los actos en materia de propiedad intelectual ante autoridad registral administrativa, así como los vicios que afectan la existencia o validez de los actos dotados de fe pública. Puede asimismo determinar los medios para la terminación anticipada del procedimiento penal y sus recursos, las condiciones y medidas de reparación para celebrar suspensiones condicionales del proceso penal y los argumentos de oposición de la víctima. 15"]], "bib": {"Área 1. Función pública": ["Código Federal de Instituciones y Procedimientos Electorales [Cofipe]. 14 de enero de 2008. Diario Oficial de la Federación.", "Convención Americana sobre Derechos Humanos. 22 de noviembre de 1969.", "Convención de Viena sobre el Derecho de los Tratados. 23 de mayo de 1969.", "Estatuto de Roma de la Corte Penal Internacional. 17 de julio de 1988.", "Ley de los Órganos Reguladores Coordinados en Materia Energética. 11 de agosto de 2014. Diario Oficial de la Federación, 20-05-2021.", "Ley del Impuesto sobre la Renta. 11 de diciembre de 2013. Diario Oficial de la Federación, 12-11-2021.", "Ley Federal de Consulta Popular. 14 de marzo de 2014. Diario Oficial de la Federación, 19-05-2021.", "Ley Federal de los Derechos del Contribuyente. 23 de junio de 2005. Diario Oficial de la Federación.", "Ley Federal de Protección de Datos Personales en Posesión de los Particulares. 5 de julio de 2010. Diario Oficial de la Federación.", "Ley Federal de Telecomunicaciones y Radiodifusión. 14 de junio de 2014. Diario Oficial de la Federación.", "Ley General de los Derechos de var Y1="Reseña de El derecho a la vivienda adecuada: entre la norma y el desalojo, de Laura Beltrán Mendoza (Editorial Aurora, 2022, 312 páginas).\n\nEl libro de Beltrán Mendoza estudia la distancia entre el reconocimiento formal del derecho a la vivienda y su ejercicio real. La autora sostiene que las normas nacionales han avanzado en el lenguaje de los derechos, pero que los procedimientos de desalojo siguen tratándose como asuntos meramente civiles, sin considerar la situación de las familias afectadas.\n\nLa obra se organiza en cinco capítulos. El primero revisa los estándares internacionales; el segundo y el tercero analizan cuarenta sentencias de tres países, seleccionadas por incluir un desalojo colectivo; el cuarto compara los plazos de notificación previa; y el último propone criterios para que los jueces evalúen la proporcionalidad de cada desalojo. Un apéndice reúne los formatos de las entrevistas con personas desalojadas.\n\nEntre sus aportes destacan la claridad con que clasifica las sentencias y la utilidad práctica de sus criterios de proporcionalidad. Sin embargo, la selección de casos privilegia procesos con amplia cobertura mediática, lo que podría exagerar la frecuencia de los desalojos violentos. Además, la autora apenas discute el punto de vista de los propietarios, por lo que su conclusión —que el desalojo debe ser siempre el último recurso— aparece más como una convicción que como un resultado demostrado. Aun así, es una lectura recomendable para quienes litigan en materia de vivienda.";
var Y2="Resumen. Este artículo examina si la asesoría jurídica gratuita en las primeras 48 horas de un conflicto de arrendamiento reduce la probabilidad de que la persona inquilina sea desalojada.\n\nMétodo. Se analizaron 860 expedientes de un tribunal urbano entre 2019 y 2022. En 410 de ellos la persona demandada recibió asesoría de una clínica jurídica universitaria antes de contestar la demanda; en los 450 restantes no la recibió. Se compararon ambos grupos según el monto de la renta adeudada, el tiempo de residencia y la existencia de contrato escrito.\n\nResultados. Entre quienes recibieron asesoría, 27 % fue desalojado; entre quienes no la recibieron, 58 %. La diferencia se mantuvo al controlar el monto adeudado, pero se redujo cuando existía contrato escrito. Las personas asesoradas fueron más propensas a firmar convenios de pago (43 % frente a 12 %).\n\nDiscusión. Los autores atribuyen el efecto a que la asesoría permite conocer las defensas disponibles y negociar a tiempo. No obstante, advierten que las personas que buscan asesoría podrían ser también las más informadas o las de mayor capacidad de organización, lo que impide afirmar una relación causal.\n\nConclusión. Se recomienda ampliar la cobertura de la asesoría temprana y realizar un estudio con asignación aleatoria.";
var Y3="Don Anselmo llevaba cuarenta años vendiendo boletos en la estación de Santa Rita, un pueblo por el que el tren ya casi no pasaba. Cada mañana barría el andén, limpiaba el vidrio de la ventanilla y acomodaba sobre el mostrador una libreta donde anotaba, con letra cuidadosa, la hora exacta de cada llegada: las siete y diez, las once y cuarenta, las cuatro y cinco. Los jóvenes se burlaban: hacía más de un año que solo se detenía un tren de carga, y a nadie le importaba la hora.\n\nCuando el ayuntamiento anunció que la estación sería demolida, Lucía, la nieta de don Anselmo, llegó de la ciudad para ayudarlo a empacar. Encontró la libreta, la hojeó y notó algo extraño: las horas anotadas correspondían a trenes que ya no existían. Iba a preguntarle, pero lo vio junto a la ventanilla, con la mirada fija en las vías, y comprendió que no hacía falta.\n\nLa mañana de la demolición, pocos minutos antes de las siete y diez, don Anselmo se puso su gorra de ferrocarrilero y salió al andén. Lucía, sin decir nada, sacó su celular y grabó el sonido del viento sobre los rieles. Días después, en su departamento de la ciudad, colocó junto a la cama la libreta y reprodujo la grabación. A las siete y diez en punto cerró los ojos y escuchó cómo, muy lejos, llegaba un tren.";
var Y4="Hay quienes desprecian las listas de pendientes como quien desprecia las muletas: las ven como un signo de debilidad. Yo creo, en cambio, que una lista es una forma de humildad. Quien anota lo que debe hacer reconoce que su memoria es limitada y que la vida, con su desorden, no cabe entera en la cabeza.\n\nAdemás, las listas tienen una virtud secreta: obligan a elegir. Para escribir «llamar a mamá» hay que renunciar, aunque sea un instante, a escribir «ordenar el escritorio». Lo que llega al papel es lo que consideramos importante, y en esa selección se dibuja, sin que lo notemos, un retrato de nosotros mismos.\n\nClaro que las listas también tienen su trampa. Tachar tareas produce una satisfacción tan intensa que es fácil confundir el movimiento con el avance. Hay personas que llenan sus días de pequeñas victorias —responder un correo, archivar un recibo— para no enfrentar la tarea grande, la que no cabe en una línea y que por eso nunca aparece en la lista.\n\nPor eso propongo un uso más honesto de la lista: que incluya al menos una tarea que dé miedo. Esa línea incómoda, escrita con letra chica, es la que mide nuestro compromiso.";
var Y5="CONVOCATORIA. La Facultad de Derecho y la Defensoría Pública convocan a estudiantes a participar en el Programa de Servicio Social Jurídico Comunitario, periodo febrero-julio.\n\nObjetivo. Brindar orientación jurídica gratuita a personas de comunidades rurales en materia civil, familiar y agraria.\n\nRequisitos. 1) Haber cubierto al menos el 70 % de los créditos de la licenciatura. 2) Contar con un promedio general mínimo de 8.0. 3) No tener adeudos de materias del semestre anterior. 4) Disponer de 20 horas semanales, de lunes a jueves.\n\nRegistro. Del 6 al 17 de enero, en la oficina de servicio social de la Facultad, de 10:00 a 14:00 horas. Se deberá presentar el historial académico y una carta de exposición de motivos de una cuartilla.\n\nSelección. Se elegirá a 30 personas con base en el promedio, la carta de motivos y una entrevista, que se realizará el 22 de enero. Los resultados se publicarán el 24 de enero en la página de la Facultad.\n\nCondiciones. Las personas seleccionadas deberán asistir a un taller de inducción el 29 de enero. Quienes falten al taller perderán su lugar. Las plazas no son transferibles.";
var Y6="Aumentan 32 % las denuncias por fraudes en línea durante el primer semestre\n\nCiudad Serrana.— Las denuncias por fraudes cometidos en línea aumentaron 32 % en el primer semestre del año respecto del mismo periodo del año anterior, informó ayer la Fiscalía Regional. Entre enero y junio se abrieron 1,850 carpetas, frente a las 1,402 del año pasado.\n\nLa fiscal Marisol Vega explicó que la modalidad más frecuente es la compra de productos que nunca llegan, seguida de los mensajes que suplantan a instituciones bancarias. «Muchas víctimas tardan más de una semana en denunciar, y ese tiempo es valioso para rastrear los recursos», afirmó.\n\nDe acuerdo con la Fiscalía, el 61 % de las personas afectadas tiene entre 25 y 44 años y el monto promedio de la pérdida fue de 9,300 pesos. En lo que va del año se han recuperado recursos en 14 % de los casos.\n\nAnte este panorama, la dependencia lanzó una campaña que recomienda verificar la dirección de las páginas de compra, no compartir claves por mensaje y denunciar de inmediato. Especialistas consultados por este medio señalaron que el aumento podría deberse en parte a que hoy más personas denuncian, y no solo a que existan más fraudes.\n\nLa Fiscalía habilitó una línea telefónica y un formulario en su página para recibir denuncias.";

   Qn(R1,"Un estudiante redacta el problema de investigación de su protocolo de tesis. ¿Qué redacción debe usar?","El presente proyecto busca determinar en qué medida la mediación penal reduce la carga de trabajo de los juzgados de control.",["Yo quiero saber si la mediación sirve para que los jueces trabajen menos, porque siempre andan saturados.","¡Descubre por qué los juzgados están saturados y cómo la mediación puede salvarlos!"],"El protocolo usa registro formal e impersonal.","Redacción indirecta"),
   Qn(R1,"En la justificación de su protocolo, un estudiante debe argumentar la relevancia del estudio. ¿Qué fragmento corresponde?","La relevancia del estudio radica en la escasa evidencia empírica sobre el cumplimiento de acuerdos reparatorios en el país.",["Pues la verdad casi nadie ha estudiado esto y por eso me pareció padre hacerlo.","Este será el trabajo más importante que se haya escrito jamás sobre el tema."],"Es formal y justifica con un argumento verificable.","Redacción indirecta"),
   Qn(R1,"Una persona redacta una reseña y debe emitir un juicio valorativo sobre un libro. ¿Qué fragmento usa?","El libro ofrece un análisis sólido, aunque su exclusión de los delitos graves limita la generalización de sus resultados.",["Este libro está buenísimo y todos deberían comprarlo ya.","El autor nació en 1970, estudió derecho y ha publicado tres libros."],"La reseña valora con argumentos, no promociona ni solo describe al autor.","Redacción indirecta"),
   Qn(R1,"En una reseña, una persona debe describir la organización de la obra. ¿Qué fragmento corresponde?","La obra se organiza en cuatro capítulos: el primero define los conceptos y los siguientes analizan casos comparados.",["No pienso leer más libros de este autor.","Compra ya la obra con un veinte por ciento de descuento."],"La descripción del contenido es propia de la reseña.","Redacción indirecta"),
   Qn(R1,"Un artículo de divulgación científica debe explicar un concepto a público general. ¿Qué fragmento corresponde?","El ADN es como un manual de instrucciones que cada célula consulta para saber cómo funcionar.",["El ADN exhibe una estructura de doble hélice antiparalela formada por polímeros de desoxirribonucleótidos.","Uy, el ADN es algo muy raro que casi nadie entiende."],"La divulgación traduce lo técnico a un lenguaje accesible.","Redacción indirecta"),
   Qn(R1,"Un artículo de divulgación abre con una pregunta que despierta el interés del lector. ¿Qué fragmento usa?","¿Por qué el hielo flota sobre el agua? La respuesta está en cómo se acomodan sus moléculas al congelarse.",["Sobre la flotabilidad del hielo, se presenta a continuación el marco teórico del estudio.","El hielo flota y punto, no hay mucho que decir."],"Combina una pregunta atractiva con explicación clara.","Redacción indirecta"),
   Qn(R1,"Un periódico redacta un editorial sobre una reforma. ¿Qué fragmento expresa la postura del medio?","Este diario considera que la reforma debe discutirse con mayor transparencia, pues afecta a millones de personas.",["Yo pienso que la reforma está mal porque no me cae bien el diputado.","Ayer se aprobó la reforma con 300 votos a favor y 120 en contra."],"El editorial expresa la opinión argumentada del medio.","Redacción indirecta"),
   Qn(R1,"Un editorial argumenta sobre nuevos requisitos de un trámite. ¿Qué fragmento corresponde?","Si la autoridad exige más requisitos, deberá garantizar trámites accesibles; de lo contrario, la medida excluirá a quienes menos recursos tienen.",["Fuentes cercanas indican que la medida entrará en vigor el próximo mes.","¡Increíble! ¡Otra vez nos quieren complicar la vida!"],"Argumenta una postura con una condición y una consecuencia.","Redacción indirecta"),
   Qn(R1,"Una facultad redacta el cierre de una convocatoria a un concurso. ¿Qué fragmento corresponde?","Las personas interesadas deberán registrarse a más tardar el 20 de octubre mediante el formulario en línea.",["Anímense y vengan, no se van a arrepentir.","El registro es un tema muy discutido en la literatura especializada."],"Una convocatoria indica requisitos y fechas.","Redacción indirecta"),
   Qn(R1,"Una facultad abre una convocatoria para un debate. ¿Qué fragmento presenta correctamente a quien convoca y a quién?","La Facultad de Derecho convoca a estudiantes de licenciatura a participar en el Concurso de Debate Jurídico.",["Quiero invitarte, querido amigo, a un debate que va a estar buenísimo.","El debate jurídico tiene su origen en la retórica clásica."],"Indica quién convoca, a quién y a qué.","Redacción indirecta"),
   Qn(R1,"Una persona escribe la carta de exposición de motivos para un programa de intercambio. ¿Qué fragmento usa?","Por medio de la presente expongo los motivos por los que solicito ser considerado para el programa de intercambio: mi trayectoria académica y mi interés en el derecho comparado.",["Hola, mira, la verdad quiero irme de intercambio porque me urge cambiar de aires.","Se declara procedente la solicitud de intercambio conforme al artículo 12."],"La carta de motivos es formal y en primera persona.","Redacción indirecta"),
   Qn(R1,"En esa carta, la persona quiere argumentar por qué merece el programa. ¿Qué fragmento corresponde?","Considero que mi experiencia como ayudante de investigación me permitirá aprovechar el programa y aportar a mi comunidad.",["El programa es muy bonito y por eso lo pido.","Soy el mejor candidato, sin duda, y no tendrán otro igual."],"Argumenta con una experiencia concreta y sin exageraciones.","Redacción indirecta"),
   Qn(R1,"Un estudiante envía a su asesor de tesis el avance de un capítulo. ¿Qué redacción es adecuada?","Estimado doctor Ramírez: le envío el avance del capítulo segundo para su revisión.",["Qué onda, profe, ahí le va el capítulo, échele un ojo cuando pueda.","Adjunto capítulo. Ya."],"Se requiere un registro formal y cortés.","Redacción indirecta"),
   Qn(R1,"Una reseña académica critica un argumento del autor. ¿Qué fragmento usa el registro adecuado?","El autor sostiene que la reforma fortaleció la autonomía judicial; sin embargo, no presenta datos que sustenten esa afirmación.",["El autor dice que la reforma estuvo padre, pero no prueba nada, qué flojera.","¡Vaya sorpresa la de este libro!"],"Reseña con registro académico y argumento.","Redacción indirecta"),
   Qn(R1,"En el protocolo de una investigación, ¿qué fragmento corresponde al objetivo general?","Objetivo general: analizar los factores que inciden en el cumplimiento de los convenios de conciliación laboral en un centro de conciliación durante 2024.",["Mi meta es hablar de convenios y ver qué onda.","¿Sabías que casi nadie cumple los convenios?"],"Define con precisión qué se analizará, dónde y cuándo.","Redacción indirecta"),
   Qn(R1,"Un artículo de divulgación explica cómo se divide una célula. ¿Qué fragmento evita los tecnicismos sin explicarlos?","Cuando una célula se divide, copia primero su material genético para que cada célula hija reciba una versión completa.",["La mitosis comprende la profase, la metafase y la anafase, sin más explicación para el lector.","Las células hacen cosas raras cuando se parten."],"Explica con claridad sin perder rigor.","Redacción indirecta")]},

 {t:"Gramática y semántica", ley:"Guía del EGEL Plus DERE, redacción indirecta",
  cards:[
   Cn("Concordancia nominal y verbal","Con sustantivos de distinto género, el adjetivo o pronombre va en masculino plural. El verbo concuerda en número con el sujeto, aunque este vaya después.","Guía EGEL Plus DERE, 2.6.3"),
   Cn("Haber impersonal","Con sentido de existencia, va en singular: hubo, había, habrá. No se dice «hubieron», «habían» ni «habrán» con ese sentido.","Diccionario panhispánico de dudas"),
   Cn("Dequeísmo y queísmo","Dequeísmo: usar «de» donde no corresponde («pienso de que»). Queísmo: omitirlo donde se necesita («se convenció que»).","Diccionario panhispánico de dudas"),
   Cn("Cohesión","Gramatical: pronombres, conectores y referencias claras. Léxico-semántica: sinónimos y palabras precisas. Textual: orden lógico y coherencia de las ideas.","Guía EGEL Plus DERE, 2.6.3"),
   Cn("Conectores","Adversativos: sin embargo, no obstante. Causales: porque, ya que. Consecutivos: por lo tanto, por eso. Aditivos: además.","Nueva gramática de la lengua española")],
  qs:[
   Qn(R2,"Elija el enunciado con concordancia correcta.","La demanda y el escrito de pruebas los presentó el abogado ayer.",["La demanda y el escrito de pruebas las presentó el abogado ayer.","La demanda y el escrito de pruebas lo presentó el abogado ayer."],"Con nombres de distinto género, el pronombre va en masculino plural.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado correctamente escrito.","Llegaron al juzgado las notificaciones pendientes.",["Llegó al juzgado las notificaciones pendientes.","Llegaron al juzgado la notificación pendiente."],"El verbo concuerda con el sujeto plural pospuesto.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado correctamente escrito.","Habrá muchas solicitudes el próximo mes.",["Habrán muchas solicitudes el próximo mes.","Habían muchas solicitudes el próximo mes."],"Haber con sentido de existencia es impersonal.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado sin dequeísmo.","Pienso que debemos apelar la sentencia.",["Pienso de que debemos apelar la sentencia.","Pienso en que debemos apelar la sentencia."],"El verbo pensar, con este sentido, se construye con «que».","Redacción indirecta"),
   Qn(R2,"Elija el enunciado sin queísmo.","Se convenció de que debía firmar el convenio.",["Se convenció que debía firmar el convenio.","Se convenció en que debía firmar el convenio."],"Convencerse exige la preposición «de».","Redacción indirecta"),
   Qn(R2,"Elija el enunciado con concordancia correcta.","Las partes y el tercero interesado quedaron notificados.",["Las partes y el tercero interesado quedaron notificadas.","Las partes y el tercero interesado quedó notificado."],"Con sujetos de distinto género, el adjetivo va en masculino plural.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado con referencia clara.","El actor entregó el documento a su abogado y este lo revisó esa tarde.",["El actor habló con su abogado y él lo revisó esa tarde.","El actor entregó el documento a su abogado y ese lo revisó él."],"El demostrativo señala con claridad a quién se refiere.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado con el verbo adecuado.","La empresa infringió la norma ambiental.",["La empresa infligió la norma ambiental.","La empresa infrigió la norma ambiental."],"Infringir es quebrantar una norma; infligir se dice de castigos o daños.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado con el verbo adecuado.","La ley prevé la posibilidad de apelar.",["La ley provee la posibilidad de apelar.","La ley previene la posibilidad de apelar."],"Prever significa disponer o anticipar; proveer, suministrar.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado con las palabras adecuadas.","Su aptitud para negociar es notable, pero su actitud en audiencia debe mejorar.",["Su actitud para negociar es notable, pero su aptitud en audiencia debe mejorar.","Su aptitud para negociar es notable, pero su aptitud en audiencia debe mejorar."],"Aptitud es capacidad; actitud es disposición de ánimo.","Redacción indirecta"),
   Qn(R2,"Complete con el conector adecuado: «La prueba fue admitida; ______, no se valoró en la sentencia».","sin embargo",["por lo tanto","además"],"Expresa oposición entre admitir y no valorar.","Redacción indirecta"),
   Qn(R2,"Complete con el conector adecuado: «Se revocó la resolución ______ carecía de fundamentación».","porque",["aunque","sin embargo"],"Introduce la causa de la revocación.","Redacción indirecta"),
   Qn(R2,"Ordene las oraciones para dar coherencia al texto: 1) Por ello, el tribunal reformó la sentencia. 2) La parte actora apeló por falta de fundamentación. 3) El juez de primera instancia condenó al demandado.","3, 2, 1",["1, 2, 3","2, 3, 1"],"Primero la condena, luego la apelación y por último la decisión del tribunal.","Redacción indirecta"),
   Qn(R2,"Ordene las oraciones para dar coherencia al texto: 1) Finalmente, las partes firmaron el convenio. 2) La persona facilitadora explicó las reglas de la sesión. 3) Ambas partes aceptaron participar en la mediación.","3, 2, 1",["1, 3, 2","2, 1, 3"],"Se acepta, se explican las reglas y se firma.","Redacción indirecta"),
   Qn(R2,"Seleccione la oración que rompe la coherencia de este párrafo: «La conciliación busca acuerdos rápidos. Las partes proponen soluciones con ayuda de una persona facilitadora. El equipo de fútbol ganó el sábado. El convenio final debe constar por escrito.»","El equipo de fútbol ganó el sábado.",["Las partes proponen soluciones con ayuda de una persona facilitadora.","El convenio final debe constar por escrito."],"Es la única que no trata de la conciliación.","Redacción indirecta"),
   Qn(R2,"Elija el enunciado con concordancia correcta.","Tanto la actora como su abogado presentaron pruebas.",["Tanto la actora como su abogado presentó pruebas.","Tanto la actora como su abogado presentaste pruebas."],"La estructura «tanto… como» lleva verbo en plural.","Redacción indirecta")]},

 {t:"Ortografía, acentuación y puntuación", ley:"Guía del EGEL Plus DERE, redacción indirecta",
  cards:[
   Cn("Tilde diacrítica","Con tilde: tú, él, mí, sé, sí, té, dé, más, aún (todavía). Sin tilde: tu, el, mi, se, si, te, de, mas (pero), aun (incluso).","Ortografía de la lengua española"),
   Cn("Interrogativos y exclamativos","Llevan tilde en preguntas directas e indirectas: qué, cuál, quién, cuándo, cómo, dónde, cuánto. «Por qué» separado se usa para preguntar; «porque» para responder.","Ortografía de la lengua española"),
   Cn("Acentuación general","Agudas con tilde si terminan en n, s o vocal (resolución, sesión). Graves con tilde si no terminan en n, s o vocal. Esdrújulas siempre. Hiatos: día, leía, tío.","Ortografía de la lengua española"),
   Cn("Homófonos frecuentes","Tuvo/tubo, haya/halla, a ver/haber, hecho/echo, cabo/cavo, vaya/valla, sino/si no.","Diccionario panhispánico de dudas"),
   Cn("Puntuación básica","El vocativo va entre comas. En una enumeración no se pone coma antes de «y». El punto y coma separa elementos complejos. Las mayúsculas también llevan tilde.","Ortografía de la lengua española")],
  qs:[
   Qn(R3,"Elija el enunciado con la acentuación correcta.","No sé si él conoce mi propuesta, pero tú deberías explicársela.",["No se si el conoce mi propuesta, pero tu deberías explicársela.","No sé si él conoce mí propuesta, pero tú deberías explicársela."],"Llevan tilde sé, él y tú; mi (posesivo) no.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la acentuación correcta.","No sé cuándo empezará la audiencia.",["No sé cuando empezará la audiencia.","No se cuándo empezara la audiencia."],"Cuándo interrogativo (indirecto) lleva tilde; empezará también.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la acentuación correcta.","La sesión concluyó sin acuerdo.",["La sesion concluyó sin acuerdo.","La sesión concluyo sin acuerdo."],"Ambas palabras son agudas terminadas en n y vocal.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la acentuación correcta.","Mi tío leía el periódico cada día.",["Mi tio leia el periodico cada dia.","Mi tío leia el periódico cada dia."],"Tío, leía y día son hiatos que llevan tilde.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la acentuación correcta.","Ayer presencié la audiencia completa.",["Ayer presencie la audiencia completa.","Ayer presenció la audiencia completa, yo."],"Presencié es una palabra aguda terminada en vocal.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la puntuación correcta.","Señor juez, solicito la palabra.",["Señor juez solicito la palabra.","Señor, juez solicito la palabra."],"El vocativo se separa con coma.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la puntuación correcta.","Presentó la demanda, el poder, las pruebas y el pliego de posiciones.",["Presentó la demanda, el poder, las pruebas, y el pliego de posiciones.","Presentó la demanda el poder, las pruebas y el pliego de posiciones."],"No se pone coma antes de la conjunción «y» en una enumeración simple.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la puntuación correcta.","El actor solicitó indemnización; el demandado, absolución.",["El actor solicitó indemnización. el demandado, absolución.","El actor solicitó indemnización, el demandado absolución."],"El punto y coma separa oraciones relacionadas, con coma por verbo omitido.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado escrito correctamente.","¿Por qué apeló la sentencia?",["¿Porque apeló la sentencia?","¿Porqué apeló la sentencia?"],"Para preguntar se usa «por qué», separado y con tilde.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado escrito correctamente.","Vamos a ver el expediente esta tarde.",["Vamos haber el expediente esta tarde.","Vamos a haber el expediente esta tarde."],"«A ver» se escribe separado.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado escrito correctamente.","Espero que haya audiencia mañana.",["Espero que halla audiencia mañana.","Espero que aya audiencia mañana."],"«Haya» es el subjuntivo de haber; «halla» es de hallar.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado escrito correctamente.","El testigo tuvo que declarar de nuevo.",["El testigo tubo que declarar de nuevo.","El testigo tuvo que declarar de nuebo."],"«Tuvo» es de tener; «tubo» es un conducto.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado escrito correctamente.","El abogado exigió la devolución del anticipo.",["El abogado exijió la devolución del anticipo.","El abogado exigió la debolución del anticipo."],"Exigir se escribe con g, y devolución con v.","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la acentuación correcta.","Quería llegar más temprano, mas no pudo.",["Quería llegar mas temprano, más no pudo.","Quería llegar más temprano, más no pudo."],"«Más» es cantidad; «mas» equivale a «pero».","Redacción indirecta"),
   Qn(R3,"Elija el enunciado con la acentuación correcta.","Aún no se dicta sentencia.",["Aun no se dicta sentencia.","Aún no se dicta sentencía."],"«Aún» equivale a «todavía» y lleva tilde.","Redacción indirecta"),
   Qn(R3,"Elija la escritura correcta de un nombre en mayúsculas.","ÁNGEL RÍOS",["ANGEL RIOS","ÁNGEL RIOS"],"Las mayúsculas también llevan tilde.","Redacción indirecta")]}
];

 {t:"Comerciantes y actos de comercio", ley:"Código de Comercio",
  cards:[
   Cn("Quiénes son comerciantes","Las personas con capacidad legal que hacen del comercio su ocupación ordinaria, las sociedades constituidas conforme a leyes mercantiles y las sociedades extranjeras, sus agencias o sucursales que ejerzan actos de comercio en el país.","Código de Comercio, art. 3"),
   Cn("Actos de comercio: adquisiciones","Las adquisiciones, enajenaciones y alquileres con propósito de especulación comercial; las compras y ventas de inmuebles con ese propósito; y las de acciones, porciones y obligaciones de sociedades mercantiles.","Código de Comercio, art. 75, fracc. I a III"),
   Cn("Actos de comercio: empresas","Empresas de abastecimientos y suministros, construcciones, fábricas y manufacturas, transportes y turismo, librerías y editoriales, comisiones y agencias, y espectáculos públicos.","Código de Comercio, art. 75, fracc. V a XI"),
   Cn("Actos de comercio: operaciones","Comisión mercantil, mediación de negocios mercantiles, operaciones de bancos, seguros, depósitos por causa de comercio, cheques y letras de cambio de una plaza a otra, y la enajenación de productos del cultivo.","Código de Comercio, art. 75, fracc. XII a XXIII"),
   Cn("Duda sobre la naturaleza","Los actos análogos a los previstos son de comercio. En caso de duda, la naturaleza comercial se fija por arbitrio judicial.","Código de Comercio, art. 75, fracc. XXV")],
  qs:[
   Qn(D2,"Una persona con capacidad legal se dedica de manera habitual a vender ropa. ¿Cómo la considera el Código de Comercio?","Comerciante, porque hace del comercio su ocupación ordinaria",["No comerciante, por vender al menudeo","Comerciante solo si constituye una sociedad"],"Basta capacidad legal y ocupación ordinaria.","Código de Comercio, art. 3"),
   Qn(D2,"Tres socios constituyen una sociedad conforme a las leyes mercantiles. ¿Qué carácter tiene la sociedad?","Comerciante",["Asociación civil","Sin carácter definido"],"Las sociedades mercantiles son comerciantes.","Código de Comercio, art. 3"),
   Qn(D2,"Una sociedad extranjera abre una sucursal en México que realiza actos de comercio. ¿Se le reputa comerciante?","Sí, la sucursal o agencia que ejerce actos de comercio en el territorio nacional",["No, por ser extranjera","Solo si tiene socios mexicanos"],"Lo prevé la fracción III del artículo 3.","Código de Comercio, art. 3"),
   Qn(D2,"Una persona compra mercancías para revenderlas con propósito de especulación comercial. ¿Qué acto realiza?","Un acto de comercio",["Un acto civil","Un acto de beneficencia"],"El propósito de especulación comercial lo hace mercantil.","Código de Comercio, art. 75"),
   Qn(D2,"Una persona compra un inmueble para vivir en él. ¿Es un acto de comercio?","No, solo lo es si se compra con propósito de especulación comercial",["Sí, toda compra de inmuebles lo es","Sí, si el vendedor es comerciante"],"La fracción II exige ese propósito.","Código de Comercio, art. 75"),
   Qn(D2,"Un inversionista compra acciones de una sociedad mercantil. ¿Qué acto es?","Un acto de comercio",["Un acto civil","Un acto de jurisdicción voluntaria"],"Las compras y ventas de acciones son actos de comercio.","Código de Comercio, art. 75"),
   Qn(D2,"Una empresa ejecuta trabajos de construcción públicos y privados. ¿Cómo se califican sus actividades?","Actos de comercio",["Actos civiles","Actos administrativos"],"Las empresas de construcciones están en el artículo 75.","Código de Comercio, art. 75"),
   Qn(D2,"Una empresa transporta personas por tierra. ¿Realiza actos de comercio?","Sí, las empresas de transportes de personas o cosas, por tierra o por agua",["No, solo el transporte de cosas","No, es un servicio público"],"También lo son las empresas de turismo.","Código de Comercio, art. 75"),
   Qn(D2,"Una librería, con su editorial, vende y publica obras. ¿Qué carácter tienen esas actividades?","Actos de comercio",["Actos civiles","Actos de beneficencia"],"Las librerías y editoriales están en la fracción IX.","Código de Comercio, art. 75"),
   Qn(D2,"Una persona contrata un seguro de cualquier especie con una aseguradora. ¿Qué acto es?","Un acto de comercio",["Un acto civil","Un acto de asistencia"],"Los contratos de seguros de toda especie son comerciales.","Código de Comercio, art. 75"),
   Qn(D2,"Se expide un cheque para enviar una remesa de dinero de una plaza a otra. ¿Cómo se considera?","Acto de comercio",["Acto civil","Acto sin naturaleza definida"],"Los cheques, letras de cambio o remesas entre plazas son comerciales.","Código de Comercio, art. 75"),

 {t:"Juicio ejecutivo mercantil", ley:"Código de Comercio",
  cards:[
   Cn("Títulos que traen aparejada ejecución","La sentencia ejecutoriada y el laudo inapelable; los instrumentos públicos y sus testimonios o copias certificadas con obligación exigible y líquida; la confesión judicial del deudor; y los títulos de crédito.","Código de Comercio, art. 1391"),
   Cn("Auto de ejecución","Presentada la demanda con el título ejecutivo, el juez dicta un auto con efectos de mandamiento en forma para requerir de pago y, si no se paga, embargar bienes suficientes, bajo responsabilidad del actor y en depósito de persona nombrada por él.","Código de Comercio, art. 1392"),

   Cn("Ocho días","Hecho el embargo, el demandado tiene ocho días para pagar u oponer excepciones. Dentro de ese plazo debe contestar la demanda, refiriéndose a cada hecho y ofreciendo pruebas.","Código de Comercio, arts. 1396 y 1399"),
   Cn("Excepciones y pruebas","Contra documentos mercantiles que traen aparejada ejecución proceden, entre otras, falsedad del título, fuerza o miedo, prescripción o caducidad, y falta de personalidad. Si no exhibe los documentos de sus excepciones, el juez deja de admitirlas, salvo las supervenientes. Las pruebas se ofrecen en la demanda, la contestación y el desahogo de vista.","Código de Comercio, arts. 1400, 1401 y 1403")],
  qs:[

   Qn(D2,"Un demandado fue requerido de pago, embargado y emplazado. ¿En cuántos días debe contestar la demanda?","Dentro de los ocho días siguientes",["Dentro de treinta días","Dentro de tres días"],"Debe referirse concretamente a cada hecho.","Código de Comercio, art. 1399"),

 {t:"Contratos civiles", ley:"Código Civil Federal",
  cards:[
   Cn("Convenio y contrato","Convenio: acuerdo de dos o más personas para crear, transferir, modificar o extinguir obligaciones. Contrato: el convenio que produce o transfiere obligaciones y derechos.","CCF, arts. 1792 y 1793"),
   Cn("Existencia y validez","Para su existencia se requieren consentimiento y objeto. Puede invalidarse por incapacidad legal, vicios del consentimiento, objeto, motivo o fin ilícito, o falta de la forma legal.","CCF, arts. 1794 y 1795"),
   Cn("Vicios del consentimiento","El consentimiento no es válido si se dio por error, se arrancó por violencia o se sorprendió por dolo. Es ilícito el hecho contrario a leyes de orden público o a las buenas costumbres.","CCF, arts. 1812 y 1830"),
   Cn("Compraventa","Una parte transfiere la propiedad de una cosa o derecho y la otra paga un precio cierto en dinero. Es perfecta y obligatoria al convenir la cosa y el precio. Requiere formalidad si recae sobre un inmueble; hasta 365 veces el salario mínimo puede constar en documento privado con dos testigos ratificado ante notario, juez o Registro Público.","CCF, arts. 2248, 2249, 2316 y 2317"),
   Cn("Arrendamiento, prescripción y edad","Arrendamiento: uso o goce temporal de una cosa por un precio cierto; máximo diez años en habitación y veinte en comercio o industria. La prescripción ordinaria es de diez años. La mayoría de edad comienza a los dieciocho.","CCF, arts. 2398, 1159 y 646")],

refuerzo(11,[

AREAS[0].bloques = AREAS[0].bloques.concat([
 {t:"Constitución: derechos humanos y garantías judiciales", ley:"Constitución Política de los Estados Unidos Mexicanos, arts. 1, 14, 16, 17 y 19",
  cards:[
   Cn("Derechos humanos","Todas las personas gozan de los derechos reconocidos en la Constitución y en los tratados. Las normas se interpretan favoreciendo la protección más amplia. Las autoridades deben promover, respetar, proteger y garantizar los derechos con base en universalidad, interdependencia, indivisibilidad y progresividad, y el Estado debe prevenir, investigar, sancionar y reparar sus violaciones. Está prohibida la esclavitud y toda discriminación que atente contra la dignidad humana.","CPEUM, art. 1"),
   Cn("Legalidad y debido proceso","A ninguna ley se da efecto retroactivo en perjuicio de persona alguna. Nadie puede ser privado de la libertad, propiedades, posesiones o derechos sino mediante juicio ante tribunales previamente establecidos, con formalidades esenciales del procedimiento y conforme a leyes anteriores al hecho. En materia penal se prohíbe imponer penas por analogía o mayoría de razón. En materia civil, la sentencia se ajusta a la letra o interpretación jurídica de la ley y, a falta de ella, a los principios generales del derecho.","CPEUM, art. 14"),
   Cn("Acceso a la justicia","Nadie puede hacerse justicia por sí mismo ni ejercer violencia para reclamar su derecho. Los tribunales deben estar expeditos, resolver de forma pronta, completa e imparcial, y su servicio es gratuito: se prohíben las costas judiciales. Las leyes preverán mecanismos alternativos de solución de controversias y las sentencias de los procedimientos orales se explican en audiencia pública.","CPEUM, art. 17"),
   Cn("Detención, retención y cateo","Ningún indiciado puede ser retenido por el Ministerio Público más de cuarenta y ocho horas. Solo la autoridad judicial expide órdenes de cateo, a solicitud del Ministerio Público. Para delincuencia organizada, el juez puede decretar arraigo por un plazo que no exceda ochenta días.","CPEUM, art. 16"),
   Cn("Vinculación a proceso","Ninguna detención ante autoridad judicial puede exceder de setenta y dos horas sin auto de vinculación a proceso. El Ministerio Público solo puede solicitar la prisión preventiva cuando otras medidas cautelares no sean suficientes para garantizar la comparecencia, la investigación o la protección de víctimas, testigos y comunidad.","CPEUM, art. 19")],
  qs:[
   Qc(S3,"Una ley nueva se aplica a un hecho ocurrido antes de su vigencia, en perjuicio de una persona. ¿Qué principio se vulnera?","La irretroactividad de la ley en perjuicio","El principio de legalidad tributaria","La supremacía constitucional","A ninguna ley se dará efecto retroactivo en perjuicio de persona alguna.","CPEUM, art. 14"),
   Qc(S3,"Una autoridad priva a una persona de sus propiedades sin juicio ante tribunales previamente establecidos. ¿Qué garantía vulnera?","La garantía de audiencia y debido proceso","La libertad de tránsito","El derecho de petición","Nadie puede ser privado de sus derechos sino mediante juicio con formalidades esenciales.","CPEUM, art. 14"),
   Qc(S3,"Un juez penal condena por una conducta parecida a un delito, pero no prevista en la ley, aplicando analogía. ¿Es válido?","No, está prohibido imponer penas por analogía o mayoría de razón","Sí, si es una conducta grave","Sí, con aprobación del Ministerio Público","La pena debe estar decretada por ley exactamente aplicable.","CPEUM, art. 14"),
   Qc(S3,"En un juicio civil la ley no prevé el caso. ¿En qué debe fundarse la sentencia?","En los principios generales del derecho","En la costumbre local únicamente","En la opinión del secretario","A falta de ley se fundará en los principios generales.","CPEUM, art. 14"),
   Qc(S3,"Un acreedor usa la violencia para cobrar una deuda. ¿Qué dispone la Constitución?","Ninguna persona puede hacerse justicia por sí misma ni ejercer violencia para reclamar su derecho","Es lícito si la deuda es cierta","Es lícito si hay testigos","Corresponde acudir a los tribunales.","CPEUM, art. 17"),
   Qc(S3,"Un tribunal cobra costas judiciales por dictar sentencia. ¿Es constitucional?","No, el servicio de justicia es gratuito y se prohíben las costas judiciales","Sí, si son bajas","Sí, en materia civil","Así lo dispone el artículo 17.","CPEUM, art. 17"),
   Qc(S3,"Dos personas con un conflicto penal quieren usar la mediación. ¿La Constitución prevé mecanismos alternativos?","Sí, y en materia penal se asegurará la reparación del daño","No, solo prevé juicios","Solo en materia civil","Las leyes preverán mecanismos alternativos.","CPEUM, art. 17"),
   Qc(S3,"Se dicta sentencia al concluir un juicio oral. ¿Qué exige la Constitución sobre su explicación?","Que se explique en audiencia pública previa citación de las partes","Que se publique en el Diario Oficial","Que se entregue por correo","Es una regla de los procedimientos orales.","CPEUM, art. 17"),
   Qc(S3,"Una autoridad viola un derecho humano. ¿Qué obligaciones tiene el Estado?","Prevenir, investigar, sancionar y reparar la violación","Solo sancionar","Solo reparar","Así lo dispone el artículo 1.","CPEUM, art. 1"),
   Qc(S3,"Una norma de derechos humanos admite dos interpretaciones. ¿Cuál debe preferirse?","La que favorezca en todo tiempo la protección más amplia a las personas","La más restrictiva","La que decida la autoridad administrativa","Es el principio pro persona.","CPEUM, art. 1"),

   Qc(S3,"El Ministerio Público quiere realizar un cateo. ¿Quién puede expedir la orden?","La autoridad judicial, a solicitud del Ministerio Público","El propio Ministerio Público","La policía municipal","Solo la autoridad judicial puede expedirla.","CPEUM, art. 16"),

 Qc(D1,"El SAT niega la devolución de un ingreso solicitada por una empresa. ¿Qué órgano conoce del juicio?","El Tribunal Federal de Justicia Administrativa","El Tribunal Electoral","La Suprema Corte","Las negativas de devolución son de su competencia.","LOTFJA, art. 3"),
 Qc(D1,"Una empresa recibe una multa por infringir normas administrativas federales. ¿Ante qué tribunal la impugna?","El Tribunal Federal de Justicia Administrativa","Un juzgado penal","El Senado","Es materia de su competencia.","LOTFJA, art. 3"),
 Qc(D1,"Un pensionado civil impugna la reducción de su pensión con cargo al erario federal. ¿Ante quién acude?","El Tribunal Federal de Justicia Administrativa","Un tribunal laboral federal","La Junta de Conciliación","Las pensiones civiles son competencia del Tribunal.","LOTFJA, art. 3"),
 Qc(D1,"Una empresa considera ilegal el fallo de una licitación pública federal. ¿Ante quién acude?","El Tribunal Federal de Justicia Administrativa","La Suprema Corte","El Congreso","Las licitaciones públicas están en su competencia.","LOTFJA, art. 3"),
 Qc(D1,"Una persona reclama indemnización por responsabilidad patrimonial del Estado por un daño administrativo federal. ¿Ante quién acude?","El Tribunal Federal de Justicia Administrativa","Un juzgado penal","La Cámara de Diputados","Es materia de su competencia.","LOTFJA, art. 3"),
 Qc(D1,"Una autoridad no responde una petición y opera la negativa ficta. ¿Ante quién puede impugnarse?","Ante el Tribunal Federal de Justicia Administrativa","Ante el Senado","Ante un tribunal electoral","La negativa ficta es materia del Tribunal.","LOTFJA, art. 3"),
 Qc(D1,"Un Órgano interno de control quiere sancionar a un servidor por una falta grave. ¿Ante quién lo promueve?","El Tribunal Federal de Justicia Administrativa","Un juzgado de distrito penal","La Comisión Permanente","El Tribunal conoce de faltas graves.","LOTFJA, art. 4"),
 Qc(D1,"La Auditoría Superior de la Federación quiere sancionar a un particular vinculado con faltas graves. ¿Ante quién promueve?","El Tribunal Federal de Justicia Administrativa","La Corte","La Fiscalía","Lo prevé el artículo 4.","LOTFJA, art. 4"),
 Qc(D1,"Se pregunta cuántas magistraturas integran la Sala Superior del Tribunal Federal de Justicia Administrativa.","Dieciséis","Nueve","Trece","Catorce jurisdiccionales y dos en la Junta.","LOTFJA, art. 7"),
 Qc(D1,"De las dieciséis magistraturas de la Sala Superior, ¿cuántas ejercen funciones jurisdiccionales?","Catorce, una de las cuales preside el Tribunal","Todas","Diez","Las otras dos integran la Junta de Gobierno.","LOTFJA, art. 7"),
 Qc(D1,"Se integra la Junta de Gobierno y Administración. ¿Cuántas personas la forman?","Cinco","Tres","Nueve","Presidente, dos de Sala Superior y dos de Sala Regional.","LOTFJA, art. 22"),
 Qc(D1,"Un integrante de la Junta concluye su periodo de dos años. ¿Puede reelegirse de inmediato?","No, no hay reelección inmediata","Sí","Solo una vez","Los periodos son escalonados.","LOTFJA, art. 22"),
 Qc(D1,"Se pregunta a qué sistema pertenece el Tribunal Federal de Justicia Administrativa.","Al Sistema Nacional Anticorrupción","Al Sistema Electoral","Al Sistema Penitenciario","Forma parte de él.","LOTFJA, art. 1")]);
refuerzoL(6,[
 Qc(D1,"Una persona capta con engaños a otra en su pueblo, la traslada a la ciudad y la retiene para que trabaje sin pago. ¿Qué conducta básica se configura y qué pena tiene?","Trata de personas, de 5 a 15 años de prisión","Fraude, de 1 a 3 años","Abuso de confianza, de 2 a 5 años","Es el tipo básico del artículo 10.","Ley de Trata, art. 10"),
 Qc(D1,"Una mujer adulta ejerce la prostitución bajo control de quien se beneficia con engaño y violencia. Se alega que consintió. ¿Qué efecto tiene?","No excluye la responsabilidad penal","Excluye el delito","Reduce la pena a la mitad","El consentimiento no exime en estos delitos.","Ley de Trata, art. 40"),
 Qc(D1,"Un propietario renta una bodega sabiendo que se usará para mantener personas en explotación. ¿Qué pena enfrenta?","De 2 a 7 años de prisión","De 15 a 30 años","Ninguna","Dar en arrendamiento un inmueble con ese fin se sanciona.","Ley de Trata, art. 34"),
 Qc(D1,"Una empresa contrata anuncios sabiendo que son publicidad ilícita para explotar a personas. ¿Qué pena enfrenta?","De 2 a 7 años de prisión","De 5 a 15 años","De 15 a 30 años","Es la pena por contratar espacios de publicidad ilícita.","Ley de Trata, art. 32"),
 Qc(D1,"Una persona mantiene a otra en esclavitud. ¿Qué pena le corresponde?","De 15 a 30 años de prisión","De 5 a 15 años","De 3 a 10 años","Es la pena por esclavitud.","Ley de Trata, art. 11"),
 Qc(D1,"Una persona mantiene a otra en condición de siervo. ¿Qué pena le corresponde?","De 5 a 10 años de prisión","De 15 a 30 años","De 2 a 7 años","Es la pena del artículo 12.","Ley de Trata, art. 12"),
 Qc(D1,"Un empresario se beneficia del trabajo de personas sometidas a explotación laboral. ¿Qué pena corresponde?","De 3 a 10 años de prisión","De 15 a 30 años","De 2 a 7 años","Es la pena por explotación laboral.","Ley de Trata, art. 21"),
 Qc(D1,"Un hombre obliga a una persona a trabajos forzados con amenazas. ¿Qué pena corresponde?","De 10 a 20 años de prisión","De 3 a 10 años","De 4 a 9 años","Es la pena por trabajos o servicios forzados.","Ley de Trata, art. 22"),
 Qc(D1,"Una persona obliga a otra a mendigar. ¿Qué pena corresponde?","De 4 a 9 años de prisión","De 15 a 30 años","De 2 a 7 años","Es la pena por mendicidad forzosa.","Ley de Trata, art. 24"),
 Qc(D1,"Una persona se beneficia de la explotación sexual de otra. ¿Qué pena corresponde?","De 15 a 30 años de prisión","De 5 a 15 años","De 3 a 10 años","Es la pena del artículo 13.","Ley de Trata, art. 13"),
 Qc(D1,"Una red capta víctimas en otro país y las explota en México. ¿Quién es competente?","La Federación","El municipio","El estado donde se detuvo a una persona","El delito iniciado en el extranjero con efectos en México es federal.","Ley de Trata, art. 5"),
 Qc(D1,"Un delito iniciado en México produce efectos en el extranjero. ¿Qué jurisdicción aplica?","La federal","La municipal","La estatal únicamente","Es un supuesto de competencia federal.","Ley de Trata, art. 5"),
 Qc(D1,"Un adulto utiliza a menores para cometer delitos. ¿Es una forma de explotación en la ley de trata?","Sí, la utilización de menores en actividades delictivas","No","Solo si son mayores de 16","Está entre las formas de explotación.","Ley de Trata, art. 10")]);
refuerzoL(7,[
 Qc(D3,"Una tienda contrata a una empleada nueva. ¿En qué plazo máximo debe inscribirla ante el IMSS?","Cinco días hábiles","Treinta días naturales","Quince días","Es el plazo del artículo 15.","LSS, art. 15"),
 Qc(D3,"Un taller despide a un trabajador. ¿En qué plazo máximo debe comunicar la baja al IMSS?","Cinco días hábiles","Un mes","Tres meses","Se comunican altas, bajas y cambios en ese plazo.","LSS, art. 15"),
 Qc(D3,"El patrón aumenta el salario de un trabajador el día 10 del mes. ¿Cuánto tiene para avisar?","Cinco días hábiles, desde el día siguiente al cambio","Treinta días","Fin de año","Es el aviso de modificación del salario base de cotización.","LSS, art. 34"),
 Qc(D3,"Una persona trabaja como cocinera de planta en un hogar. ¿Tiene derecho al régimen obligatorio?","Sí, las personas trabajadoras del hogar son sujetos de aseguramiento","No, solo empresas","Solo con decreto","Están en el artículo 12.","LSS, art. 12"),
 Qc(D3,"Los socios de una cooperativa de producción quieren afiliarse. ¿Pueden ser asegurados?","Sí, son sujetos de aseguramiento","No, solo subordinados","Solo con permiso","Están en el artículo 12.","LSS, art. 12"),
 Qc(D3,"Un empleado sufre una fractura al resbalar en la fábrica. ¿Qué seguro lo ampara?","Riesgos de trabajo","Invalidez y vida","Retiro y vejez","Es un accidente en ejercicio del trabajo.","LSS, art. 11"),
 Qc(D3,"Un asegurado enferma por causas no laborales. ¿Qué seguro lo ampara?","Enfermedades y maternidad","Riesgos de trabajo","Guarderías","Es el seguro de enfermedad general.","LSS, art. 11"),
 Qc(D3,"Una madre trabajadora necesita cuidado de sus hijos durante su jornada. ¿Qué seguro aplica?","Guarderías y prestaciones sociales","Riesgos de trabajo","Invalidez y vida","Es el quinto seguro del régimen.","LSS, art. 11"),
 Qc(D3,"Un asegurado llega a la edad de retiro. ¿Qué seguro lo ampara?","Retiro, cesantía en edad avanzada y vejez","Riesgos de trabajo","Enfermedades","Es el seguro del artículo 11.","LSS, art. 11"),
 Qc(D3,"Un patrón se pregunta por cuánto tiempo debe conservar sus registros del IMSS. ¿Cuánto?","Cinco años","Un año","Diez años","Debe llevar y conservar registros.","LSS, art. 15"),
 Qc(D3,"Un asegurado vive con su concubina desde hace cinco años. ¿Puede recibir atención como beneficiaria?","Sí, si tienen cinco años de vida marital o hijos en común","No, solo cónyuges","Solo con matrimonio","Lo prevé el artículo 84.","LSS, art. 84"),
 Qc(D3,"Un patrón quiere saber quién debe determinar y enterar las cuotas obrero-patronales. ¿Quién es?","El propio patrón","El trabajador","El Tribunal","Es una de sus obligaciones.","LSS, art. 15"),
 Qc(D3,"Una inspección del IMSS llega a un negocio. ¿Qué debe hacer el patrón?","Permitir las inspecciones y visitas domiciliarias","Negarse","Exigir una orden del Senado","Es una obligación patronal.","LSS, art. 15")]);
refuerzoL(8,[
 Qc(D3,"Un trabajador sufre un accidente en el trayecto directo de su casa al trabajo. ¿Cómo se considera?","Accidente de trabajo","Enfermedad no profesional","Invalidez","La ley incluye el trayecto directo.","LSS, art. 42"),
 Qc(D3,"Un trabajador desarrolla una enfermedad por la acción continuada de una causa de su trabajo. ¿Qué es?","Enfermedad de trabajo","Enfermedad no profesional","Accidente de trabajo","Su origen está en el trabajo.","LSS, art. 43"),
 Qc(D3,"Una asegurada tiene una incapacidad por enfermedad no profesional. ¿Desde cuándo se paga el subsidio y hasta cuándo?","Desde el cuarto día y hasta 52 semanas","Desde el primer día, sin límite","Desde el décimo día","Es el subsidio del artículo 96.","LSS, art. 96"),
 Qc(D3,"Una asegurada espera su parto. ¿Qué subsidio le corresponde?","100 % de su último salario, 42 días antes y 42 días después","60 % por 30 días","100 % solo después del parto","Es el subsidio de maternidad.","LSS, art. 101"),
 Qc(D3,"El parto se retrasa diez días respecto de la fecha prevista. ¿Qué pasa con el subsidio posterior?","Se cubren igualmente 42 días posteriores al parto","Se reducen a 32","Se pierde","El periodo previo excedido no reduce los posteriores.","LSS, art. 101"),
 Qc(D3,"Un asegurado que ganaba $20,000 solo puede obtener $8,000 con un trabajo igual, por enfermedad no profesional. ¿Existe invalidez?","Sí, porque no puede obtener más del 50 % de su remuneración habitual","No","No, solo hay invalidez por accidente","Su referencia sería $10,000.","LSS, art. 119"),
 Qc(D3,"Un asegurado tiene una controversia con el IMSS sobre su pensión. ¿Ante quién se tramita?","Tribunales federales en materia laboral","Tribunal Federal de Justicia Administrativa","Comisión Permanente","Las controversias de asegurados son laborales.","LSS, art. 295"),
 Qc(D3,"Un patrón discute con el IMSS una liquidación de cuotas. ¿Ante quién se tramita?","Tribunal Federal de Justicia Administrativa","Tribunales laborales","La Corte","Las de patrones son administrativas.","LSS, art. 295"),
 Qc(D3,"Un beneficiario reclama una mensualidad de pensión después de 18 meses. ¿Procede?","No, prescribe en un año","Sí, prescribe en cinco años","Sí, no prescribe","Es el plazo para prestaciones en dinero.","LSS, art. 300"),
 Qc(D3,"Un asegurado reclama un subsidio por incapacidad por riesgo de trabajo tras tres años. ¿Procede?","No, prescribe en dos años","Sí, no prescribe","Sí, prescribe en diez años","Los subsidios por riesgo de trabajo prescriben en dos años.","LSS, art. 300"),
 Qc(D3,"Un asegurado no impugna una resolución del IMSS por inconformidad. ¿Qué se entiende?","Que lo no impugnado se entiende consentido","Que se anula","Que se revisa de oficio","Es una regla de los artículos 294 y 295.","LSS, arts. 294 y 295"),
 Qc(D3,"Un asegurado tiene una enfermedad no profesional y reclama subsidio después de dos años. ¿Procede?","No, prescribe en un año","Sí, prescribe en cinco años","Sí, no prescribe","Los subsidios por enfermedad no profesional prescriben en un año.","LSS, art. 300"),
 Qc(D3,"Se quiere saber quién declara la invalidez de una persona asegurada. ¿Quién es?","El IMSS","El patrón","La Secretaría de Hacienda","La ley dispone que la declara el Instituto.","LSS, art. 119")]);
refuerzoL(9,[
 Qc(D3,"Una trabajadora quiere usar su crédito Infonavit para ampliar su vivienda. ¿Es un destino permitido?","Sí, construcción, reparación, ampliación o mejoramiento","No, solo compra","Solo pasivos","Es parte del objeto del Instituto.","LIFNVT, art. 3"),
 Qc(D3,"Una familia quiere acceder a una vivienda en arrendamiento social del Infonavit. ¿Es posible?","Sí, el Instituto otorga en arrendamiento social inmuebles que construya o recupere","No, solo vende","Solo a empresas","Lo prevé el artículo 3.","LIFNVT, art. 3"),
 Qc(D3,"Una empresa contrata a un trabajador. ¿Qué porcentaje del salario aporta al Infonavit?","5 %","2 %","10 %","Se abona a la subcuenta de vivienda.","LIFNVT, art. 29"),
 Qc(D3,"Una empresa no inscribe a sus trabajadores en el Infonavit. ¿Qué obligación incumple?","Inscribirse e inscribir a sus trabajadores en el Instituto y aportar el 5 %","Ninguna","Solo la del IMSS","Lo exige el artículo 29.","LIFNVT, art. 29"),
 Qc(D3,"Una trabajadora con crédito Infonavit fallece. ¿Qué protección aplica a su familia?","El seguro del crédito por muerte los libera de las obligaciones y gravámenes a favor del Instituto","Deben pagar el saldo en treinta días","El Instituto adjudica la vivienda","Su costo lo asume el Instituto.","LIFNVT, art. 51"),
 Qc(D3,"Un acreditado queda con incapacidad total permanente. ¿Qué protección aplica?","El seguro del crédito lo libera de las obligaciones y gravámenes","Debe seguir pagando","Debe pagar el doble","Cubre incapacidad total permanente o muerte.","LIFNVT, art. 51"),
 Qc(D3,"Un trabajador obtiene crédito después de que ya tenía una pensión por invalidez definitiva. Luego queda incapacitado. ¿Lo libera el seguro?","No, por ningún motivo libera la obligación","Sí, siempre","Solo la mitad","La ley excluye ese supuesto.","LIFNVT, art. 51"),
 Qc(D3,"¿Quién paga el costo del seguro del crédito?","El propio Instituto","La persona trabajadora","El patrón","Su costo lo asume el Instituto.","LIFNVT, art. 51"),
 Qc(D3,"Un trabajador quiere impugnar una decisión del Infonavit. ¿Dónde se promueve el recurso de inconformidad?","Ante el propio Instituto","Ante la Corte","Ante el Senado","Es un recurso interno.","LIFNVT, art. 52"),
 Qc(D3,"Un trabajador prefiere acudir directamente a tribunales sin agotar la inconformidad. ¿Puede?","Sí, agotarla es optativo","No","Solo si el monto es alto","Puede acudir a tribunales laborales.","LIFNVT, art. 53"),
 Qc(D3,"Un trabajador tiene una controversia de derechos con el Infonavit. ¿Qué tribunales la resuelven?","Los tribunales federales en materia laboral","Los administrativos","Los electorales","Así lo dispone la ley.","LIFNVT, art. 53"),
 Qc(D3,"Se busca el órgano del Infonavit que se integra de forma tripartita para conocer inconformidades. ¿Cuál es?","La Comisión de Inconformidades","El Comité de Auditoría","La Comisión de Vigilancia","Tiene un miembro por cada sector.","LIFNVT, art. 25"),
 Qc(D3,"¿La Asamblea General es un órgano del Infonavit?","Sí, según el artículo 6","No","Solo en estados","Es el primer órgano enlistado.","LIFNVT, art. 6")]);

AREAS[1].bloques = AREAS[1].bloques.concat([
 {t:"Constitución: proceso penal y control constitucional", ley:"Constitución Política de los Estados Unidos Mexicanos, arts. 20, 21, 103, 105 y 107",
  cards:[
   Cn("Proceso penal","Será acusatorio y oral, con los principios de publicidad, contradicción, concentración, continuidad e inmediación. Su objeto es esclarecer los hechos, proteger al inocente, procurar que el culpable no quede impune y que se repare el daño. Toda audiencia se desarrolla ante el juez, sin delegar el desahogo y la valoración de pruebas, y solo se consideran las desahogadas en la audiencia de juicio, salvo excepciones legales.","CPEUM, art. 20, apartado A"),
   Cn("Imputado y víctima","La persona imputada tiene derecho a que se presuma su inocencia mientras no se declare su responsabilidad mediante sentencia emitida por el juez de la causa. La Constitución reconoce además derechos de la víctima o del ofendido.","CPEUM, art. 20, apartados B y C"),
   Cn("Ministerio Público","La investigación de los delitos corresponde al Ministerio Público y a las policías, que actúan bajo su conducción y mando. El ejercicio de la acción penal ante los tribunales le corresponde, y la ley determina los casos en que los particulares pueden ejercerla. La imposición de las penas es exclusiva de la autoridad judicial. Las infracciones a reglamentos gubernativos solo se sancionan con multa, arresto hasta por treinta y seis horas o trabajo a favor de la comunidad.","CPEUM, art. 21"),
   Cn("Amparo","Los Tribunales de la Federación resuelven las controversias por normas generales, actos u omisiones que violen derechos humanos, por actos federales que vulneren la soberanía de los Estados o la autonomía de la Ciudad de México y por actos locales que invadan la competencia federal. El juicio de amparo se sigue siempre a instancia de parte agraviada y las sentencias solo se ocupan de las personas que lo solicitaron.","CPEUM, arts. 103 y 107"),
   Cn("Controversias y acciones","Las controversias constitucionales se dan, entre otros, entre la Federación y una entidad, la Federación y un municipio, poderes de una misma entidad o un Estado y uno de sus municipios. Las acciones de inconstitucionalidad plantean la contradicción entre una norma general y la Constitución y se ejercen dentro de los treinta días naturales siguientes a su publicación.","CPEUM, art. 105")],
  qs:[
   Qc(D1,"Un juez delega en su secretario el desahogo de pruebas en una audiencia de juicio oral. ¿Es constitucional?","No, la audiencia se desarrolla ante el juez y no puede delegar el desahogo y la valoración de pruebas","Sí, si hay un secretario","Sí, si las partes aceptan","Así lo exige el artículo 20.","CPEUM, art. 20"),
   Qc(D1,"Una sentencia penal se funda en pruebas que no se desahogaron en la audiencia de juicio. ¿Es válido como regla?","No, solo se consideran las pruebas desahogadas en juicio, salvo excepciones legales","Sí, si constan en el expediente","Sí, si las ofrece el Ministerio Público","Es una regla del proceso penal.","CPEUM, art. 20"),
   Qc(D1,"Un imputado es tratado como culpable antes de la sentencia. ¿Qué derecho vulnera?","La presunción de inocencia","El derecho de petición","La libertad de tránsito","Se presume su inocencia mientras no se declare su responsabilidad.","CPEUM, art. 20, apartado B"),
   Qc(D1,"Un ciudadano pregunta cómo es el sistema de proceso penal mexicano. ¿Cuál es?","Acusatorio y oral","Inquisitivo y escrito","Mixto","Con publicidad, contradicción, concentración, continuidad e inmediación.","CPEUM, art. 20"),
   Qc(D1,"La policía investiga un delito. ¿Bajo la conducción de quién actúa?","Del Ministerio Público","Del juez","Del presidente municipal","Los cuerpos de seguridad actúan bajo su mando.","CPEUM, art. 21"),
   Qc(D1,"Una víctima quiere acusar directamente ante el juez, sin el Ministerio Público. ¿Puede?","Solo en los casos que la ley determine","Siempre","Nunca","La ley señala cuándo los particulares pueden ejercer la acción penal.","CPEUM, art. 21"),
   Qc(D1,"El Ministerio Público quiere imponer por sí mismo una pena de prisión. ¿Puede?","No, la imposición de penas es exclusiva de la autoridad judicial","Sí","Solo si el delito es leve","Le corresponde al juez.","CPEUM, art. 21"),
   Qc(D1,"Una autoridad administrativa sanciona una infracción de un reglamento de policía con arresto de 48 horas. ¿Es válido?","No, el arresto no puede exceder de treinta y seis horas","Sí","Sí, si es reincidente","Es el límite del artículo 21.","CPEUM, art. 21"),
   Qc(D1,"¿En qué pueden consistir las sanciones administrativas por infracciones a reglamentos gubernativos?","En multa, arresto hasta por treinta y seis horas o trabajo a favor de la comunidad","En prisión de un año","En confiscación","Son las únicas sanciones.","CPEUM, art. 21"),
   Qc(D1,"Una persona alega que una ley viola derechos humanos reconocidos en un tratado. ¿Qué tribunales resuelven la controversia?","Los Tribunales de la Federación","Los tribunales locales","El Senado","Es materia del amparo.","CPEUM, art. 103"),
   Qc(D1,"Una ley federal restringe la autonomía de la Ciudad de México. ¿Qué tribunales resuelven?","Los Tribunales de la Federación","Los locales","La Comisión Permanente","Lo prevé la fracción II del artículo 103.","CPEUM, art. 103"),
   Qc(D1,"Una ley estatal invade la competencia de la autoridad federal. ¿Qué tribunales resuelven?","Los Tribunales de la Federación","Los locales","Los municipales","Lo prevé la fracción III del artículo 103.","CPEUM, art. 103"),
   Qc(D1,"Nadie promueve amparo, pero un juez quiere iniciarlo por su cuenta. ¿Puede?","No, el amparo se sigue siempre a instancia de parte agraviada","Sí","Solo en materia penal","Así lo dispone el artículo 107.","CPEUM, art. 107"),
   Qc(D1,"Una sentencia de amparo concede protección. ¿A quiénes se ocupa?","Solo a las personas que lo solicitaron","A todas las personas","A los estados","Es el principio de relatividad.","CPEUM, art. 107"),
   Qc(D1,"La Federación y un municipio tienen un conflicto sobre la constitucionalidad de un acto. ¿Qué medio procede?","Controversia constitucional","Amparo directo","Juicio político","Está en el artículo 105, fracción I.","CPEUM, art. 105"),
   Qc(D1,"Un grupo plantea la contradicción entre una ley y la Constitución. ¿En qué plazo se ejerce la acción?","Dentro de los treinta días naturales siguientes a la publicación","En quince días hábiles","En un año","Es el plazo del artículo 105.","CPEUM, art. 105")]}
]);
