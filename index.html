.suave{color:var(--suave)}

:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--hoja);border-top:2px solid var(--tinta);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font:inherit;font-size:12px;font-weight:600;color:var(--suave);background:none;border:none;border-top:4px solid transparent;margin-top:-2px;cursor:pointer}
.nav-b svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-b[aria-current="page"]{color:var(--tinta);border-top-color:var(--tinta);font-weight:800}
.intro{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--fondo);padding:24px 0 40px}

.aviso{border:2px solid var(--tinta);border-radius:6px;padding:10px 14px;margin:0 0 20px;font-size:14px}

.alto-t{font-size:21px;font-weight:800;line-height:1.15;color:#C40018;letter-spacing:-.01em}

.suerte{background:#FFD60A;color:#111;border:4px solid #E1001A;border-radius:10px;padding:14px 16px;margin:20px 0 4px;font-size:17px;font-weight:700;line-height:1.3}
.hoja200{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:14px 0}
.p{aspect-ratio:1;border-radius:50%;background:var(--c)}
.a1{--c:var(--a1)}.a2{--c:var(--a2)}.a3{--c:var(--a3)}.a4{--c:var(--a4)}.a5{--c:var(--a5)}
.leyenda{list-style:none;padding:0;margin:8px 0}

.sw{flex:0 0 16px;height:16px;border-radius:50%;background:var(--c)}
.fila{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--linea)}

.ar-n{font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.tile{min-width:0;overflow-wrap:anywhere;position:relative;text-align:left;font:inherit;color:var(--tinta);background:var(--hoja);border:1px solid var(--linea);border-left:8px solid var(--c);border-radius:6px;padding:10px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile .num{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.03em}
.tile .tl{font-weight:600;font-size:15px;line-height:1.25}
.tile .tm{font-size:12px;color:var(--suave)}
.tile .chk{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;color:var(--ok)}
.tile.ok{background:color-mix(in srgb,var(--c) 24%,var(--hoja))}
.pend{border:2px dashed var(--linea);border-radius:6px;padding:12px 14px;color:var(--suave);font-size:14px}
select,input[type=search],textarea{font:inherit;padding:10px;border:1.5px solid var(--linea);border-radius:6px;background:var(--hoja);color:var(--tinta);width:100%}
textarea{min-height:90px;font-size:13px;word-break:break-all}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--tinta);width:18px;height:18px;margin-top:3px;flex:0 0 auto}
.cabq{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.reloj{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.reloj.pasa{color:var(--mal)}
.enun{font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.5;margin:10px 0 12px}
.opcion{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--tinta);background:var(--hoja);border:1.5px solid var(--linea);border-radius:6px;padding:12px;margin:8px 0;cursor:pointer}
.opcion:disabled{cursor:default;opacity:1;color:var(--tinta)}
.ovalo{flex:0 0 22px;height:22px;border:2px solid var(--tinta);border-radius:50%;margin-top:1px}
.let{font-weight:700;flex:0 0 auto}
.opcion.sel{border-color:var(--tinta);border-width:2px}
.opcion.sel .ovalo{background:var(--tinta)}
.opcion.ok{border-color:var(--ok);border-width:2px;background:color-mix(in srgb,var(--ok) 14%,var(--hoja))}
.opcion.mal{border-color:var(--mal);border-width:2px;background:color-mix(in srgb,var(--mal) 14%,var(--hoja))}
.expl{border-left:6px solid var(--tinta);background:var(--resalta);padding:8px 12px;margin:10px 0;font-size:14px;border-radius:0 6px 6px 0}
.navg{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:16px 0}
.numq{font:inherit;font-size:13px;aspect-ratio:1;padding:0;border:1.5px solid var(--linea);border-radius:50%;background:var(--hoja);color:var(--suave);cursor:pointer}
.numq.resp{background:var(--tinta);color:var(--sobre);border-color:var(--tinta)}
.numq.marca{border:3px solid var(--mal)}
.numq.act{outline:2px solid var(--tinta);outline-offset:2px}
.alerta{border:2px solid var(--mal);border-radius:6px;padding:10px 12px;margin:12px 0}
.rev{border-top:1px solid var(--linea);padding:10px 0}
.rev .estado{font-weight:700}
.rev.bien .estado{color:var(--ok)}
.rev.mal .estado{color:var(--mal)}
.cd{border:1px solid var(--linea);border-radius:6px;background:var(--hoja);margin:8px 0;overflow:hidden}
.cd-h{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--tinta);background:none;border:none;padding:12px 14px;cursor:pointer}
.cd-b{padding:0 14px 12px;font-size:15px}
.cd-b .fu{color:var(--suave);font-size:13px;margin-top:4px}
.tarj{border:1px solid var(--linea);border-top:8px solid var(--c);border-radius:6px;padding:22px 18px;min-height:220px;display:flex;flex-direction:column;justify-content:center;background:var(--hoja);cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--tinta)}
.tarj .t{font-family:"Newsreader",Georgia,serif;font-size:22px;line-height:1.35}
.chip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:600;margin-bottom:12px}
.chip::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.ov{position:fixed;inset:0;z-index:30;background:rgba(10,10,12,.6);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.hoja-d{background:var(--hoja);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
ul.lista{padding-left:20px;margin:8px 0}
.ctx{border-left:6px solid var(--tinta);background:var(--hoja);padding:10px 14px;margin:12px 0;font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.55;border-radius:0 6px 6px 0}
.ctx p{margin:6px 0}
details.gd{border:1px solid var(--linea);border-radius:6px;background:var(--hoja);margin:10px 0}
details.gd>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details.gd>summary::-webkit-details-marker{display:none}
details.gd>summary::after{content:"+";float:right;font-weight:400}
details.gd[open]>summary::after{content:"\2212"}
.gd-b{padding:0 14px 14px}
.gd-b h4{font-size:15px;margin:14px 0 4px}
.gd-b p{margin:6px 0;font-size:15px}
.cubre{font-size:11px;font-weight:700;border:1.5px solid var(--tinta);border-radius:99px;padding:0 7px;margin-left:6px;white-space:nowrap}
.bib li{margin:6px 0;font-size:14px}
footer{max-width:720px;margin:0 auto;padding:8px 16px 16px;color:var(--suave);font-size:12px}
@media (max-width:520px){.fila-cab{flex-wrap:wrap;row-gap:4px}h1{flex:1 1 100%}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
var RITMO = 2.4; /* minutos por reactivo: 8 h para 200 reactivos */
var AREAS = [
  {id:"fp", nombre:"Función pública", n:45, sub:[["Funciones de los entes públicos",13],["Cargos públicos",10],["Derechos y obligaciones",22]], bloques:[], sim:[]},
  {id:"li", nombre:"Litigio", n:50, sub:[["Derecho público",21],["Derecho privado",19],["Derecho social",10]], bloques:[], sim:[]},
  {id:"ja", nombre:"Justicia alternativa y fe pública", n:45, sub:[["Vías no jurisdiccionales",13],["Soluciones alternas y terminación anticipada en materia penal",10],["Sistema no jurisdiccional de protección de los derechos humanos",10],["Fe pública, actividades notariales y registrales",12]], bloques:[], sim:[]},
  {id:"cl", nombre:"Comprensión lectora", n:30, sub:[["Ámbito de estudio",12],["Ámbito literario",12],["Ámbito de participación social",6]], bloques:[], sim:[]},
  {id:"ri", nombre:"Redacción indirecta", n:30, sub:[["Ámbito de estudio",15],["Ámbito de participación social",15]], bloques:[], sim:[]}
];
function Qn(sub,q,ok,mal,e,f,ctx){ var r={s:sub,q:q,o:[ok].concat(mal),e:e,f:f}; if(ctx) r.ctx=ctx; return r; }
function ctxH(q){ return q.ctx? '<div class="ctx">'+q.ctx.split("\n\n").map(function(p){ return '<p>'+p+'</p>'; }).join("")+'</div>' : ""; }
function Cn(t,d,f){ return {t:t,d:d,f:f}; }
var S1="Funciones de los entes públicos", S2="Cargos públicos", S3="Derechos y obligaciones";

/* ================= FUNCIÓN PÚBLICA ================= */
AREAS[0].bloques = [
 {t:"Administración Pública Federal", ley:"Ley Orgánica de la Administración Pública Federal",
  cards:[
   Cn("Administración centralizada","Oficina de la Presidencia, Secretarías de Estado y Consejería Jurídica.","LOAPF, art. 1"),
   Cn("Administración paraestatal","Organismos descentralizados, empresas de participación estatal, instituciones nacionales de crédito, organizaciones auxiliares nacionales de crédito, instituciones nacionales de seguros y de fianzas, y fideicomisos.","LOAPF, art. 1"),
   Cn("Rango de las Secretarías","Todas tienen igual rango, sin preeminencia. Por acuerdo del Presidente, Gobernación coordina las acciones para cumplir sus órdenes.","LOAPF, art. 10"),
   Cn("Refrendo","Reglamentos, decretos y acuerdos del Presidente van firmados por el Secretario respectivo; si son de dos o más Secretarías, los refrendan todos. Los decretos promulgatorios de leyes del Congreso solo requieren el refrendo de Gobernación.","LOAPF, art. 13"),
   Cn("Órganos desconcentrados","Están jerárquicamente subordinados a una Secretaría y tienen facultades específicas para resolver en su materia y ámbito territorial.","LOAPF, art. 17")],
  qs:[
   Qn(S1,"¿Qué dependencias integran la Administración Pública Centralizada?","La Oficina de la Presidencia, las Secretarías de Estado y la Consejería Jurídica",["Los organismos descentralizados y los fideicomisos","Las Secretarías de Estado y las empresas de participación estatal"],"Así lo dice el artículo 1. Los organismos descentralizados, las empresas de participación estatal y los fideicomisos son paraestatales.","LOAPF, art. 1"),
   Qn(S1,"¿Quién debe refrendar el decreto que promulga una ley expedida por el Congreso de la Unión?","Solo el titular de la Secretaría de Gobernación",["Todos los Secretarios de Estado","El Consejero Jurídico del Ejecutivo Federal"],"En los decretos promulgatorios de leyes del Congreso solo se requiere el refrendo de Gobernación.","LOAPF, art. 13"),
   Qn(S1,"Un reglamento del Presidente regula asuntos de dos Secretarías. ¿Cómo debe expedirse para ser válido?","Refrendado por los titulares de ambas Secretarías",["Firmado solo por el Secretario de Gobernación","Firmado únicamente por el Presidente"],"Cuando el asunto es de dos o más Secretarías, deben refrendarlo todos sus titulares.","LOAPF, art. 13"),
   Qn(S1,"Un órgano administrativo desconcentrado es aquel que…","está jerárquicamente subordinado a una Secretaría y tiene facultades específicas en su materia y territorio",["forma parte de la administración paraestatal y tiene patrimonio propio","es independiente de las Secretarías y responde solo al Congreso"],"Los desconcentrados siguen dentro de la Secretaría. Los descentralizados son paraestatales.","LOAPF, art. 17")]},

 {t:"Secretarías de Estado y sus asuntos", ley:"Ley Orgánica de la Administración Pública Federal",
  cards:[
   Cn("Listado del artículo 26","Enlista 22 dependencias, entre ellas la Secretaría Anticorrupción y Buen Gobierno, la de Ciencia, Humanidades, Tecnología e Innovación, la de las Mujeres y la Agencia de Transformación Digital y Telecomunicaciones.","LOAPF, art. 26"),
   Cn("Titulares y Presidente","Los titulares de las Secretarías ejercen sus funciones por acuerdo del Presidente. Resuelven originalmente los asuntos de su competencia y pueden delegar, salvo lo que solo ellos deban ejercer.","LOAPF, arts. 11 y 16"),
   Cn("Gobernación","Formula y conduce la política interior que no se atribuya expresamente a otra dependencia.","LOAPF, art. 27, fracc. I"),
   Cn("Relaciones Exteriores","Conduce la política exterior e interviene en toda clase de tratados, acuerdos y convenciones en los que el país sea parte.","LOAPF, art. 28, fracc. I"),
   Cn("Salud","Elabora y conduce la política nacional en salud pública, asistencia social, prevención, atención a la salud y salubridad general.","LOAPF, art. 39, fracc. I")],
  qs:[
   Qn(S1,"¿Qué Secretaría interviene en toda clase de tratados, acuerdos y convenciones en los que México sea parte?","Relaciones Exteriores",["Gobernación","La Consejería Jurídica"],"Es atribución de Relaciones Exteriores al conducir la política exterior.","LOAPF, art. 28"),
   Qn(S1,"¿Qué Secretaría formula y conduce la política interior que no se atribuya expresamente a otra dependencia?","Gobernación",["Defensa Nacional","Seguridad y Protección Ciudadana"],"Es la primera atribución de Gobernación.","LOAPF, art. 27"),
   Qn(S1,"¿Qué relación jerárquica guardan entre sí las Secretarías de Estado?","Tienen igual rango y ninguna tiene preeminencia sobre otra",["La de Gobernación es superior a las demás","La de Hacienda supervisa a todas"],"Por acuerdo del Presidente, Gobernación solo coordina las acciones para cumplir sus órdenes.","LOAPF, art. 10"),
   Qn(S1,"Entre las dependencias del artículo 26 de la ley se encuentra…","la Secretaría Anticorrupción y Buen Gobierno",["el Instituto Nacional Electoral","la Comisión Nacional de los Derechos Humanos"],"El INE y la CNDH son organismos autónomos, no dependencias del Ejecutivo.","LOAPF, art. 26")]},

 {t:"Congreso de la Unión", ley:"Ley Orgánica del Congreso General",
  cards:[
   Cn("Periodos ordinarios","Primero: desde el 1 de septiembre hasta el 15 de diciembre (31 de diciembre si el Presidente inicia su encargo el 1 de octubre). Segundo: desde el 1 de febrero hasta el 30 de abril.","LOCGEUM, art. 4"),
   Cn("Apertura e informe","Los periodos se abren en sesión conjunta el 1 de septiembre (17:00 h) y el 1 de febrero (11:00 h). El 1 de septiembre el Presidente asiste y presenta su informe.","LOCGEUM, arts. 6 y 7"),
   Cn("Sesión conjunta","Se reúnen ambas Cámaras para los asuntos de los artículos 69, 84, 85, 86 y 87 constitucionales y para sesiones solemnes, en el recinto de Diputados. Su presidente preside el Congreso.","LOCGEUM, art. 5"),
   Cn("Sin promulgación ni veto","La Ley Orgánica del Congreso y sus reformas no necesitan promulgación del Presidente ni pueden ser vetadas.","LOCGEUM, art. 3"),
   Cn("Comisión Permanente y Mesa Directiva","Comisión Permanente: 37 miembros, 19 diputados y 18 senadores, en los recesos. Mesa Directiva de Diputados: un presidente, tres vicepresidentes y un secretario por grupo parlamentario; dura un año.","LOCGEUM, arts. 17, 116 y 117")],
  qs:[
   Qn(S1,"En general, ¿hasta qué fecha puede prolongarse el primer periodo ordinario de sesiones?","15 de diciembre",["30 de noviembre","31 de enero"],"El segundo periodo termina a más tardar el 30 de abril.","LOCGEUM, art. 4"),
   Qn(S1,"¿Cómo se integra la Comisión Permanente?","19 diputados y 18 senadores",["18 diputados y 19 senadores","37 diputados"],"Son 37 miembros que las Cámaras designan en la última sesión de cada periodo.","LOCGEUM, art. 117"),
   Qn(S1,"¿Qué dice el artículo 3 sobre la Ley Orgánica del Congreso?","No necesita promulgación del Presidente ni puede ser vetada",["Requiere refrendo de Gobernación","Puede ser vetada en un plazo de 30 días"],"Es una ley que el Congreso expide sin intervención del Ejecutivo.","LOCGEUM, art. 3"),
   Qn(S1,"El 1 de septiembre, en la apertura del primer periodo ordinario, el Presidente de la República…","asiste y presenta su informe",["protesta el cargo ante la Suprema Corte","convoca a periodo extraordinario"],"Es la sesión conjunta de apertura conforme al artículo 69 constitucional.","LOCGEUM, art. 7")]},

 {t:"Poder Judicial de la Federación", ley:"Ley Orgánica del Poder Judicial de la Federación (2025)",
  cards:[
   Cn("Órganos del Poder Judicial","Suprema Corte, Tribunal Electoral, Plenos Regionales, Tribunales Colegiados de Circuito, Tribunales Colegiados de Apelación, Juzgados de Distrito, Tribunal de Disciplina Judicial y Órgano de Administración Judicial.","LOPJF, art. 1"),
   Cn("Suprema Corte","Nueve ministras y ministros, en Pleno. Bastan cinco para sesionar; en ciertos casos constitucionales se requieren al menos seis.","LOPJF, arts. 2 y 4"),
   Cn("Requisitos para ministro","Licenciatura en derecho, promedio de 8 (y 9 en materias afines) y 5 años de práctica. Residir en el país 2 años antes de la convocatoria. No haber sido Secretario de Estado, Fiscal General, senador, diputado federal ni gobernador durante el año previo.","LOPJF, art. 9"),
   Cn("Duración y elección","Doce años, sin reelección. Son elegidos por la ciudadanía. La presidencia de la Corte se renueva cada dos años según la votación.","LOPJF, arts. 9, 10 y 18"),
   Cn("Disciplina y administración","Tribunal de Disciplina Judicial: cinco personas electas. Órgano de Administración Judicial: cinco personas; su presidencia se designa por insaculación y dura dos años.","LOPJF, arts. 71, 72 y 135")],
  qs:[
   Qn(S1,"¿De cuántas personas se compone la Suprema Corte de Justicia de la Nación?","Nueve",["Once","Cinco"],"Funciona en Pleno con nueve ministras y ministros.","LOPJF, art. 2"),
   Qn(S2,"¿Cuánto duran en el cargo las ministras y ministros de la Suprema Corte?","Doce años, sin reelección",["Quince años, con una reelección","Seis años, con reelección"],"La ley no permite un nuevo periodo.","LOPJF, art. 10"),
   Qn(S1,"¿Cuál de estos NO es un órgano del Poder Judicial de la Federación?","La Fiscalía General de la República",["El Tribunal de Disciplina Judicial","El Órgano de Administración Judicial"],"La Fiscalía es un órgano autónomo. Los otros dos están en el artículo 1.","LOPJF, art. 1"),
   Qn(S2,"¿Qué cargo NO debió ocupar durante el año previo a la convocatoria quien aspire a ministro?","Diputado federal",["Juez de Distrito","Profesor universitario"],"También quedan excluidos Secretario de Estado, Fiscal General, senador y gobernador.","LOPJF, art. 9")]},

 {t:"Órganos reguladores y telecomunicaciones", ley:"Ley de Órganos Reguladores Energéticos (2014) y Ley en materia de Telecomunicaciones (2025)",
  cards:[
   Cn("Reguladores energéticos (texto 2014, sustituido)","La Comisión Nacional de Hidrocarburos y la Comisión Reguladora de Energía son dependencias del Ejecutivo con autonomía técnica, operativa y de gestión.","LORCME, arts. 2 y 3"),
   Cn("Comisionados (texto 2014)","Siete por órgano, incluido el presidente. Periodos escalonados de siete años y una sola reelección. El presidente se designa de una terna que el Ejecutivo presenta al Senado.","LORCME, arts. 5 a 7"),
   Cn("Requisitos de comisionado (texto 2014)","Ciudadano mexicano, buena reputación sin condena por delito doloso con prisión, título afín, 5 años destacados y no haber sido Secretario, Fiscal, senador, diputado o gobernador en el año previo.","LORCME, art. 8"),
   Cn("Servicio público y espectro","Telecomunicaciones y radiodifusión son servicios públicos de interés general. El Estado mantiene el dominio originario, inalienable e imprescriptible del espectro radioeléctrico.","LMTR, art. 2"),
   Cn("Autoridades y concesión única","Hay una Agencia de Transformación Digital y Telecomunicaciones y una Comisión Reguladora de Telecomunicaciones, con Pleno de cinco personas comisionadas. La Comisión otorga la concesión única hasta por 30 años, prorrogable.","LMTR, arts. 3, 11 y 51")],
  qs:[
   Qn(S1,"¿Cuántos comisionados integran el órgano de gobierno de cada regulador energético (texto de 2014)?","Siete",["Cinco","Nueve"],"Incluyen a su presidente y se acompañan de una Secretaría Ejecutiva.","LORCME, art. 5"),
   Qn(S1,"¿Hasta por cuánto tiempo puede otorgarse una concesión única de telecomunicaciones?","Treinta años",["Diez años","Veinte años"],"Puede prorrogarse por plazos iguales.","LMTR, art. 51"),
   Qn(S1,"Según la ley de telecomunicaciones de 2025, el espectro radioeléctrico es…","dominio originario, inalienable e imprescriptible del Estado",["propiedad de los concesionarios que lo usan","de libre uso, sin regulación federal"],"El Estado lo conserva aunque otorgue concesiones.","LMTR, art. 2"),
   Qn(S2,"¿Cómo se designa al comisionado presidente de un regulador energético (texto de 2014)?","El Senado lo designa de una terna que presenta el Ejecutivo",["El Presidente lo nombra libremente","Los comisionados lo eligen entre ellos"],"El periodo como presidente es de siete años.","LORCME, art. 7")]},

 {t:"Elecciones y consulta popular", ley:"COFIPE (2008) y Ley Federal de Consulta Popular",
  cards:[
   Cn("Principios del IFE (texto 2008, abrogado)","Certeza, legalidad, independencia, imparcialidad y objetividad. El voto es universal, libre, secreto, directo, personal e intransferible.","COFIPE 2008, arts. 4 y 105"),
   Cn("Consejo General del IFE (texto 2008, abrogado)","Consejero presidente, ocho consejeros electorales, consejeros del Poder Legislativo, representantes de partidos y secretario ejecutivo. El presidente dura seis años y una reelección.","COFIPE 2008, art. 110"),
   Cn("Quién puede pedir una consulta","El Presidente, el 33 % de los integrantes de cualquier Cámara o ciudadanos equivalentes al 2 % de la lista nominal (trascendencia nacional).","LFCPo, art. 12"),
   Cn("Fecha, vinculación y efectos","Se realiza el primer domingo de agosto y la petición se presenta hasta el 30 de noviembre del año anterior. Es vinculante con participación de al menos 40 % de la lista nominal y sus efectos duran tres años.","LFCPo, arts. 5, 8, 13 y 64"),
   Cn("Temas prohibidos y Suprema Corte","No pueden ser objeto: restricción de derechos humanos, principios del artículo 40, permanencia de servidores de elección popular, materia electoral, sistema financiero y presupuesto, obras en ejecución, seguridad nacional y Fuerza Armada. La Corte revisa la materia en 20 días naturales y sus resoluciones son inatacables.","LFCPo, arts. 11, 26, 28 y 29")],
  qs:[
   Qn(S3,"¿Qué participación mínima se necesita para que el resultado de una consulta popular sea vinculante?","40 % de la lista nominal",["30 % de la lista nominal","50 % de la lista nominal"],"Además, sus efectos duran tres años desde la declaratoria de validez.","LFCPo, arts. 5 y 64"),
   Qn(S3,"Ciudadanos piden una consulta de trascendencia nacional. ¿Qué apoyo mínimo necesitan?","2 % de la lista nominal de electores",["1 % de la lista nominal","10 % del padrón"],"El Presidente o el 33 % de una Cámara pueden pedirla sin firmas.","LFCPo, art. 12"),
   Qn(S3,"¿Cuál de estos temas NO puede ser objeto de consulta popular?","La seguridad nacional",["Un tema de trascendencia nacional competencia de la Federación","Un tema de trascendencia regional competencia de la Federación"],"Los otros dos son justamente los temas que sí pueden consultarse.","LFCPo, arts. 5 y 11"),
   Qn(S1,"Según el COFIPE de 2008, las actividades del IFE se rigen por los principios de…","certeza, legalidad, independencia, imparcialidad y objetividad",["máxima publicidad, paridad y austeridad","eficacia, economía y honradez"],"Es un texto abrogado: hoy rige la ley general electoral.","COFIPE 2008, art. 105")]},

 {t:"Responsabilidades de servidores públicos", ley:"Ley General de Responsabilidades Administrativas",
  cards:[
   Cn("Sujetos de la ley","Los servidores públicos, quienes lo fueron y caigan en los supuestos de la ley, y los particulares vinculados con faltas graves.","LGRA, art. 4"),
   Cn("Principios del servicio público","Austeridad, disciplina, legalidad, objetividad, profesionalismo, honradez, lealtad, imparcialidad, integridad, rendición de cuentas, eficacia, eficiencia y racionalidad en el uso de recursos.","LGRA, art. 7"),
   Cn("Faltas graves","Cohecho, peculado, desvío de recursos públicos, abuso de funciones, actuación bajo conflicto de interés, enriquecimiento oculto u ocultamiento de conflicto de interés, tráfico de influencias y encubrimiento.","LGRA, arts. 52 a 62"),
   Cn("Cohecho, peculado y desvío","Cohecho: exigir, aceptar u obtener un beneficio indebido con motivo de sus funciones. Peculado: usar o apropiarse de recursos públicos para sí o para terceros sin fundamento. Desvío: autorizar o realizar actos para asignar o desviar recursos sin fundamento.","LGRA, arts. 52 a 54"),
   Cn("Prescripción y sanciones","Faltas no graves: prescriben en tres años. Graves y de particulares: siete. Sanciones por no graves: amonestación, suspensión de 1 a 30 días naturales, destitución e inhabilitación temporal; las imponen las Secretarías u Órganos internos de control.","LGRA, arts. 74, 75 y 77")],
  qs:[
   Qn(S2,"¿En cuánto prescriben las facultades para sancionar una falta administrativa no grave?","Tres años",["Un año","Siete años"],"Las faltas graves y las de particulares prescriben en siete.","LGRA, art. 74"),
   Qn(S2,"Un servidor usa su cargo para inducir a otro a retrasar un acto de su competencia y obtener un beneficio. Incurre en…","tráfico de influencias",["cohecho","peculado"],"El tráfico de influencias usa la posición del cargo para inducir a otro servidor.","LGRA, art. 61"),
   Qn(S2,"¿Qué autoridades imponen las sanciones por faltas administrativas no graves?","Las Secretarías o los Órganos internos de control",["El Tribunal, en todos los casos","La Cámara de Diputados"],"El Tribunal conoce de las faltas graves.","LGRA, arts. 75 y 77"),
   Qn(S2,"¿Cuál de estas NO es una sanción por falta administrativa no grave?","Prisión preventiva",["Amonestación pública o privada","Destitución del empleo, cargo o comisión"],"Las sanciones son administrativas, no penales.","LGRA, art. 75")]},

 {t:"Contribuyentes y obligaciones fiscales", ley:"Ley Federal de los Derechos del Contribuyente y Ley del Impuesto sobre la Renta",
  cards:[
   Cn("Consultas fiscales","La autoridad debe contestar por escrito en máximo tres meses. La respuesta es vinculatoria en los términos del Código Fiscal.","LFDC, art. 9"),
   Cn("Derecho a corregirse","Desde el inicio de las facultades de comprobación y hasta antes de que se notifique la resolución que determine las contribuciones omitidas. No requiere autorización.","LFDC, art. 14"),
   Cn("Multas por corregirse","20 % de las contribuciones omitidas si paga antes de que se notifique el acta final u oficio de observaciones. 30 % si paga después, pero antes de la resolución.","LFDC, art. 17"),
   Cn("Plazo, buena fe y defensa","La autoridad tiene seis meses para determinar omisiones; si no lo hace, se entiende que no hay crédito fiscal por lo revisado. La actuación del contribuyente se presume de buena fe. Si la notificación omite el medio de defensa, cuenta con el doble del plazo.","LFDC, arts. 18, 21 y 23"),
   Cn("ISR de personas morales","Tasa de 30 % sobre el resultado fiscal. Declaración anual dentro de los tres meses siguientes al cierre del ejercicio.","LISR, art. 9"),
   Cn("ISR de personas físicas","Declaración anual en abril del año siguiente. Los residentes en México pagan por todos sus ingresos; los residentes en el extranjero, por los atribuibles a un establecimiento permanente o a fuentes de riqueza en el país.","LISR, arts. 1 y 150")],
  qs:[
   Qn(S3,"¿En qué plazo máximo debe contestar por escrito la autoridad fiscal una consulta sobre una situación real y concreta?","Tres meses",["Un mes","Seis meses"],"La respuesta es vinculatoria para la autoridad.","LFDC, art. 9"),
   Qn(S3,"Un contribuyente corrige su situación tras iniciar la revisión, pero antes de que se le notifique el acta final. ¿Qué multa paga?","20 % de las contribuciones omitidas",["30 % de las contribuciones omitidas","50 % de las contribuciones omitidas"],"El 30 % aplica si paga después del acta final o del oficio de observaciones.","LFDC, art. 17"),
   Qn(S3,"¿Cuál es la tasa del impuesto sobre la renta de las personas morales?","30 %",["25 %","35 %"],"Se aplica al resultado fiscal del ejercicio.","LISR, art. 9"),
   Qn(S3,"¿En qué mes presentan su declaración anual las personas físicas?","Abril",["Marzo","Mayo"],"Es el mes de abril del año siguiente al del ejercicio.","LISR, art. 150"),
   Qn(S3,"Si la autoridad no determina las contribuciones omitidas en seis meses…","se entiende que no existe crédito fiscal por los hechos, contribuciones y periodos revisados",["puede seguir revisando sin límite","el contribuyente pierde su derecho a corregirse"],"Es una consecuencia expresa del plazo de seis meses.","LFDC, art. 18")]},

 {t:"Datos personales y transparencia", ley:"Ley Federal de Protección de Datos Personales (2025) y Ley General de Transparencia (2025)",
  cards:[
   Cn("Principios de datos personales","Licitud, finalidad, lealtad, consentimiento, calidad, proporcionalidad, información y responsabilidad.","LFPDPPP, art. 5"),
   Cn("Derechos ARCO","Acceso, rectificación, cancelación y oposición. Ejercer uno no es requisito ni impide ejercer otro.","LFPDPPP, arts. 21 a 26"),
   Cn("Datos sensibles","Requieren consentimiento expreso y por escrito de la persona titular.","LFPDPPP, art. 8"),
   Cn("Plazos ARCO y autoridad","El responsable responde en máximo 20 días y, si procede, cumple dentro de los 15 días siguientes. La autoridad en la materia es la Secretaría Anticorrupción y Buen Gobierno.","LFPDPPP, arts. 2 y 31"),
   Cn("Acceso a la información","Comprende solicitar, investigar, difundir, buscar y recibir información. Toda la que poseen los sujetos obligados es pública, salvo reserva temporal por interés público o seguridad nacional. Prevalece la máxima publicidad.","LGTAIP, arts. 4 y 7"),
   Cn("Plazos de transparencia","Respuesta a la solicitud: hasta 20 días, ampliables 10 más con justificación ante el Comité de Transparencia. Recurso de revisión: se resuelve en máximo 40 días, ampliables una vez por 20.","LGTAIP, arts. 134 y 148")],
  qs:[
   Qn(S3,"¿Cuál de estos NO es un derecho ARCO?","Prescripción",["Rectificación","Oposición"],"Los derechos ARCO son acceso, rectificación, cancelación y oposición.","LFPDPPP, arts. 21 a 26"),
   Qn(S3,"Para tratar datos personales sensibles, el responsable debe obtener consentimiento…","expreso y por escrito",["tácito","verbal"],"Puede constar en firma autógrafa, firma electrónica u otro mecanismo de autenticación.","LFPDPPP, art. 8"),
   Qn(S3,"¿En qué plazo máximo debe notificarse la respuesta a una solicitud de acceso a la información pública?","20 días",["5 días","60 días"],"Puede ampliarse 10 días más, con justificación ante el Comité de Transparencia.","LGTAIP, art. 134"),
   Qn(S3,"¿Qué principio debe prevalecer al aplicar e interpretar la Ley General de Transparencia?","Máxima publicidad",["Reserva permanente","Discrecionalidad de la autoridad"],"La reserva es temporal y por causas señaladas en la ley.","LGTAIP, art. 7")]},

 {t:"Salud y niñez", ley:"Ley General de Salud y Ley General de los Derechos de Niñas, Niños y Adolescentes",
  cards:[
   Cn("Autoridades sanitarias","El Presidente de la República, el Consejo de Salubridad General, la Secretaría de Salud y los gobiernos de las entidades federativas.","LGS, art. 4"),
   Cn("Derechos del usuario de salud","Quienes no tienen seguridad social reciben servicios, medicamentos e insumos gratis, sin discriminación. Tienen derecho a información suficiente, clara, oportuna y veraz, y en su lengua si son indígenas o afromexicanas.","LGS, arts. 51 Bis 1 y 77 bis 1"),
   Cn("Edades","Niñas y niños: menores de 12 años. Adolescentes: 12 cumplidos y menos de 18. Ante la duda sobre los 18, se presume adolescente; sobre los 12, niña o niño.","LGDNNA, art. 5"),
   Cn("Principios rectores","Interés superior de la niñez, igualdad sustantiva, no discriminación, inclusión, participación, corresponsabilidad, autonomía progresiva y pro persona, entre otros.","LGDNNA, art. 6"),
   Cn("Identidad","Desde el nacimiento: nombre y apellidos, inscripción inmediata y gratuita en el Registro Civil, primera copia certificada sin costo y nacionalidad.","LGDNNA, art. 19")],
  qs:[
   Qn(S3,"Según la LGDNNA, ¿a partir de qué edad se es adolescente?","12 años cumplidos",["10 años","15 años"],"Adolescentes son quienes tienen 12 cumplidos y menos de 18.","LGDNNA, art. 5"),
   Qn(S3,"Ante la duda de si una persona tiene más de 18 años, ¿qué se presume?","Que es adolescente",["Que es adulta","Que es niña o niño"],"La presunción favorece a la persona.","LGDNNA, art. 5"),
   Qn(S1,"¿Quiénes son autoridades sanitarias según la Ley General de Salud?","El Presidente, el Consejo de Salubridad General, la Secretaría de Salud y los gobiernos de las entidades federativas",["Solo la Secretaría de Salud","El IMSS, el ISSSTE y la Secretaría de Salud"],"Así lo enumera el artículo 4.","LGS, art. 4"),
   Qn(S3,"Una persona sin seguridad social llega a un hospital público. Tiene derecho a…","recibir gratuitamente servicios de salud, medicamentos e insumos asociados",["pagar una cuota de recuperación","esperar a afiliarse a la seguridad social"],"Sin discriminación y sin importar su condición social.","LGS, art. 77 bis 1")]},

 {t:"Residuos", ley:"Ley General para la Prevención y Gestión Integral de los Residuos",
  cards:[
   Cn("Objeto","Reglamenta la protección al ambiente en materia de residuos y garantiza el derecho de toda persona a un medio ambiente sano y al desarrollo sustentable.","LGPGIR, art. 1"),
   Cn("Residuos urbanos y de manejo especial","Urbanos: los de casas habitación por actividades domésticas y consumo, y los de actividades con características domiciliarias. De manejo especial: los de procesos productivos que no son peligrosos ni urbanos, o los de grandes generadores de residuos urbanos.","LGPGIR, art. 5"),
   Cn("Tipos de generadores","Microgenerador: hasta 400 kg de residuos peligrosos al año. Pequeño: de 400 kg a menos de 10 toneladas. Gran generador: 10 toneladas o más al año.","LGPGIR, art. 5"),
   Cn("Quién hace qué","Federación: política nacional. Entidades federativas: residuos de manejo especial. Municipios: recolección, traslado, tratamiento y disposición final de residuos sólidos urbanos.","LGPGIR, arts. 7, 9 y 10")],
  qs:[
   Qn(S3,"¿Cuánto genera al año un gran generador?","10 toneladas o más de residuos",["1 tonelada o más","400 kilogramos o más"],"Entre 400 kg y menos de 10 toneladas es pequeño generador.","LGPGIR, art. 5"),
   Qn(S1,"¿A quién corresponde el manejo integral de los residuos sólidos urbanos?","A los municipios",["A la Federación","A las empresas generadoras"],"Incluye recolección, traslado, tratamiento y disposición final.","LGPGIR, art. 10"),
   Qn(S3,"Los residuos generados en casas habitación por actividades domésticas son…","residuos sólidos urbanos",["residuos peligrosos","residuos de manejo especial"],"Es la definición de residuos sólidos urbanos.","LGPGIR, art. 5")]},

 {t:"Tratados y Corte Penal Internacional", ley:"Convención de Viena sobre tratados y Estatuto de Roma",
  cards:[
   Cn("Tratado","Acuerdo internacional celebrado por escrito entre Estados y regido por el derecho internacional, cualquiera que sea su denominación.","Convención de Viena, art. 2"),
   Cn("Cumplimiento","Todo tratado en vigor obliga a las partes y debe cumplirse de buena fe. Un Estado no puede invocar su derecho interno para incumplirlo.","Convención de Viena, arts. 26 y 27"),
   Cn("Interpretación y nulidad","Se interpreta de buena fe según el sentido corriente de sus términos, en su contexto y a la luz de su objeto y fin. Es nulo el tratado que se oponga a una norma imperativa (jus cogens). No crea obligaciones ni derechos para terceros Estados sin su consentimiento.","Convención de Viena, arts. 31, 34 y 53"),
   Cn("Corte Penal Internacional","Institución permanente y complementaria de las jurisdicciones penales nacionales. Sus crímenes: genocidio, lesa humanidad, guerra y agresión. Se activa por remisión de un Estado Parte o del Consejo de Seguridad, o cuando el Fiscal inicia una investigación.","Estatuto de Roma, arts. 1, 5 y 13"),
   Cn("Límites y penas","No juzga a quien era menor de 18 años al cometer el crimen. El cargo oficial no exime. Los crímenes no prescriben. Pena: hasta 30 años de reclusión o perpetuidad por extrema gravedad.","Estatuto de Roma, arts. 26, 27, 29 y 77")],
  qs:[
   Qn(S1,"Según la Convención de Viena, ¿qué es un tratado?","Un acuerdo internacional celebrado por escrito entre Estados y regido por el derecho internacional",["Cualquier acuerdo verbal entre gobiernos","Una ley aprobada por el Congreso de un Estado"],"No importa su denominación particular.","Convención de Viena, art. 2"),
   Qn(S1,"Un Estado alega que su ley interna le impide cumplir un tratado en vigor. Conforme a la Convención de Viena…","no puede invocar su derecho interno como justificación",["puede incumplirlo temporalmente","debe renegociarlo con su Congreso"],"La regla se entiende sin perjuicio del artículo 46.","Convención de Viena, art. 27"),
   Qn(S3,"¿Cuál de estos NO es un crimen de competencia de la Corte Penal Internacional?","Delitos contra la salud",["Genocidio","Crímenes de guerra"],"Sus crímenes son genocidio, lesa humanidad, guerra y agresión.","Estatuto de Roma, art. 5"),
   Qn(S3,"¿Cuál es la pena máxima de reclusión por años que puede imponer la Corte Penal Internacional?","30 años",["20 años","40 años"],"Puede imponer reclusión a perpetuidad cuando lo justifique la extrema gravedad.","Estatuto de Roma, art. 77")]},

 {t:"Derechos humanos interamericanos", ley:"Convención Americana sobre Derechos Humanos",
  cards:[
   Cn("Obligación de respetar y garantizar","Los Estados respetan los derechos y libertades y garantizan su libre y pleno ejercicio a toda persona bajo su jurisdicción, sin discriminación.","CADH, art. 1"),
   Cn("Libertad y garantías judiciales","Nadie puede ser detenido arbitrariamente. Toda persona detenida debe ser llevada sin demora ante un juez u otro funcionario autorizado. Derecho a ser oída con debidas garantías, en plazo razonable y por juez independiente e imparcial.","CADH, arts. 7 y 8"),
   Cn("Comisión y Corte","La Comisión Interamericana se compone de siete miembros. La Corte, de siete jueces elegidos por seis años, con una sola reelección.","CADH, arts. 34, 52 y 54"),
   Cn("Acceso al sistema","Para que la Comisión admita una petición se deben agotar los recursos internos y presentarla dentro de seis meses desde la decisión definitiva. Solo los Estados partes y la Comisión pueden llevar un caso a la Corte.","CADH, arts. 46 y 61"),
   Cn("Sentencias y suspensión de garantías","Los Estados se comprometen a cumplir la decisión de la Corte en los casos en que son parte. En guerra o emergencia solo se suspenden garantías en la medida y el tiempo estrictamente necesarios.","CADH, arts. 27 y 68")],
  qs:[
   Qn(S3,"¿Quiénes pueden someter un caso a la decisión de la Corte Interamericana?","Los Estados partes y la Comisión",["Cualquier persona directamente","Solo el Estado denunciante"],"Antes deben agotarse los procedimientos ante la Comisión.","CADH, art. 61"),
   Qn(S3,"¿Cuántos jueces componen la Corte Interamericana de Derechos Humanos?","Siete",["Cinco","Nueve"],"Son elegidos por seis años y pueden reelegirse una vez.","CADH, arts. 52 y 54"),
   Qn(S3,"Para que la Comisión admita una petición se requiere, entre otras cosas…","haber agotado los recursos de jurisdicción interna",["que un Estado la respalde","pagar una fianza"],"También debe presentarse dentro de seis meses de la decisión definitiva.","CADH, art. 46"),

   Cn("Informe justificado","La responsable lo rinde en quince días, ampliables diez más. Entre su notificación al quejoso y la audiencia constitucional deben mediar al menos ocho días.","LAmp, art. 117"),
   Cn("Recurso de revisión","Diez días. En amparo indirecto procede, entre otros casos, contra la suspensión definitiva y contra las sentencias de la audiencia constitucional.","LAmp, arts. 81 y 86"),
   Cn("Queja y reclamación","Queja: cinco días (dos días hábiles si es suspensión de plano o provisional; en cualquier tiempo si se omite tramitar la demanda). Reclamación: tres días contra acuerdos de trámite del presidente de la Corte o de un tribunal colegiado.","LAmp, arts. 98 y 104"),
   Cn("Desistimiento","Procede el sobreseimiento si la persona quejosa desiste. Se le notifica para que ratifique su escrito en tres días.","LAmp, art. 63")],
  qs:[
   Qn(D1,"Un empresario es notificado de una resolución administrativa que considera violatoria de sus derechos. ¿De cuántos días dispone, en general, para presentar la demanda de amparo?","Quince días",["Treinta días","Ocho años"],"Los plazos mayores son excepciones expresas.","LAmp, art. 17"),
   Qn(D1,"Una persona condenada a prisión quiere promover amparo contra la sentencia definitiva condenatoria. ¿Cuál es el plazo máximo?","Hasta ocho años",["Quince días","Treinta días"],"Es una excepción prevista para sentencias condenatorias de prisión.","LAmp, art. 17"),
   Qn(D1,"Un ejido fue privado de parte de sus tierras por un acto de autoridad que se le notificó indubitablemente hace cinco años. ¿Aún puede promover amparo?","Sí, tiene siete años contados desde la notificación",["No, el plazo es de quince días","No, el plazo es de treinta días"],"Los núcleos de población ejidal o comunal tienen un plazo especial de siete años.","LAmp, art. 17"),
   Qn(D1,"¿En qué plazo se interpone el recurso de revisión en amparo?","Diez días",["Cinco días","Tres días"],"La queja es de cinco días y la reclamación de tres.","LAmp, art. 86")]},

 {t:"Amparo: vías y suspensión", ley:"Ley de Amparo",
  cards:[
   Cn("Amparo indirecto","Procede contra normas generales que causen perjuicio con su entrada en vigor o con su primer acto de aplicación, y contra actos u omisiones de autoridades distintas de tribunales judiciales, administrativos o del trabajo, entre otros supuestos.","LAmp, art. 107"),
   Cn("Normas generales","Incluyen leyes federales y locales, reglamentos federales y locales, constituciones de los Estados, y decretos, acuerdos y resoluciones de observancia general. También tratados, salvo sus disposiciones que reconocen derechos humanos.","LAmp, art. 107, fracc. I"),
   Cn("Amparo directo","Procede contra sentencias definitivas, laudos y resoluciones que ponen fin al juicio dictadas por tribunales judiciales, administrativos, agrarios o del trabajo. Antes deben agotarse los recursos ordinarios.","LAmp, art. 170"),
   Cn("Suspensión de oficio y de plano","Se concede en el auto de admisión ante peligro de privación de la vida, ataques a la libertad fuera de procedimiento, incomunicación, deportación, destierro, desaparición forzada, actos prohibidos por el artículo 22 constitucional, incorporación forzosa al ejército y privación de derechos agrarios a ejidos o comunidades.","LAmp, art. 126"),
   Cn("Suspensión a petición de parte","En los demás casos se tramita a solicitud de la persona quejosa. El juez analiza la apariencia del buen derecho y el interés social, y se requiere que exista el acto reclamado o sea inminente.","LAmp, art. 128")],
  qs:[
   Qn(D1,"Una empresa quiere impugnar un decreto de observancia general que, desde su entrada en vigor, afecta su actividad. ¿Qué vía procede?","Amparo indirecto contra normas generales",["Amparo directo","Recurso de queja"],"Los decretos de observancia general son normas generales.","LAmp, art. 107"),
   Qn(D1,"Un trabajador perdió un juicio laboral y el tribunal dictó el laudo definitivo. Ya agotó los recursos ordinarios. ¿Qué vía procede contra el laudo?","Amparo directo",["Amparo indirecto","Recurso de reclamación"],"El directo procede contra laudos que ponen fin al juicio.","LAmp, art. 170"),
   Qn(D1,"Una persona es detenida, trasladada a un lugar desconocido y permanece incomunicada. Su familia promueve amparo. ¿Cómo se concede la suspensión?","De oficio y de plano, en el auto de admisión",["Solo si el quejoso otorga garantía","Hasta la audiencia constitucional"],"La incomunicación y los ataques a la libertad fuera de procedimiento son casos de suspensión de oficio.","LAmp, art. 126"),
   Qn(D1,"Seleccione la resolución contra la que procede el recurso de revisión en amparo indirecto.","La que concede o niega la suspensión definitiva",["El acuerdo de trámite de un presidente de tribunal colegiado","La omisión de tramitar la demanda"],"Los acuerdos de trámite se combaten con reclamación y la omisión de tramitar, con queja.","LAmp, art. 81")]},

 {t:"Controversias constitucionales y acciones de inconstitucionalidad", ley:"Ley Reglamentaria de las fracciones I y II del artículo 105",
  cards:[
   Cn("Qué resuelve la Corte","Las controversias constitucionales y las acciones de inconstitucionalidad de las fracciones I y II del artículo 105 constitucional.","L105, art. 1"),
   Cn("Partes en la controversia","Actor: quien la promueve. Demandado: quien emitió y promulgó la norma o realizó el acto u omisión. Terceros interesados: los entes del artículo 105, fracc. I, que puedan resultar afectados. Además, la persona titular de la Fiscalía General de la República.","L105, art. 10"),
   Cn("Plazos de la controversia","Treinta días para actos u omisiones. Treinta días para normas generales, desde su publicación o su primer acto de aplicación. Sesenta días para ciertos conflictos de límites.","L105, art. 21"),
   Cn("Acción de inconstitucionalidad","Treinta días naturales desde la publicación de la ley o tratado. En materia electoral todos los días son hábiles. En los casos de los incisos a), b) y d), la demanda la firman al menos el 33 % de los integrantes del órgano legislativo.","L105, arts. 60 y 62"),
   Cn("Votación","Para declarar la invalidez de normas en acciones se requieren al menos seis votos; si no se alcanzan, se desestima y se archiva. En controversias, la resolución tiene efectos generales con al menos seis votos en los casos del artículo 42.","L105, arts. 42 y 72"),
   Cn("Efectos en el tiempo","Surten efectos desde la fecha que fije la Corte. La invalidez no es retroactiva, salvo en materia penal.","L105, art. 45")],
  qs:[
   Qn(D1,"Un municipio cree que una ley estatal invade su competencia y quiere impugnarla mediante controversia constitucional. La ley se publicó hace 20 días. ¿Está en tiempo?","Sí, tiene treinta días desde la publicación",["No, solo tiene quince días","Sí, tiene sesenta días"],"El plazo contra normas generales es de treinta días.","L105, art. 21"),
   Qn(D1,"El 30 % de los integrantes de un Congreso local quiere promover una acción de inconstitucionalidad contra una ley estatal recién publicada. ¿Cumple el requisito de firmas?","No, se requiere al menos el 33 %",["Sí, basta el 30 %","Sí, basta el 25 %"],"La demanda debe estar firmada por cuando menos el treinta y tres por ciento.","L105, art. 62"),
   Qn(D1,"En una acción de inconstitucionalidad, cinco de los nueve ministros votan por invalidar la norma. ¿Qué resuelve la Corte?","Desestima la acción y ordena archivar el asunto",["Declara la invalidez de la norma","Ordena repetir la votación en treinta días"],"La invalidez exige por lo menos seis votos.","L105, art. 72"),
   Qn(D1,"¿Quién participa como parte en las controversias constitucionales, además del actor, el demandado y los terceros interesados?","La persona titular de la Fiscalía General de la República",["El Consejero Jurídico del Ejecutivo","La Auditoría Superior de la Federación"],"Está en la fracción IV del artículo 10.","L105, art. 10")]},

 {t:"Medios de impugnación electoral", ley:"Ley General del Sistema de Medios de Impugnación en Materia Electoral",
  cards:[
   Cn("Objeto","Garantizar que los actos y resoluciones electorales se sujeten a constitucionalidad y legalidad, y la definitividad de los actos y etapas de los procesos electorales.","LGSMIME, art. 3"),
   Cn("Los medios","Recurso de revisión, recurso de apelación, juicio de inconformidad, recurso de reconsideración, juicio para la protección de los derechos político-electorales, juicio de revisión constitucional electoral y juicio para conflictos laborales entre el INE y sus servidores.","LGSMIME, art. 3"),
   Cn("Plazos","Regla general: cuatro días desde el día siguiente al conocimiento o notificación. En proceso electoral todos los días y horas son hábiles y los plazos corren de momento a momento; fuera de él, solo días hábiles.","LGSMIME, arts. 7 y 8"),
   Cn("Juicio de inconformidad","Solo en la etapa de resultados y declaraciones de validez, contra elecciones de Presidente, senadores y diputados. Lo promueven partidos y, por inelegibilidad, candidatos. La demanda se presenta en cuatro días tras los cómputos.","LGSMIME, arts. 49, 54 y 55"),
   Cn("Recurso de reconsideración","Solo contra sentencias de fondo de las Salas Regionales en los casos previstos. Se interpone en tres días desde la notificación.","LGSMIME, arts. 61 y 66"),
   Cn("Juicio ciudadano y revisión constitucional","Juicio para la protección de derechos político-electorales: violaciones al derecho de votar, ser votado, asociarse y afiliarse. Revisión constitucional electoral: actos definitivos y firmes de autoridades locales que violen la Constitución.","LGSMIME, arts. 79 y 86")],
  qs:[
   Qn(D1,"A una ciudadana su partido le niega sin justificación el registro como candidata, y ella alega violación a su derecho a ser votada. ¿Qué juicio procede?","El juicio para la protección de los derechos político-electorales",["El juicio de inconformidad","El recurso de revisión"],"Protege los derechos de votar, ser votado, asociación y afiliación.","LGSMIME, art. 79"),
   Qn(D1,"Un partido político quiere impugnar los resultados de la elección de diputados federales en un distrito. ¿Qué medio procede?","El juicio de inconformidad",["El recurso de apelación","El juicio de revisión constitucional electoral"],"Procede en la etapa de resultados y declaraciones de validez.","LGSMIME, art. 49"),
   Qn(D1,"Un tribunal electoral local dicta una resolución definitiva y firme que un partido considera violatoria de la Constitución en la organización de comicios locales. ¿Qué juicio puede promover?","El juicio de revisión constitucional electoral",["El recurso de revisión","El juicio de inconformidad"],"Procede contra actos definitivos y firmes de autoridades locales.","LGSMIME, art. 86"),
   Qn(D1,"¿En qué plazo general deben presentarse los medios de impugnación electorales?","Cuatro días desde que se conoce o se notifica el acto",["Diez días hábiles","Quince días naturales"],"Hay excepciones previstas en la propia ley.","LGSMIME, art. 8")]},

 {t:"Tribunal Federal de Justicia Administrativa", ley:"Ley Orgánica del Tribunal Federal de Justicia Administrativa",
  cards:[
   Cn("Naturaleza","Órgano jurisdiccional con autonomía para emitir sus fallos y jurisdicción plena. Forma parte del Sistema Nacional Anticorrupción.","LOTFJA, art. 1"),
   Cn("Juicios que conoce","Resoluciones fiscales que determinan obligaciones o niegan devoluciones, multas por infracciones a normas administrativas federales, pensiones civiles, licitaciones públicas, responsabilidad patrimonial del Estado, negativa ficta, entre otras.","LOTFJA, art. 3"),
   Cn("Responsabilidades administrativas","Conoce de faltas graves de servidores públicos y particulares promovidas por la Secretaría, los Órganos internos de control o la Auditoría Superior de la Federación, e impone sanciones e indemnizaciones.","LOTFJA, art. 4"),
   Cn("Sala Superior","Dieciséis magistrados: catorce con funciones jurisdiccionales (uno preside el Tribunal) y dos en la Junta de Gobierno y Administración. Funciona en Pleno General, Pleno Jurisdiccional y tres Secciones.","LOTFJA, art. 7"),
   Cn("Junta de Gobierno y Administración","Presidente del Tribunal, dos magistrados de Sala Superior y dos de Sala Regional, electos por el Pleno General por periodos escalonados de dos años, sin reelección inmediata.","LOTFJA, art. 22")],
  qs:[
   Qn(D1,"El SAT niega la devolución de un ingreso solicitada por una empresa. ¿Qué órgano conoce del juicio contra esa resolución?","El Tribunal Federal de Justicia Administrativa",["El Tribunal Electoral","La Suprema Corte de Justicia de la Nación"],"Las resoluciones que niegan devoluciones de ingresos fiscales son de su competencia.","LOTFJA, art. 3"),
   Qn(D1,"Un Órgano interno de control de una dependencia federal pide que se sancione a un servidor público por una falta grave. ¿Ante quién promueve?","El Tribunal Federal de Justicia Administrativa",["Un juzgado de distrito en materia penal","La Comisión Permanente"],"El Tribunal conoce de faltas graves promovidas por los Órganos internos de control.","LOTFJA, art. 4"),
   Qn(D1,"Un pensionado civil recibe una resolución que reduce su pensión, con cargo al erario federal. ¿Ante qué tribunal la impugna?","El Tribunal Federal de Justicia Administrativa",["Un tribunal laboral federal","La Junta de Conciliación"],"Las resoluciones en materia de pensiones civiles están en el artículo 3.","LOTFJA, art. 3"),
   Qn(D1,"¿Cuántas personas integran la Sala Superior del Tribunal Federal de Justicia Administrativa?","Dieciséis magistrados",["Nueve magistrados","Trece magistrados"],"Catorce ejercen funciones jurisdiccionales y dos forman parte de la Junta de Gobierno.","LOTFJA, art. 7")]},

 {t:"Trata de personas", ley:"Ley General para Prevenir, Sancionar y Erradicar los Delitos en Materia de Trata de Personas",
  cards:[
   Cn("Tipo básico","Captar, enganchar, transportar, transferir, retener, entregar, recibir o alojar personas con fines de explotación: de 5 a 15 años de prisión y de mil a veinte mil días multa.","Ley de Trata, art. 10"),
   Cn("Formas de explotación","Esclavitud, condición de siervo, prostitución ajena y otras formas de explotación sexual, explotación laboral, trabajos o servicios forzados, mendicidad forzosa y utilización de menores en actividades delictivas, entre otras.","Ley de Trata, art. 10"),
   Cn("Penas de algunas conductas","Esclavitud: 15 a 30 años. Condición de siervo: 5 a 10. Explotación laboral: 3 a 10. Trabajos forzados: 10 a 20. Mendicidad: 4 a 9. Beneficiarse de la explotación sexual: 15 a 30.","Ley de Trata, arts. 11, 12, 13, 21, 22 y 24"),
   Cn("Consentimiento de la víctima","No excluye la responsabilidad penal, cualquiera que sea su edad y la modalidad del delito.","Ley de Trata, art. 40"),
   Cn("Competencia federal","La Federación es competente, entre otros casos, cuando el delito se inicia, prepara o comete en el extranjero y produce efectos en México, o al revés, y cuando se aplican las reglas de la Ley Orgánica del Poder Judicial.","Ley de Trata, art. 5"),
   Cn("Publicidad e inmuebles","Contratar espacios para publicidad ilícita o dar en arrendamiento un inmueble sabiendo que se usará para estas conductas se castiga con 2 a 7 años de prisión.","Ley de Trata, arts. 32 y 34")],
  qs:[
   Qn(D1,"Una persona capta con engaños a otra en su pueblo, la traslada a la ciudad y la retiene para que trabaje sin pago, bajo amenazas. ¿Qué conducta básica se configura?","Trata de personas: captar, transportar y retener con fines de explotación",["Abuso de confianza","Fraude genérico"],"Se sanciona con 5 a 15 años, sin perjuicio de las penas por cada delito cometido.","Ley de Trata, art. 10"),
   Qn(D1,"Una mujer adulta ejerce la prostitución en un local controlado por quien se beneficia de ella mediante engaño y violencia. La defensa alega que ella consintió. ¿Qué efecto tiene ese consentimiento?","No excluye la responsabilidad penal",["Excluye el delito","Reduce la pena a la mitad"],"El consentimiento de la víctima no es causa excluyente en estos delitos.","Ley de Trata, art. 40"),
   Qn(D1,"Un propietario renta una bodega a una banda, sabiendo que se usará para mantener personas en explotación. ¿Qué pena enfrenta por ese acto?","De 2 a 7 años de prisión",["De 15 a 30 años de prisión","Ninguna, porque solo arrendó"],"Dar en arrendamiento un inmueble con ese conocimiento es una conducta sancionada.","Ley de Trata, art. 34"),
   Qn(D1,"¿Qué pena corresponde a quien tenga o mantenga a otra persona en esclavitud?","De 15 a 30 años de prisión",["De 5 a 15 años de prisión","De 3 a 10 años de prisión"],"Además, de mil a veinte mil días multa.","Ley de Trata, art. 11")]},

 {t:"Seguro Social: seguros y obligaciones del patrón", ley:"Ley del Seguro Social",
  cards:[
   Cn("Régimen obligatorio","Comprende cinco seguros: riesgos de trabajo; enfermedades y maternidad; invalidez y vida; retiro, cesantía en edad avanzada y vejez; y guarderías y prestaciones sociales.","LSS, art. 11"),
   Cn("Sujetos de aseguramiento","Personas con servicio remunerado, personal y subordinado (permanente o eventual), socios de cooperativas, personas que el Ejecutivo determine por decreto y personas trabajadoras del hogar.","LSS, art. 12"),
   Cn("Obligaciones del patrón","Registrarse e inscribir a sus trabajadores, comunicar altas, bajas y cambios de salario en plazos no mayores de cinco días hábiles, llevar registros (conservarlos cinco años), determinar y enterar cuotas y permitir inspecciones.","LSS, art. 15"),
   Cn("Cambio de salario","El patrón presenta el aviso de modificación del salario base de cotización en máximo cinco días hábiles, contados desde el día siguiente al cambio.","LSS, art. 34"),
   Cn("Quién queda amparado en enfermedad y maternidad","El asegurado, los pensionados, y la o el cónyuge o, a falta de ellos, la concubina o concubinario con cinco años de vida marital o con hijos, entre otros.","LSS, art. 84")],
  qs:[
   Qn(D3,"Una tienda contrata a una empleada nueva el lunes. ¿En qué plazo máximo debe inscribirla ante el IMSS?","Cinco días hábiles",["Treinta días naturales","Quince días hábiles"],"El plazo corre para altas, bajas y cambios de salario.","LSS, art. 15"),
   Qn(D3,"Una persona trabaja de manera subordinada como cocinera en un hogar. ¿Tiene derecho al régimen obligatorio?","Sí, las personas trabajadoras del hogar son sujetos de aseguramiento",["No, solo los trabajadores de empresas","Solo si un decreto presidencial lo autoriza en cada caso"],"Están expresamente listadas en el artículo 12.","LSS, art. 12"),
   Qn(D3,"El patrón de un taller aumenta el salario de un trabajador el día 10 del mes. ¿Cuánto tiempo tiene para avisar al Instituto?","Cinco días hábiles, contados desde el día siguiente al cambio",["Treinta días naturales","Hasta el fin de año"],"Es un aviso de modificación del salario base de cotización.","LSS, art. 34"),
   Qn(D3,"¿Cuál de estos NO es un seguro del régimen obligatorio?","Seguro de gastos médicos mayores",["Guarderías y prestaciones sociales","Invalidez y vida"],"Los cinco seguros están en el artículo 11.","LSS, art. 11")]},

 {t:"Seguro Social: prestaciones y controversias", ley:"Ley del Seguro Social",
  cards:[
   Cn("Riesgos de trabajo","Accidentes y enfermedades a que están expuestos los trabajadores en ejercicio o con motivo del trabajo. También es accidente de trabajo el que ocurre al trasladarse directamente del domicilio al lugar de trabajo o al revés.","LSS, arts. 41 y 42"),
   Cn("Enfermedad de trabajo","Estado patológico derivado de la acción continuada de una causa que tiene su origen en el trabajo. Siempre lo son las consignadas en la Ley Federal del Trabajo.","LSS, art. 43"),
   Cn("Enfermedad no profesional","Subsidio en dinero a partir del cuarto día de la incapacidad y hasta por cincuenta y dos semanas.","LSS, art. 96"),
   Cn("Maternidad","Subsidio del 100 % del último salario diario de cotización durante 42 días antes y 42 días después del parto.","LSS, art. 101"),
   Cn("Invalidez","El asegurado no puede procurarse, con un trabajo igual, una remuneración superior al 50 % de su remuneración habitual del último año, por enfermedad o accidente no profesionales. La declara el IMSS.","LSS, art. 119"),
   Cn("Controversias","Asegurados o beneficiarios contra el IMSS: tribunales federales en materia laboral. Patrones contra el IMSS: Tribunal Federal de Justicia Administrativa. Se puede recurrir en inconformidad, y lo no impugnado se entiende consentido.","LSS, arts. 294 y 295"),
   Cn("Prescripción","Las prestaciones en dinero (mensualidades de pensión, subsidios por enfermedad no profesional y maternidad, ayuda de funeral) prescriben en un año. Los subsidios por riesgo de trabajo, en dos.","LSS, art. 300")],
  qs:[
   Qn(D3,"Un trabajador sufre un accidente cuando se traslada directamente de su casa al trabajo. ¿Cómo se considera el accidente?","Accidente de trabajo",["Enfermedad no profesional","Invalidez"],"La ley incluye el trayecto directo entre el domicilio y el lugar de trabajo.","LSS, art. 42"),
   Qn(D3,"Una asegurada espera su parto dentro de 20 días. ¿Qué subsidio le corresponde y por cuánto tiempo?","El 100 % de su último salario de cotización, 42 días antes y 42 días después del parto",["El 60 % durante 30 días","El 100 % solo después del parto"],"Si el parto se retrasa, se pagan igualmente los 42 días posteriores.","LSS, art. 101"),
   Qn(D3,"Un patrón tiene un conflicto con el IMSS por una liquidación de cuotas. ¿Ante qué tribunal se tramita la controversia?","Tribunal Federal de Justicia Administrativa",["Tribunales federales en materia laboral","Suprema Corte de Justicia de la Nación"],"Las controversias entre patrones y el Instituto son de la justicia administrativa.","LSS, art. 295"),
   Qn(D3,"¿En cuánto prescribe el derecho a reclamar mensualidades de una pensión?","Un año",["Cinco años","Tres años"],"Es el plazo para prestaciones en dinero de los seguros del artículo 300.","LSS, art. 300")]},

 {t:"Infonavit", ley:"Ley del Instituto del Fondo Nacional de la Vivienda para los Trabajadores",
  cards:[
   Cn("Objeto","Administrar los recursos del Fondo Nacional de la Vivienda y operar un sistema de financiamiento para que las personas trabajadoras obtengan crédito para adquirir, construir, reparar, ampliar o mejorar su vivienda, pagar pasivos y adquirir suelo.","LIFNVT, art. 3"),
   Cn("Vivienda en arrendamiento","También coordina programas de vivienda y otorga en arrendamiento social los inmuebles que construya o recupere.","LIFNVT, art. 3"),
   Cn("Órganos","Asamblea General, Consejo de Administración, Comisión de Vigilancia, Comité de Auditoría, Dirección General, Comisión de Inconformidades, Comité de Transparencia y Comisiones Consultivas Regionales.","LIFNVT, art. 6"),
   Cn("Aportaciones patronales","5 % sobre el salario de los trabajadores, pagado para su subcuenta de vivienda. Los patrones deben inscribirse e inscribir a sus trabajadores y solicitarles su CURP.","LIFNVT, art. 29"),
   Cn("Seguro del crédito","Cubre incapacidad total permanente o muerte y libera a la persona trabajadora o a sus beneficiarios de obligaciones y gravámenes a favor del Instituto; su costo lo asume el Instituto. No libera si el crédito se obtuvo después de una pensión por incapacidad parcial permanente del 50 % o más, o invalidez definitiva.","LIFNVT, art. 51"),
   Cn("Inconformidad y controversias","El recurso de inconformidad se promueve ante el propio Instituto. Las controversias de derechos entre trabajadores y el Instituto se resuelven en tribunales federales en materia laboral, y agotar la inconformidad es optativo.","LIFNVT, arts. 52 y 53")],
  qs:[
   Qn(D3,"Una trabajadora con crédito Infonavit fallece. Sus hijos temen perder la vivienda por la deuda. ¿Qué protección aplica?","El seguro del crédito por muerte los libera de las obligaciones y gravámenes a favor del Instituto",["Deben pagar el saldo en treinta días","El Instituto adjudica la vivienda automáticamente"],"Su costo lo asume el propio Instituto.","LIFNVT, art. 51"),
   Qn(D3,"Una empresa contrata a un trabajador y calcula las aportaciones para vivienda. ¿Qué porcentaje del salario debe aportar al Infonavit?","5 %",["2 %","10 %"],"Se abona a la subcuenta de vivienda del trabajador.","LIFNVT, art. 29"),
   Qn(D3,"Un trabajador cree que el Instituto calculó mal su crédito. ¿Debe agotar forzosamente el recurso de inconformidad antes de acudir a tribunales laborales?","No, agotarlo es optativo",["Sí, en todos los casos","Solo si el crédito es de cierto monto"],"Puede acudir directamente a los tribunales federales en materia laboral.","LIFNVT, art. 53"),
   Qn(D3,"¿Cuál de estos es un órgano del Infonavit?","La Comisión de Inconformidades",["La Comisión Reguladora de Energía","La Junta de Gobierno y Administración"],"Los órganos están enumerados en el artículo 6.","LIFNVT, art. 6")]}
];

AREAS[1].sim = [

 {t:"Mecanismos alternativos de solución de controversias", ley:"Ley General de Mecanismos Alternativos de Solución de Controversias",
  cards:[
   Cn("Mecanismos","Negociación, negociación colaborativa (con abogadas colaborativas), mediación, conciliación y arbitraje. La lista es enunciativa y no limitativa.","LGMASC, art. 4"),
   Cn("Mediación y conciliación","Mediación: la persona facilitadora, tercera imparcial, asiste a las partes; con dos o más facilitadoras hay comediación. Conciliación: la persona facilitadora asiste y participa activamente.","LGMASC, art. 4"),
   Cn("Arbitraje","Las partes pactan un acuerdo o cláusula arbitral y una persona árbitra dicta un laudo conforme al Código de Comercio, el Código Nacional de Procedimientos Civiles y Familiares y los tratados.","LGMASC, art. 4"),
   Cn("Quién facilita y cuándo procede","Personas facilitadoras y abogadas colaborativas certificadas por los Poderes Judiciales o los Tribunales de Justicia Administrativa. Es admisible si no es contrario al orden jurídico ni al interés público ni versa sobre derechos indisponibles.","LGMASC, arts. 2 y 7"),
   Cn("Plazos del trámite","Fuera de un juicio, las sesiones no exceden tres meses, salvo ampliación acordada. Si no es admisible, se avisa al día hábil siguiente. Si deriva de un juicio, se avisa al juez en tres días hábiles para suspenderlo y se informa al día hábil siguiente de la conclusión.","LGMASC, arts. 64, 66 y 67"),
   Cn("Convenio","La persona facilitadora lo remite en diez días hábiles al Sistema de Convenios. Si no se subsana la prevención, se tiene por no presentado y no alcanza cosa juzgada. En justicia administrativa, tiene ese efecto tras la aprobación del Magistrado Instructor.","LGMASC, arts. 104, 105 y 137")],
  qs:[

   Qn(T1,"Un arrendador y su inquilino aceptan que una persona facilitadora imparcial los asista para llegar a un acuerdo. ¿Qué mecanismo usan?","Mediación",["Arbitraje","Negociación colaborativa"],"En la mediación una persona tercera imparcial asiste a las partes.","LGMASC, art. 4"),

   Qn(T1,"Un contrato de distribución dice que cualquier diferencia se someterá a un tercero que dictará un laudo. Surge la diferencia. ¿Qué mecanismo se activa?","Arbitraje",["Mediación","Conciliación"],"La cláusula arbitral somete la diferencia a una persona árbitra.","LGMASC, art. 4"),
   Qn(T1,"Las partes buscan una solución pacífica de su conflicto con la asesoría de abogadas colaborativas. ¿Qué mecanismo utilizan?","Negociación colaborativa",["Conciliación","Arbitraje"],"Se apoya en personas abogadas colaborativas.","LGMASC, art. 4"),
   Qn(T1,"Una persona quiere actuar como facilitadora en un centro privado de mecanismos. ¿Qué requisito prevé la ley?","Contar con certificación de los Poderes Judiciales o de los Tribunales de Justicia Administrativa",["Ser notaria pública","Tener cinco años de litigio"],"La certificación es el documento que autoriza su intervención.","LGMASC, arts. 2 y 5"),
   Qn(T1,"Una dependencia pública quiere resolver mediante un mecanismo alternativo una controversia sobre derechos indisponibles. ¿Es admisible?","No, no procede si versa sobre derechos indisponibles o es contrario al orden jurídico",["Sí, en todos los casos","Sí, con autorización presidencial"],"Tampoco procede si es contrario al interés público.","LGMASC, art. 7"),
   Qn(T1,"Una mediación fuera de juicio lleva tres meses de sesiones sin acuerdo. ¿Puede continuar?","Solo si las partes acuerdan ampliar el plazo",["Sí, sin límite de tiempo","No, debe cerrarse en todo caso"],"El plazo máximo ordinario es de tres meses.","LGMASC, art. 64"),
   Qn(T1,"Las partes de un juicio civil inician una mediación. ¿Qué debe hacer la persona facilitadora frente al juzgado?","Avisar dentro de tres días hábiles para que se suspenda el juicio",["Nada, el juicio sigue","Avisar dentro de treinta días naturales"],"Con ello se acuerda la suspensión del procedimiento.","LGMASC, art. 67"),
   Qn(T1,"Concluye una mediación derivada de un juicio. ¿Cuándo informa la persona facilitadora a la autoridad jurisdiccional?","Al día hábil siguiente de la conclusión",["En diez días hábiles","En un mes"],"Para que la autoridad emita la resolución que corresponda.","LGMASC, art. 67"),

   Qn(T1,"Firmado el convenio por las partes y la persona facilitadora, ¿en cuánto tiempo debe remitirse al Sistema de Convenios?","Diez días hábiles",["Tres días hábiles","Un mes"],"Es un plazo máximo para su inscripción.","LGMASC, art. 105"),

   Qn(T1,"Las partes de un juicio ante el Tribunal de Justicia Administrativa logran un convenio con una persona facilitadora. ¿Cuándo adquiere carácter de cosa juzgada?","Una vez aprobado por el Magistrado Instructor",["Al firmarse por las partes","Al publicarse en el Diario Oficial"],"El tribunal además lo publica en su boletín.","LGMASC, art. 137"),
   Qn(T1,"¿Cuál de estos NO es un mecanismo alternativo previsto en el artículo 4 de la ley?","El juicio de amparo",["La mediación","La conciliación"],"El amparo es un juicio jurisdiccional.","LGMASC, art. 4"),
   Qn(T1,"Seleccione el órgano que es máximo órgano colegiado, honorífico y rector en políticas públicas sobre mecanismos alternativos.","El Consejo Nacional de Mecanismos Alternativos",["El Consejo de la Judicatura","La Comisión Ejecutiva"],"Está definido en el artículo 9.","LGMASC, art. 9")]},

 {t:"Conciliación y arbitraje del consumidor", ley:"Ley Federal de Protección al Consumidor (texto de 2012)",
  cards:[
   Cn("Naturaleza de la Procuraduría","Organismo descentralizado de servicio social, con personalidad jurídica y patrimonio propios y funciones de autoridad administrativa.","LFPC, art. 20"),
   Cn("Consumidor y proveedor","Consumidor: persona física o moral que adquiere bienes o servicios como destinatario final. Si los integra a procesos de producción, solo ejerce las acciones de los artículos 99 y 117 si es microempresa o microindustria acreditada.","LFPC, art. 2"),
   Cn("La queja","Se presenta de forma individual o grupal, por escrito, oral, telefónica, electrónica u otro medio, con nombre y domicilio del reclamante, descripción del bien o servicio y hechos, y datos del proveedor.","LFPC, art. 99"),
   Cn("Audiencia de conciliación","Se celebra al menos cuatro días después de notificar la reclamación al proveedor y puede ser telefónica. El conciliador expone un resumen, presenta opciones sin prejuzgar y salvaguarda los derechos del consumidor.","LFPC, arts. 111 y 113"),
   Cn("Inasistencias","Si el proveedor no asiste ni rinde informe: medida de apremio y segunda audiencia en máximo 10 días; si vuelve a faltar, se tiene por presuntamente cierto lo dicho por el reclamante. Si el reclamante falta y no justifica en 10 días, se le tiene por desistido.","LFPC, art. 112"),
   Cn("Arbitraje","Sin conciliación, se exhorta a designar como árbitro a la Procuraduría o a uno independiente; si no se acepta, quedan a salvo los derechos. La Procuraduría puede arbitrar sin reclamación previa. La designación consta en acta, indicando si es en estricto derecho o amigable composición.","LFPC, arts. 116 a 118")],

   Qn(T1,"Una microempresa compra maquinaria para integrarla a su producción. ¿Puede ejercer como consumidora las acciones de los artículos 99 y 117?","Sí, si está acreditada como microempresa o microindustria",["No, nunca","Solo si compra al menudeo"],"La ley limita esa posibilidad a micro negocios acreditados.","LFPC, art. 2"),
