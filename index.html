AREAS[1].bloques = AREAS[1].bloques.concat([
 {t:"Ley Agraria: ejido y asamblea", ley:"Ley Agraria",
  cards:[
   Cn("Ejido y supletoriedad","La ley es reglamentaria del artículo 27 constitucional en materia agraria. En lo no previsto se aplica supletoriamente la legislación civil federal y, en su caso, la mercantil. Los ejidos tienen personalidad jurídica y patrimonio propio y son propietarios de las tierras dotadas o adquiridas.","Ley Agraria, arts. 1, 2 y 9"),
   Cn("Asamblea","Es el órgano supremo del ejido y en ella participan todos los ejidatarios. Se reúne al menos cada seis meses. Es de su competencia exclusiva formular el reglamento interno, aceptar y separar ejidatarios, elegir y remover al comisariado y al consejo de vigilancia, aprobar cuentas y contratos sobre tierras de uso común y distribuir ganancias.","Ley Agraria, arts. 22 y 23"),
   Cn("Comisariado y consejo de vigilancia","El comisariado ejecuta los acuerdos de la asamblea y representa al ejido; se integra con presidencia, secretaría y tesorería, con suplentes y paridad. El consejo de vigilancia vigila al comisariado, revisa sus cuentas, las denuncia ante la asamblea y convoca a asamblea cuando el comisariado no lo hace.","Ley Agraria, arts. 32 y 36"),
   Cn("Convocatoria y quórum","La convocatoria se fija en cédulas con no menos de ocho ni más de quince días de anticipación, y con un mes para los asuntos de las fracciones VII a XIV del artículo 23. En primera convocatoria se requiere la mitad más uno de los ejidatarios (tres cuartas partes para esos asuntos). En segunda convocatoria basta cualquier número, salvo esos asuntos, que requieren la mitad más uno.","Ley Agraria, arts. 25 y 26"),
   Cn("Posesión y enajenación","Quien posee tierras ejidales de forma pacífica, continua y pública durante cinco años de buena fe, o diez de mala fe, adquiere los derechos de ejidatario sobre la parcela. Los derechos parcelarios solo se enajenan a otros ejidatarios o avecindados del núcleo, con conformidad escrita ante dos testigos ratificada ante fedatario y notificación al cónyuge e hijos, que tienen el derecho del tanto.","Ley Agraria, arts. 48 y 80")],
  qs:[
   Qc(D3,"Un núcleo de población ejidal quiere celebrar un contrato con un tercero. ¿Tiene personalidad jurídica y patrimonio propio?","Sí, los ejidos tienen personalidad jurídica y patrimonio propio","No, actúan por el Estado","Solo si tienen escritura","Así lo dispone el artículo 9.","Ley Agraria, art. 9"),
   Qc(D3,"Un punto civil no está previsto en la Ley Agraria. ¿Qué se aplica supletoriamente?","La legislación civil federal y, en su caso, la mercantil","El Código Penal","La Ley Federal del Trabajo","Es la regla de supletoriedad.","Ley Agraria, art. 2"),
   Qc(D3,"Los ejidatarios quieren modificar el reglamento interno del ejido. ¿Quién puede hacerlo?","La asamblea, por ser de su competencia exclusiva","El comisariado ejidal","El consejo de vigilancia","La formulación y modificación del reglamento es competencia exclusiva de la asamblea.","Ley Agraria, art. 23"),
   Qc(D3,"La asamblea de un ejido no se ha reunido en ocho meses. ¿Se cumple la ley?","No, debe reunirse por lo menos una vez cada seis meses","Sí, basta una vez al año","Sí, si el comisariado lo decide","Es una obligación de periodicidad mínima.","Ley Agraria, art. 23"),
   Qc(D3,"El ejido quiere aprobar contratos con terceros sobre el uso de tierras de uso común. ¿Quién los aprueba?","La asamblea","El comisariado","El presidente municipal","Es competencia exclusiva de la asamblea.","Ley Agraria, art. 23"),
   Qc(D3,"Los ejidatarios quieren remover al comisariado ejidal. ¿Quién puede hacerlo?","La asamblea","El consejo de vigilancia","El tribunal agrario","La asamblea elige y remueve a sus miembros.","Ley Agraria, art. 23"),
   Qc(D3,"Se integra un comisariado ejidal. ¿Qué cargos lo componen?","Presidencia, secretaría y tesorería, con suplentes y en observancia de la paridad","Solo presidencia","Presidencia, vicepresidencia y dirección","Es la integración del artículo 32.","Ley Agraria, art. 32"),
   Qc(D3,"¿Qué órgano ejecuta los acuerdos de la asamblea y representa al ejido?","El comisariado ejidal","El consejo de vigilancia","La Procuraduría Agraria","Es su función principal.","Ley Agraria, art. 32"),
   Qc(D3,"El comisariado no convoca a asamblea. ¿Quién puede hacerlo?","El consejo de vigilancia","El tribunal agrario","El presidente municipal","Puede convocar cuando el comisariado no lo hace.","Ley Agraria, art. 36"),
   Qc(D3,"El consejo de vigilancia sospecha irregularidades en las cuentas del comisariado. ¿Qué debe hacer?","Revisar las cuentas y denunciar las irregularidades ante la asamblea","Sancionar al comisariado","Cerrar el ejido","Es una de sus facultades.","Ley Agraria, art. 36"),
   Qc(D3,"Se convoca a una asamblea ordinaria del ejido. ¿Con qué anticipación debe expedirse la convocatoria?","No menos de ocho ni más de quince días, por cédulas","Con tres días","Con cuarenta días","Se fijan cédulas en los lugares más visibles.","Ley Agraria, art. 25"),
   Qc(D3,"Se convoca a asamblea para tratar un asunto de las fracciones VII a XIV del artículo 23. ¿Con qué anticipación mínima?","Un mes","Ocho días","Tres días","Son asuntos que exigen mayor anticipación.","Ley Agraria, art. 25"),
   Qc(D3,"Una asamblea ordinaria se reúne en primera convocatoria. ¿Qué quórum requiere?","La mitad más uno de los ejidatarios","Una tercera parte","Cualquier número","Es el quórum de primera convocatoria.","Ley Agraria, art. 26"),
   Qc(D3,"Una asamblea en primera convocatoria trata un asunto de las fracciones VII a XIV. ¿Qué quórum requiere?","Tres cuartas partes de los ejidatarios","La mitad más uno","Una cuarta parte","Son asuntos que exigen quórum reforzado.","Ley Agraria, art. 26"),
   Qc(D3,"Una persona posee parcela ejidal de forma pacífica, continua y pública durante cinco años y de buena fe. ¿Qué adquiere?","Los mismos derechos que cualquier ejidatario sobre su parcela","Nada","Solo el uso temporal","Es la prescripción adquisitiva ejidal.","Ley Agraria, art. 48"),
   Qc(D3,"Un ejidatario quiere vender sus derechos parcelarios a una persona ajena al núcleo que no es avecindada. ¿Puede?","No, solo puede enajenarlos a otros ejidatarios o avecindados del mismo núcleo","Sí, a cualquiera","Sí, con aval del comisariado","Es la regla del artículo 80.","Ley Agraria, art. 80")]},

 {t:"Ley Agraria: juicio agrario", ley:"Ley Agraria",
  cards:[
   Cn("Juicios agrarios","Tienen por objeto resolver las controversias que se susciten por la aplicación de la ley. Los tribunales agrarios también conocen, en jurisdicción voluntaria, de asuntos no litigiosos que requieran intervención judicial.","Ley Agraria, arts. 163 y 165"),
   Cn("Usos y costumbres","Cuando una o ambas partes pertenezcan a pueblos o comunidades indígenas o afromexicanas, se consideran sus usos y costumbres mientras no contravengan la Constitución y la ley.","Ley Agraria, art. 164"),
   Cn("Demanda y audiencia","La demanda se presenta por escrito o por comparecencia, con apoyo de la Procuraduría Agraria. Se emplaza al demandado para contestar a más tardar en la audiencia, que se celebra entre cinco y diez días después del emplazamiento. Las pruebas que no puedan desahogarse en ella se desahogan en quince días.","Ley Agraria, art. 170"),
   Cn("Contestación y notificaciones","El demandado contesta a más tardar en la audiencia, por escrito o por comparecencia. Quien no comparezca es notificado en los estrados. Las partes señalan domicilio en la sede del tribunal o en las oficinas de la autoridad municipal.","Ley Agraria, arts. 178 y 185"),
   Cn("Sentencia","Se dicta a verdad sabida, sin sujetarse a reglas de estimación de pruebas, apreciando los hechos y documentos en conciencia y fundando y motivando la resolución.","Ley Agraria, art. 189"),
   Cn("Recurso de revisión","Procede contra sentencias de primera instancia sobre límites de tierras entre núcleos o con pequeños propietarios, restitución de tierras ejidales o nulidad de resoluciones de autoridades agrarias. Se presenta ante el tribunal que dictó la resolución en diez días, con un simple escrito de agravios.","Ley Agraria, arts. 198 y 199")],
  qs:[
   Qc(D3,"Surge una controversia por la aplicación de la Ley Agraria. ¿Qué tipo de juicio es?","Un juicio agrario","Un juicio civil","Un juicio mercantil","Los juicios agrarios resuelven esas controversias.","Ley Agraria, art. 163"),
   Qc(D3,"Una persona plantea un asunto agrario no litigioso que requiere intervención judicial. ¿En qué vía se tramita?","En jurisdicción voluntaria ante el tribunal agrario","En amparo","En juicio ordinario","Los tribunales agrarios conocen de asuntos no litigiosos.","Ley Agraria, art. 165"),
   Qc(D3,"Una comunidad indígena es parte en un juicio agrario. ¿Qué debe considerar el tribunal?","Sus usos y costumbres, mientras no contravengan la Constitución ni la ley","Solo la ley civil","Nada especial","Es una regla de protección.","Ley Agraria, art. 164"),
   Qc(D3,"Un campesino no sabe redactar su demanda agraria. ¿Cómo puede presentarla?","Por simple comparecencia, con la coadyuvancia de la Procuraduría Agraria","Solo con abogado particular","No puede presentarla","La ley permite la comparecencia.","Ley Agraria, art. 170"),
   Qc(D3,"Admitida la demanda agraria, ¿hasta cuándo debe comparecer el demandado a contestarla?","A más tardar en la audiencia","En treinta días","En tres días","Se le emplaza para esa audiencia.","Ley Agraria, art. 170"),
   Qc(D3,"Se emplaza al demandado en un juicio agrario. ¿Con qué plazo se fija la audiencia?","No menor de cinco ni mayor de diez días desde el emplazamiento","A los treinta días","Al día siguiente","Es el plazo del artículo 170.","Ley Agraria, art. 170"),
   Qc(D3,"En la audiencia agraria una prueba no puede desahogarse de inmediato. ¿Qué procede?","Se suspende la audiencia y la prueba se desahoga en un plazo de quince días","Se desecha la prueba","Se cierra el juicio","La ley permite diferir esa prueba.","Ley Agraria, art. 170"),
   Qc(D3,"El demandado quiere contestar sin redactar un escrito. ¿Puede?","Sí, por comparecencia, con apoyo de la Procuraduría Agraria","No, siempre por escrito","Solo con abogado","Puede hacerlo por escrito o comparecencia.","Ley Agraria, art. 178"),
   Qc(D3,"Una parte no se presenta a la audiencia ni señaló domicilio. ¿Cómo se le hacen las notificaciones?","En los estrados del tribunal","Por correo","Por teléfono","Las subsecuentes notificaciones se hacen por estrados.","Ley Agraria, art. 185"),
   Qc(D3,"Una parte comparece por primera vez ante un tribunal agrario. ¿Dónde debe señalar domicilio?","En la población sede del tribunal o en las oficinas de la autoridad municipal donde vive","En cualquier estado","No necesita señalarlo","Es un requisito de la primera diligencia o escrito.","Ley Agraria, art. 185"),
   Qc(D3,"Un tribunal agrario dicta sentencia. ¿Cómo debe apreciar las pruebas?","A verdad sabida, en conciencia, fundando y motivando","Con reglas estrictas de valoración","Solo con prueba documental","Así lo dispone el artículo 189.","Ley Agraria, art. 189"),
   Qc(D3,"Una sentencia de primera instancia resuelve un conflicto de límites entre dos núcleos ejidales. ¿Qué recurso procede?","La revisión","La apelación civil","La queja","Está en el artículo 198.","Ley Agraria, art. 198"),
   Qc(D3,"Se resuelve en primera instancia un juicio de restitución de tierras ejidales. ¿Qué recurso procede?","La revisión","El amparo directo","La queja","La restitución está en el artículo 198.","Ley Agraria, art. 198"),
   Qc(D3,"Un tribunal agrario resuelve la nulidad de una resolución emitida por una autoridad agraria. ¿Qué recurso procede?","La revisión","La reclamación","La aclaración","Es el supuesto de la fracción III.","Ley Agraria, art. 198"),
   Qc(D3,"Una parte quiere interponer la revisión agraria. ¿Ante quién y en cuántos días?","Ante el tribunal que dictó la resolución, dentro de diez días desde la notificación","Ante la Corte, en treinta días","Ante el Senado, en cinco días","Basta un escrito con agravios.","Ley Agraria, art. 199"),
   Qc(D3,"Un tribunal agrario resuelve en primera instancia una cuestión distinta de límites, restitución o nulidad de resoluciones. ¿Procede la revisión?","No, solo procede en los supuestos del artículo 198","Sí, siempre","Solo si el monto es alto","La revisión es de materia limitada.","Ley Agraria, art. 198")]},

 {t:"Ley Federal del Trabajo: relación y prestaciones", ley:"Ley Federal del Trabajo",
  cards:[
   Cn("Relación y contrato","Relación de trabajo: prestación de un trabajo personal subordinado mediante el pago de un salario, cualquiera que sea el acto que le dé origen. El contrato individual, cualquiera que sea su forma o denominación, produce los mismos efectos. Se presumen la relación y el contrato entre quien presta y quien recibe el trabajo.","LFT, arts. 20 y 21"),
   Cn("Condiciones por escrito","Deben constar por escrito cuando no existan contratos colectivos aplicables, en al menos dos ejemplares, uno para cada parte.","LFT, art. 24"),
   Cn("Jornada y descanso","Jornada diaria: ocho horas la diurna, siete la nocturna y siete y media la mixta. Por cada seis días de trabajo, al menos un día de descanso con salario íntegro.","LFT, arts. 61 y 69"),
   Cn("Vacaciones","Con más de un año de servicios, no menos de doce días laborables, con dos días más por cada año hasta llegar a veinte; desde el sexto año, dos días más por cada cinco años. La prima vacacional no es menor de 25 % sobre el salario de las vacaciones.","LFT, arts. 76 y 80"),
   Cn("Aguinaldo y utilidades","Aguinaldo: por lo menos quince días de salario, antes del 20 de diciembre; se paga proporcional a quien no cumplió el año. Las personas trabajadoras participan en las utilidades según el porcentaje que determine la Comisión Nacional para la Participación de los Trabajadores en las Utilidades.","LFT, arts. 87 y 117")],
  qs:[
   Qc(D3,"Una persona presta a otra un trabajo personal subordinado a cambio de un salario. ¿Qué existe entre ellas?","Una relación de trabajo","Un contrato mercantil","Una sociedad","Es la definición del artículo 20.","LFT, art. 20"),
   Qc(D3,"No existe contrato escrito, pero una persona presta trabajo y recibe pago de otra. ¿Se presume la relación de trabajo?","Sí, se presumen la existencia del contrato y de la relación de trabajo","No, sin contrato no hay relación","Solo si hay testigos","La presunción favorece a quien presta el trabajo.","LFT, art. 21"),
   Qc(D3,"Una empresa contrata con un «convenio de honorarios» a una persona que trabaja subordinada y recibe salario. ¿Qué es en realidad?","Un contrato individual de trabajo, cualquiera que sea su denominación","Un contrato de servicios civiles","Una sociedad","La ley atiende a la sustancia, no al nombre.","LFT, art. 20"),
   Qc(D3,"No existen contratos colectivos aplicables. ¿Cómo deben constar las condiciones de trabajo y cuántos ejemplares?","Por escrito, en al menos dos ejemplares","De forma verbal","En un solo ejemplar","Cada parte conserva uno.","LFT, art. 24"),
   Qc(D3,"Una persona trabaja en turno diurno. ¿Cuántas horas dura su jornada máxima diaria?","Ocho horas","Siete horas","Diez horas","Es la jornada diurna.","LFT, art. 61"),
   Qc(D3,"Una persona trabaja en turno nocturno. ¿Cuántas horas dura su jornada máxima diaria?","Siete horas","Ocho horas","Seis horas","Es la jornada nocturna.","LFT, art. 61"),
   Qc(D3,"Una persona trabaja en turno mixto. ¿Cuántas horas dura su jornada máxima diaria?","Siete horas y media","Siete horas","Ocho horas","Es la jornada mixta.","LFT, art. 61"),
   Qc(D3,"Un trabajador labora seis días seguidos. ¿Qué descanso le corresponde como mínimo?","Un día de descanso con goce de salario íntegro","Medio día sin goce","Ninguno","Por cada seis días se otorga al menos uno.","LFT, art. 69"),
   Qc(D3,"Una persona cumple un año de servicios. ¿Cuántos días de vacaciones pagadas le corresponden como mínimo?","Doce días laborables","Seis días","Diez días naturales","Es el mínimo del artículo 76.","LFT, art. 76"),
   Qc(D3,"Una persona cumple dos años de servicios. ¿Cuántos días de vacaciones le corresponden como mínimo?","Catorce días laborables","Doce","Dieciséis","Aumenta en dos días por cada año subsecuente.","LFT, art. 76"),
   Qc(D3,"Una persona cumple tres años de servicios. ¿Cuántos días de vacaciones le corresponden como mínimo?","Dieciséis días laborables","Catorce","Doce","Aumentan dos días por año.","LFT, art. 76"),
   Qc(D3,"Un trabajador sale de vacaciones. ¿Qué prima mínima tiene derecho a recibir?","Veinticinco por ciento sobre los salarios del periodo","Diez por ciento","Cincuenta por ciento","Es la prima vacacional.","LFT, art. 80"),
   Qc(D3,"Un trabajador quiere saber cuánto aguinaldo le corresponde al año, como mínimo.","Quince días de salario","Diez días","Treinta días","Es el mínimo legal.","LFT, art. 87"),
   Qc(D3,"Una persona trabajó seis meses y su patrón no le pagó aguinaldo. ¿Tiene derecho a alguno?","Sí, a la parte proporcional al tiempo trabajado","No, exige un año completo","Solo si sigue laborando","Se paga proporcional aunque no haya cumplido el año.","LFT, art. 87"),
   Qc(D3,"Una empresa debe repartir utilidades a sus personas trabajadoras. ¿Quién determina el porcentaje?","La Comisión Nacional para la Participación de los Trabajadores en las Utilidades de las Empresas","La empresa","La Secretaría de Hacienda","Así lo dispone el artículo 117.","LFT, art. 117")]},

 {t:"Ley Federal del Trabajo: despido, prescripción y conciliación", ley:"Ley Federal del Trabajo",
  cards:[
   Cn("Despido injustificado","La persona trabajadora puede solicitar ante la Autoridad Conciliadora, o ante el Tribunal si no hay arreglo, la reinstalación o una indemnización de tres meses de salario.","LFT, art. 48"),
   Cn("Indemnizaciones","Tiempo indeterminado: veinte días de salario por año de servicios. Tiempo determinado menor de un año: salarios de la mitad del tiempo servido; mayor de un año: seis meses por el primer año y veinte días por cada año siguiente. Además, tres meses de salario y salarios vencidos con intereses.","LFT, art. 50"),
   Cn("Prescripción","Las acciones de trabajo prescriben en un año. En un mes: las acciones de los patrones para despedir, disciplinar y hacer descuentos, y las de los trabajadores para separarse. En dos meses: las acciones de los trabajadores separados del trabajo, a partir del día siguiente a la separación.","LFT, arts. 516, 517 y 518"),
   Cn("Suspensión del plazo","El plazo de dos meses se suspende desde la presentación de la solicitud de conciliación.","LFT, art. 518"),
   Cn("Conciliación previa","Antes de acudir a tribunales, trabajadores y patrones deben acudir al Centro de Conciliación, salvo las excepciones de la ley. La solicitud se presenta ante el Centro Federal de Conciliación y Registro Laboral o el local, por comparecencia, escrito firmado o vía electrónica; las empresas y sindicatos la firman por su representante legal.","LFT, arts. 684-B y 684-E")],
  qs:[
   Qc(D3,"Un trabajador es despedido sin causa justificada. ¿Qué puede solicitar?","La reinstalación o una indemnización de tres meses de salario","Solo una disculpa","Solo el finiquito","Es el derecho del artículo 48.","LFT, art. 48"),
   Qc(D3,"Un trabajador despedido injustificadamente quiere reclamar. ¿Ante quién debe acudir primero?","Ante la Autoridad Conciliadora; si no hay arreglo, ante el Tribunal","Directamente ante el Tribunal","Ante el Senado","Debe agotar la conciliación.","LFT, art. 48"),
   Qc(D3,"Un trabajador con contrato por tiempo indeterminado y cinco años de servicios es despedido. ¿Qué indemnización por antigüedad corresponde?","Veinte días de salario por cada año, es decir, cien días","Doce días por año","Tres meses únicamente","Además le corresponden tres meses y salarios vencidos.","LFT, art. 50"),
   Qc(D3,"Una relación por tiempo determinado de seis meses termina por despido injustificado. ¿Qué indemnización corresponde por el tiempo servido?","El importe de los salarios de la mitad del tiempo de servicios","Seis meses","Veinte días por año","Para menos de un año se paga la mitad del tiempo servido.","LFT, art. 50"),
   Qc(D3,"Una relación por tiempo determinado de tres años termina por despido injustificado. ¿Cómo se calcula la indemnización?","Seis meses por el primer año y veinte días por cada año siguiente","Solo tres meses","Veinte días por año desde el primero","Es la regla para relaciones mayores de un año.","LFT, art. 50"),
   Qc(D3,"Además de la indemnización por antigüedad, ¿qué otros conceptos se pagan tras un despido injustificado?","Tres meses de salario y los salarios vencidos con intereses","Nada más","Solo aguinaldo","Están en la fracción III.","LFT, art. 50"),
   Qc(D3,"Un trabajador reclama diferencias de salario que se debían hace un año y medio. ¿Procede?","No, las acciones de trabajo prescriben en un año","Sí, prescriben en cinco años","Sí, no prescriben","Es la regla general de prescripción.","LFT, art. 516"),
   Qc(D3,"Un patrón conoció una falta grave de un trabajador hace dos meses y ahora quiere despedirlo. ¿Puede?","No, su acción para despedir prescribió en un mes","Sí, prescribe en un año","Sí, sin límite","Prescriben en un mes desde que conoció la falta.","LFT, art. 517"),
   Qc(D3,"Un trabajador fue separado del trabajo. ¿En cuánto tiempo prescriben sus acciones?","En dos meses","En un año","En un mes","Es la regla para trabajadores separados.","LFT, art. 518"),
   Qc(D3,"La prescripción de dos meses de un trabajador separado corre. ¿Desde cuándo?","Desde el día siguiente a la fecha de la separación","Desde que consulta a un abogado","Desde el fin del año","Así lo dispone el artículo 518.","LFT, art. 518"),
   Qc(D3,"Un trabajador presenta su solicitud de conciliación. ¿Qué efecto tiene sobre el plazo de prescripción de dos meses?","Se suspende desde la fecha de presentación","Se interrumpe y reinicia completo","No tiene efecto","Se reanuda cuando se actualiza el supuesto legal.","LFT, art. 518"),
   Qc(D3,"Un trabajador quiere demandar directamente ante el Tribunal sin acudir al Centro de Conciliación. ¿Puede como regla general?","No, debe acudir antes al Centro de Conciliación, salvo las excepciones de la ley","Sí, siempre","Solo si el patrón lo acepta","La conciliación previa es obligatoria.","LFT, art. 684-B"),
   Qc(D3,"Un trabajador quiere iniciar el procedimiento de conciliación. ¿Ante quién presenta la solicitud?","Ante el Centro Federal de Conciliación y Registro Laboral o el Centro de Conciliación local","Ante la Corte","Ante el Senado","Depende de la competencia.","LFT, art. 684-E"),
   Qc(D3,"Una persona no puede acudir a la oficina del Centro de Conciliación. ¿Cómo puede presentar su solicitud?","Por comparecencia, por escrito firmado o por vía electrónica","Solo en persona","Solo por teléfono","La ley admite esos medios.","LFT, art. 684-E"),
   Qc(D3,"Una empresa quiere solicitar conciliación. ¿Quién firma la solicitud?","Su representante legal","Cualquier empleado","El contador","Lo exige el artículo 684-E.","LFT, art. 684-E"),
   Qc(D3,"¿En cuánto tiempo prescriben, en general, las acciones de trabajo?","En un año contado desde el día siguiente a que la obligación sea exigible","En cinco años","En un mes","Es la regla general, con excepciones.","LFT, art. 516")]},

 {t:"Juicio contencioso administrativo federal", ley:"Ley Federal de Procedimiento Contencioso Administrativo",
  cards:[
   Cn("Objeto y supletoriedad","Los juicios ante el Tribunal Federal de Justicia Administrativa se rigen por esta ley. A falta de disposición expresa se aplica supletoriamente el Código Nacional de Procedimientos Civiles y Familiares.","LFPCA, art. 1"),
   Cn("Procedencia","Procede contra las resoluciones administrativas definitivas que señala la ley orgánica del Tribunal y contra decretos y acuerdos de carácter general, distintos de reglamentos, cuando sean autoaplicativos o se impugnen con su primer acto de aplicación. La autoridad puede controvertir una resolución favorable al particular que estime contraria a la ley.","LFPCA, art. 2"),
   Cn("Partes","Demandante; y como demandadas, la autoridad que dictó la resolución impugnada y el particular a quien favorezca la resolución cuya nulidad pida la autoridad.","LFPCA, art. 3"),
   Cn("Plazos","Demanda: treinta días desde que surta efectos la notificación. Cuando la autoridad demanda la nulidad de una resolución favorable: cinco años. Contestación: treinta días. Ampliación de demanda: diez días. Contestación a la ampliación: diez días.","LFPCA, arts. 13, 17 y 19"),
   Cn("Falta de contestación y sentencia","Si no se contesta en tiempo y forma, se tienen por ciertos los hechos que la parte actora impute de manera precisa, salvo prueba en contrario. La sentencia se dicta en cuarenta y cinco días desde el cierre de instrucción y el proyecto se formula en treinta.","LFPCA, arts. 19 y 49"),
   Cn("Ilegalidad y vía sumaria","Es ilegal la resolución por incompetencia, omisión de requisitos formales (incluida la falta de fundamentación o motivación) que afecte defensas, vicios de procedimiento, hechos distintos o violación de disposiciones, o desvío de poder. La vía sumaria procede cuando el importe no excede de treinta veces la UMA elevada al año.","LFPCA, arts. 51 y 58-2")],
  qs:[
   Qc(D1,"Una empresa impugna una resolución definitiva ante el Tribunal Federal de Justicia Administrativa. ¿Qué ley regula el juicio?","La Ley Federal de Procedimiento Contencioso Administrativo","La Ley de Amparo","El Código Penal Federal","Regula los juicios ante el Tribunal.","LFPCA, art. 1"),
   Qc(D1,"La ley no prevé una regla procesal en un juicio contencioso administrativo federal. ¿Qué ordenamiento se aplica supletoriamente?","El Código Nacional de Procedimientos Civiles y Familiares","La Ley Federal del Trabajo","El Código de Comercio","Es la supletoriedad prevista.","LFPCA, art. 1"),
   Qc(D1,"Un decreto administrativo de carácter general afecta a un particular desde su entrada en vigor. ¿Procede el juicio?","Sí, cuando el decreto es autoaplicativo","No, nunca","Solo si lo firma el Presidente","Procede contra decretos autoaplicativos.","LFPCA, art. 2"),
   Qc(D1,"Un acuerdo de carácter general no es autoaplicativo. ¿Cuándo puede impugnarse?","En unión del primer acto de aplicación","Nunca","Al publicarse","Es la otra vía del artículo 2.","LFPCA, art. 2"),
   Qc(D1,"Una autoridad federal considera ilegal una resolución que favorece a un particular. ¿Puede controvertirla?","Sí, la autoridad tiene acción para hacerlo","No, las resoluciones favorables son definitivas","Solo con permiso del Senado","Es el llamado juicio de lesividad.","LFPCA, art. 2"),
   Qc(D1,"La autoridad demanda la nulidad de una resolución favorable a un particular. ¿Quién tiene carácter de demandado?","El particular a quien favorezca la resolución","La propia autoridad","El Congreso","Así lo dispone el artículo 3.","LFPCA, art. 3"),
   Qc(D1,"Se notificó una resolución impugnable y surtió efectos hoy. ¿En cuántos días debe presentarse la demanda?","Treinta días","Quince días","Cinco años","Se cuentan desde que surte efectos.","LFPCA, art. 13"),
   Qc(D1,"Una autoridad quiere demandar la nulidad de una resolución favorable a un particular. ¿En qué plazo?","Cinco años contados desde que se emitió","Treinta días","Un año","Es el plazo para la lesividad.","LFPCA, art. 13"),
   Qc(D1,"Admitida la demanda, se emplaza a la autoridad demandada. ¿En cuántos días debe contestarla?","Treinta días desde que surta efectos el emplazamiento","Diez días","Sesenta días","Es el plazo del artículo 19.","LFPCA, art. 19"),
   Qc(D1,"Ya se admitió la contestación de la demanda y el actor quiere ampliarla. ¿En cuántos días puede hacerlo?","Diez días","Treinta días","Cinco años","Es el plazo del artículo 17.","LFPCA, art. 17"),
   Qc(D1,"Se impugna una negativa ficta. ¿Procede ampliar la demanda?","Sí, es uno de los supuestos de ampliación","No","Solo con autorización del tribunal superior","Está en la fracción I del artículo 17.","LFPCA, art. 17"),
   Qc(D1,"La autoridad demandada no contesta en tiempo. ¿Qué se tiene por cierto?","Los hechos que la parte actora impute de manera precisa, salvo prueba en contrario","Todo lo que diga la actora","Nada","Es la consecuencia de no contestar.","LFPCA, art. 19"),
   Qc(D1,"Cerrada la instrucción, ¿en cuántos días debe pronunciarse la sentencia?","En cuarenta y cinco días","En diez días","En un año","El proyecto se formula en treinta.","LFPCA, art. 49"),
   Qc(D1,"Una resolución fue dictada por un servidor incompetente. ¿Qué se declara?","Que es ilegal por incompetencia","Que es válida","Que es inexistente","Es la causal de la fracción I.","LFPCA, art. 51"),
   Qc(D1,"Una resolución carece de fundamentación y motivación y esto afecta las defensas del particular. ¿Qué causal se actualiza?","Omisión de requisitos formales, incluida la falta de fundamentación o motivación","Incompetencia","Desvío de poder","Es la causal de la fracción II.","LFPCA, art. 51"),
   Qc(D1,"Se impugna una multa por infracción a normas administrativas federales cuyo importe no excede de treinta veces la UMA elevada al año. ¿Qué vía procede?","La vía sumaria","El amparo directo","Un juicio oral","Está en el artículo 58-2.","LFPCA, art. 58-2")]},

 {t:"Proceso civil y familiar: principios y arrendamiento", ley:"Código Nacional de Procedimientos Civiles y Familiares",
  cards:[
   Cn("Principios","Se pondera en todo tiempo la solución de la controversia sobre los formalismos procesales, se aplican las reglas y principios del juicio oral en lo compatible, se consideran los beneficios de la justicia alternativa y el procedimiento puede tramitarse con tecnologías de la información. Las autoridades actúan con perspectiva de género.","CNPCyF, art. 3"),
   Cn("Dirección procesal","Las autoridades jurisdiccionales tienen amplias facultades de dirección procesal, pueden usar medidas de apremio para hacer cumplir sus determinaciones y deben cerciorarse de que las partes estén debidamente representadas.","CNPCyF, art. 4"),
   Cn("Vulnerabilidad","Sin alterar la igualdad procesal, las partes pueden revelar su condición de vulnerabilidad para que se provean ajustes de procedimiento y se supla de oficio la deficiencia de sus planteamientos. Si se involucran derechos de niñas, niños y adolescentes o de mujeres, se resuelve con base en el interés superior y la perspectiva de género.","CNPCyF, art. 5"),
   Cn("Arrendamiento inmobiliario","El capítulo aplica al arrendamiento inmobiliario y a acciones contra quien otorgó fianza civil. La demanda se acompaña del contrato si es escrito. Emplazada la parte demandada, contesta y reconviene en quince días; la contestación a la reconvención, también en quince días. Las pruebas se ofrecen en la demanda, contestación y reconvención.","CNPCyF, arts. 520 a 522"),
   Cn("Audiencia y rentas","Las partes preparan sus pruebas. En la audiencia de juicio se abre una etapa de conciliación y mediación, luego alegatos, pruebas y sentencia explicada, con copia escrita en máximo dos días. Si se demandan rentas atrasadas de dos o más meses, se puede pedir que la parte demandada acredite estar al corriente o se embarguen bienes. El domicilio legal de la parte ejecutada es el inmueble arrendado.","CNPCyF, arts. 523 a 526")],
  qs:[
   Qc(D2,"Un juez privilegia resolver el fondo de la controversia sobre un formalismo procesal. ¿Qué principio aplica?","La solución de la controversia sobre los formalismos procesales","La preclusión estricta","El formalismo absoluto","Así lo dispone el artículo 3.","CNPCyF, art. 3"),
   Qc(D2,"Las partes pactan un procedimiento convencional de justicia alternativa. ¿La ley lo considera?","Sí, se consideran los beneficios de la justicia alternativa o procedimientos convencionales","No","Solo en materia familiar","Es un principio del artículo 3.","CNPCyF, art. 3"),
   Qc(D2,"Las partes piden tramitar el juicio con tecnologías de la información. ¿Es posible?","Sí, el procedimiento puede tramitarse con esas tecnologías","No","Solo con autorización de la Corte","La ley lo permite.","CNPCyF, art. 3"),
   Qc(D2,"Un juez resuelve un asunto familiar. ¿Con qué enfoque debe actuar en cuanto a igualdad de género?","Con perspectiva de género y respeto a los derechos humanos","Sin considerar el género","Solo si la parte lo pide","Es una obligación de las autoridades.","CNPCyF, art. 3"),
   Qc(D2,"Una parte incumple una determinación del juez. ¿Qué puede usar la autoridad?","Las medidas de apremio previstas en el código","La prisión inmediata","Nada","Tiene amplias facultades de dirección.","CNPCyF, art. 4"),
   Qc(D2,"Una persona comparece sin representante autorizado. ¿Qué debe verificar la autoridad?","Que las partes estén debidamente representadas","Nada","Solo el pago","Es una obligación del juzgador.","CNPCyF, art. 4"),
   Qc(D2,"Una persona con discapacidad revela su condición de vulnerabilidad en juicio. ¿Qué efecto tiene?","La autoridad provee ajustes de procedimiento y suple oportunamente las deficiencias de sus planteamientos","Ninguno","Se suspende el juicio","Así lo dispone el artículo 5.","CNPCyF, art. 5"),
   Qc(D2,"Un juicio involucra derechos de niñas, niños y adolescentes. ¿En qué debe basarse la resolución?","En el interés superior de la niñez","En la voluntad de los padres","En la costumbre","Es la regla del artículo 5.","CNPCyF, art. 5"),
   Qc(D2,"Se demanda a quien otorgó una fianza civil por una controversia derivada de un arrendamiento. ¿Qué reglas se aplican?","Las del capítulo de arrendamiento inmobiliario","Las del juicio penal","Las de amparo","El capítulo también se aplica a esas acciones.","CNPCyF, art. 520"),
   Qc(D2,"Se presenta una demanda de arrendamiento y el contrato se celebró por escrito. ¿Qué debe acompañarse?","El contrato de arrendamiento","Un aval bancario","Nada","Lo exige el artículo 521.","CNPCyF, art. 521"),
   Qc(D2,"Se emplaza a la parte demandada en un juicio de arrendamiento. ¿En cuántos días debe contestar y, en su caso, reconvenir?","Quince días","Tres días","Cuarenta días","Se cuentan desde el emplazamiento.","CNPCyF, art. 522"),
   Qc(D2,"Hay reconvención en un juicio de arrendamiento. ¿En cuántos días la contesta la parte actora?","Quince días","Cinco días","Treinta días","Se le corre traslado.","CNPCyF, art. 522"),
   Qc(D2,"En un juicio de arrendamiento, ¿en qué escritos deben ofrecer sus pruebas las partes?","En la demanda, contestación, reconvención y sus contestaciones","Solo en la sentencia","Solo en la audiencia","Deben ofrecerlas desde esos escritos.","CNPCyF, art. 521"),
   Qc(D2,"Se demandan rentas atrasadas de dos o más meses. ¿Qué puede solicitar la parte actora al emplazar?","Que la demandada acredite con recibos o consignaciones que está al corriente; si no, se embargan bienes","Que se cierre el juicio","Que se cancele el contrato","Es la regla del artículo 525.","CNPCyF, art. 525"),
   Qc(D2,"En estos juicios, ¿cuál es el domicilio legal de la parte ejecutada?","El inmueble motivo del arrendamiento","Su domicilio fiscal","El del juzgado","Así lo dispone el artículo 526.","CNPCyF, art. 526"),
   Qc(D2,"Inicia la audiencia de juicio de un caso de arrendamiento. ¿Qué se abre primero?","Una etapa de conciliación y mediación","Los alegatos finales","La sentencia","Si no hay convenio siguen los alegatos y las pruebas.","CNPCyF, art. 524")]}
]);

 {t:"Discriminación: el Consejo y la queja", ley:"Ley Federal para Prevenir y Eliminar la Discriminación",
  cards:[
   Cn("Objeto y prohibición","Prevenir y eliminar todas las formas de discriminación conforme al artículo 1 constitucional y promover la igualdad de oportunidades y de trato. Se prohíbe toda práctica discriminatoria que tenga por objeto o efecto impedir o anular el reconocimiento o ejercicio de derechos y la igualdad real de oportunidades.","LFPED, arts. 1 y 4"),
   Cn("Conductas discriminatorias","Entre otras: impedir el acceso o la permanencia a la educación y a becas; restringir el acceso, la permanencia y el ascenso en el empleo; establecer diferencias en remuneración, prestaciones y condiciones para trabajos iguales; y limitar el acceso a capacitación y formación profesional.","LFPED, art. 9"),
   Cn("El Consejo","Es un organismo descentralizado sectorizado a Gobernación, con personalidad jurídica y patrimonio propios y autonomía técnica y de gestión. Al resolver quejas no está subordinado a autoridad alguna. Su objeto: contribuir al desarrollo cultural, social y democrático, prevenir y eliminar la discriminación, promover políticas públicas de igualdad y coordinar las acciones del Ejecutivo Federal.","LFPED, arts. 16 y 17"),
   Cn("La queja","El Consejo conoce de quejas contra particulares, personas servidoras públicas federales y poderes públicos federales. Se admite dentro de un año desde que iniciaron los actos o se tuvo conocimiento, ampliable en casos graves. Puede presentarse por escrito con firma o huella; si es verbal, telefónica o electrónica, se ratifica en cinco días hábiles. No se admiten quejas anónimas. La admisión se resuelve en cinco días hábiles.","LFPED, arts. 43, 44, 49, 50 y 63 Quáter"),
   Cn("Conciliación","La audiencia se celebra en los quince días hábiles siguientes a la notificación a las partes. El convenio conciliatorio tiene autoridad de cosa juzgada y trae aparejada ejecución; se concluye el expediente sin recurso alguno y se da seguimiento hasta su cumplimiento. Si el caso es grave o hay riesgo de revictimizar, no se somete a conciliación.","LFPED, arts. 64, 65 y 70")],
  qs:[
   Qc(T3,"Una escuela impide a una estudiante permanecer en el plantel por su condición personal. ¿Qué conducta se configura?","Una práctica discriminatoria: impedir la permanencia en la educación","Una falta administrativa menor","Ninguna conducta sancionable","Está en el artículo 9.","LFPED, art. 9"),
   Qc(T3,"Una empresa paga menos a una trabajadora que a un compañero por el mismo trabajo. ¿Qué conducta se configura?","Discriminación por diferencias de remuneración en trabajos iguales","Una práctica de libre mercado","Una falta fiscal","Es conducta discriminatoria del artículo 9.","LFPED, art. 9"),
   Qc(T3,"Una empresa niega un ascenso a una persona por su origen étnico. ¿Qué conducta se configura?","Discriminación al restringir las oportunidades de ascenso en el empleo","Una sanción disciplinaria","Ninguna","Restringe acceso, permanencia y ascenso.","LFPED, art. 9"),
   Qc(T3,"Un centro de formación limita el acceso de una persona con discapacidad a sus programas de capacitación. ¿Qué conducta se configura?","Discriminación al limitar el acceso a la capacitación y formación profesional","Una medida de seguridad","Ninguna","Es una conducta del artículo 9.","LFPED, art. 9"),
   Qc(T3,"Una persona quiere presentar una queja por discriminación cometida por un particular. ¿Ante quién acude?","Ante el Consejo Nacional para Prevenir la Discriminación","Ante la Suprema Corte","Ante el INE","El Consejo conoce quejas contra particulares.","LFPED, art. 43"),
   Qc(T3,"Al resolver una queja, ¿el Consejo está subordinado a alguna autoridad?","No, adopta sus decisiones con plena independencia","Sí, a Gobernación","Sí, al Senado","Tiene independencia en el procedimiento de queja.","LFPED, art. 16"),
   Qc(T3,"Una persona presenta queja contra un servidor público federal por un acto discriminatorio. ¿Es competencia del Consejo?","Sí, conoce de quejas contra servidores públicos federales","No, solo contra particulares","Solo contra el Poder Judicial","Lo dispone el artículo 43.","LFPED, art. 43"),
   Qc(T3,"Una persona presenta una queja por hechos ocurridos hace catorce meses, sin que sean graves. ¿Se admite?","No, el plazo es de un año","Sí, siempre","Sí, en cualquier tiempo","Es el plazo general de admisión.","LFPED, art. 44"),
   Qc(T3,"Los hechos son discriminatorios graves y ocurrieron hace catorce meses. ¿Puede ampliarse el plazo?","Sí, mediante acuerdo fundado y motivado del Consejo","No, nunca","Solo con orden judicial","Se permite en casos excepcionales y graves.","LFPED, art. 44"),
   Qc(T3,"Una persona presenta su queja por teléfono. ¿Qué debe hacer después?","Ratificarla dentro de los cinco días hábiles siguientes","Nada","Presentarla de nuevo en un año","Si no la ratifica, se tiene por no presentada.","LFPED, art. 49"),
   Qc(T3,"Una queja es anónima. ¿La admite el Consejo?","No, no admite quejas anónimas","Sí, siempre","Sí, si es telefónica","Lo prohíbe el artículo 50.","LFPED, art. 50"),
   Qc(T3,"Una persona no da su nombre por temor a represalias. ¿Qué puede hacer el Consejo?","Registrar la queja manteniendo sus datos en estricta reserva","Rechazarla","Publicar sus datos","Se solicitan solo para ubicarla.","LFPED, art. 50"),
   Qc(T3,"Presentada una queja, ¿en cuántos días hábiles debe resolverse si se admite?","Cinco días hábiles","Treinta días hábiles","Un año","Es el plazo de admisión.","LFPED, art. 63 Quáter"),
   Qc(T3,"Admitida la queja, se cita a la audiencia de conciliación. ¿En qué plazo debe celebrarse?","En los quince días hábiles siguientes a la notificación","En un año","En tres días","Es el plazo del artículo 65.","LFPED, art. 65"),
   Qc(T3,"Las partes firman un convenio conciliatorio ante el Consejo. ¿Qué valor tiene?","Autoridad de cosa juzgada y trae aparejada ejecución","Solo valor moral","Requiere sentencia","No admite recurso alguno.","LFPED, art. 70"),
   Qc(T3,"La queja se refiere a un caso grave con riesgo de revictimizar a la persona agraviada. ¿Puede someterse a conciliación?","No, el asunto no podrá someterse a conciliación","Sí, siempre","Solo si la persona lo pide","Es una excepción del artículo 64.","LFPED, art. 64")]},

 {t:"Conciliación laboral prejudicial", ley:"Lineamientos para el procedimiento de conciliación prejudicial individual presencial",
  cards:[
   Cn("Objeto","Determinan las bases, criterios y condiciones que las personas conciliadoras deben observar y aplicar de manera obligatoria en el procedimiento de conciliación prejudicial individual presencial.","Lineamientos, numeral 1"),
   Cn("Audiencia","Debe celebrarse dentro de los quince días hábiles siguientes a la recepción o confirmación de la solicitud, en la sala asignada por el sistema SINACOL. Para misiones diplomáticas o consulares, se señala con sesenta días naturales posteriores a la notificación.","Lineamientos, numerales 8 y 18"),
   Cn("Citatorio","Se emite para la parte citada con un mínimo de cinco días hábiles previos a la audiencia. La notificación a la parte empleadora se hace personalmente.","Lineamientos, numerales 12 y 14"),
   Cn("Entrega por la parte solicitante","La persona solicitante puede pedir que se fije la audiencia dentro de los cinco días hábiles siguientes y entregar ella el citatorio. Si solo comparece ella y entregó el citatorio, se señala nueva fecha dentro de los siguientes quince días hábiles.","Lineamientos, numerales 13 y 14"),
   Cn("Nueva audiencia y justificación","Si las partes lo piden de común acuerdo o se justifica una inasistencia, se fija nueva audiencia dentro de los cuarenta y cinco días naturales contados desde la confirmación de la solicitud. La justificación se acredita en un término no mayor a tres días hábiles.","Lineamientos, numerales 18 y siguientes"),
   Cn("Confidencialidad","La información vertida en la audiencia no puede presentarse como prueba en ningún procedimiento administrativo o judicial.","Lineamientos, audiencia de conciliación")],
  qs:[
   Qc(T1,"Se presenta una solicitud de conciliación laboral prejudicial. ¿En qué plazo debe celebrarse la audiencia?","Dentro de los quince días hábiles siguientes a la recepción de la solicitud","En sesenta días naturales","En tres días","Es el plazo del numeral 8.","Lineamientos, numeral 8"),
   Qc(T3,"El Centro asigna la sala de conciliación para la audiencia. ¿Mediante qué sistema lo hace?","SINACOL","SINADEP","INFONAVIT","Se comunica en la notificación y el citatorio.","Lineamientos, numeral 8"),
   Qc(T1,"Una misión diplomática extranjera acreditada en México es citada a conciliación. ¿Con qué plazo se señala la audiencia?","Sesenta días naturales posteriores a la notificación","Quince días hábiles","Cinco días","Es la excepción al plazo general.","Lineamientos, numeral 18"),
   Qc(T1,"La persona conciliadora emite el citatorio para la parte citada. ¿Con qué anticipación mínima debe entregarse?","Cinco días hábiles previos a la audiencia","Un día","Treinta días","Es el mínimo del numeral 12.","Lineamientos, numeral 12"),
   Qc(T1,"Se notifica a la parte empleadora para la audiencia. ¿Cómo debe hacerse la notificación?","Personalmente, con al menos cinco días hábiles de anticipación","Por estrados","Por teléfono","Es la regla del numeral 14.","Lineamientos, numeral 14"),
   Qc(T1,"La persona solicitante quiere entregar personalmente el citatorio. ¿En qué plazo puede pedir que se fije la audiencia?","Dentro de los cinco días hábiles siguientes a la presentación de la solicitud","En quince días","En un mes","Se le proporciona el citatorio para que lo entregue.","Lineamientos, numeral 13"),
   Qc(T1,"Solo se presenta la persona solicitante a la audiencia y ella entregó el citatorio. ¿Qué procede?","Fijar nueva fecha dentro de los siguientes quince días hábiles","Archivar el asunto","Tener por desistida a la solicitante","La persona conciliadora geolocaliza el domicilio de la parte citada.","Lineamientos, numeral 13"),
   Qc(T1,"Las partes piden de común acuerdo una nueva audiencia. ¿Dentro de qué plazo debe celebrarse?","Dentro de los cuarenta y cinco días naturales contados desde la confirmación de la solicitud","En tres días","En un año","Es el plazo para nueva audiencia.","Lineamientos, numeral 18"),
   Qc(T1,"Una parte no acudió y quiere justificar su inasistencia. ¿En cuánto tiempo debe enviar la evidencia?","En un término no mayor a tres días hábiles","En treinta días","En un año","La persona conciliadora valora la justificación.","Lineamientos, numeral 18"),
   Qc(T1,"La persona conciliadora considera procedente la justificación de inasistencia. ¿Qué debe hacer?","Señalar nueva fecha y hora, dentro de los cuarenta y cinco días naturales desde la confirmación de la solicitud","Archivar el caso","Multar a la otra parte","Se fija una nueva audiencia.","Lineamientos, numeral 18"),
   Qc(T1,"Un trabajador quiere usar en juicio lo que la empresa dijo en la audiencia de conciliación. ¿Puede presentarlo como prueba?","No, la información vertida en la audiencia no puede presentarse como prueba","Sí, siempre","Solo si hay grabación","Rige el principio de confidencialidad.","Lineamientos, audiencia de conciliación"),
   Qc(T1,"Una persona conciliadora quiere aplicar criterios propios al procedimiento. ¿Es posible?","No, los Lineamientos son de aplicación obligatoria","Sí, tiene libertad","Solo en casos urgentes","Determinan bases, criterios y condiciones obligatorias.","Lineamientos, numeral 1"),
   Qc(T1,"Se confirma una solicitud y la audiencia se fija a los veinte días hábiles. ¿Es correcto?","No, debe celebrarse como máximo en quince días hábiles","Sí","Solo en materia colectiva","El plazo máximo es de quince días hábiles.","Lineamientos, numeral 18"),
   Qc(T1,"Se pregunta qué tipo de conciliación regulan estos Lineamientos.","La conciliación prejudicial individual presencial","La conciliación colectiva","El arbitraje comercial","Es su objeto.","Lineamientos, numeral 1"),
   Qc(T1,"Una parte citada no acude y no justifica su inasistencia en tres días hábiles. ¿Qué ocurre con el apercibimiento?","Se hace efectivo el apercibimiento aplicable","Se archiva el asunto","Se condona","Solo se omite si la justificación procede.","Lineamientos, numeral 18")]},

 {t:"Declaración Universal de los Derechos Humanos", ley:"Declaración Universal de los Derechos Humanos",
  cards:[
   Cn("Igualdad y no discriminación","Todos los seres humanos nacen libres e iguales en dignidad y derechos. Toda persona tiene los derechos proclamados sin distinción de raza, color, sexo, idioma, religión, opinión política, origen nacional o social, posición económica, nacimiento u otra condición.","DUDH, arts. 1 y 2"),
   Cn("Vida, libertad y prohibiciones","Toda persona tiene derecho a la vida, la libertad y la seguridad. Están prohibidas la esclavitud, la servidumbre y la trata de esclavos, y las torturas y penas o tratos crueles, inhumanos o degradantes.","DUDH, arts. 3, 4 y 5"),
   Cn("Personalidad, igualdad y recurso","Todo ser humano tiene derecho al reconocimiento de su personalidad jurídica. Todos son iguales ante la ley. Toda persona tiene derecho a un recurso efectivo ante los tribunales nacionales competentes contra actos que violen sus derechos fundamentales.","DUDH, arts. 6, 7 y 8"),

    var pb=nb? Math.round(hb/nb*100) : 0;

  }).join("");

/* ================= SIMULACRO ================= */
var S={fase:"inicio",area:"todas",items:[],i:0,t:0,timer:null,conf:false,ver:"todas"};
function simPool(){ return QS.filter(function(q){ return q.tipo==="s" && (S.area==="todas"||q.a===S.area); }); }
function vSim(){
  if(S.fase==="corriendo") return vSimPreg();
  if(S.fase==="fin") return vSimRes();
  var n=simPool().length, min=Math.ceil(n*RITMO);
  var opts='<option value="todas"'+(S.area==="todas"?" selected":"")+'>Todas las áreas disponibles</option>'+conContenido().map(function(a){ return '<option value="'+a.id+'"'+(S.area===a.id?" selected":"")+'>'+a.nombre+'</option>'; }).join("");
  var hist=P.h.length? '<h3>Tus últimos intentos</h3>'+P.h.slice().reverse().map(function(x){ return '<div class="fila"><span>'+x.f+'</span><b>'+x.ok+' de '+x.n+'</b></div>'; }).join("") : "";
  $("#app").innerHTML='<div class="pad"><h2>Simulacro</h2>'+
    '<p class="suave">Preguntas al estilo del examen: casos, fragmentos por completar y selecciones, con tres opciones. Las respuestas aparecen al final.</p>'+
    '<label for="sarea"><b>Área</b></label><select id="sarea" data-i="sarea">'+opts+'</select>'+
    '<p>'+n+' preguntas. Tiempo sugerido: '+min+' minutos (2,4 por pregunta).</p>'+
    '<div class="fila-btn"><button class="btn pri" data-a="sempezar" '+(n?"":"disabled")+'>Empezar</button></div>'+hist+'</div>';
}
function sEmpezar(){
  var pool=simPool(); if(!pool.length) return;
  S.items=barajar(pool).map(function(q){ return {q:q,op:mezclar(q),r:null,marca:false}; });
  S.i=0; S.t=0; S.conf=false; S.ver="todas"; S.fase="corriendo";
  clearInterval(S.timer); S.timer=setInterval(function(){ S.t++; var r=$("#reloj"); if(r){ r.textContent=fmt(S.t); } },1000);
  render(); window.scrollTo(0,0);
}
function vSimPreg(){
  var it=S.items[S.i], q=it.q, n=S.items.length, sug=Math.ceil(n*RITMO);
  var ops=it.op.map(function(o,k){ return '<button class="opcion'+(it.r===k?' sel':'')+'" data-a="sresp" data-k="'+k+'"><span class="ovalo"></span><span class="let">'+"ABC".charAt(k)+'</span><span>'+o.t+'</span></button>'; }).join("");
  var nav=S.items.map(function(x,k){ var c="numq"; if(x.r!==null) c+=" resp"; if(x.marca) c+=" marca"; if(k===S.i) c+=" act"; return '<button class="'+c+'" data-a="ssalta" data-k="'+k+'" aria-label="Pregunta '+(k+1)+'">'+(k+1)+'</button>'; }).join("");
  var sin=S.items.filter(function(x){ return x.r===null; }).length;
  var conf=S.conf? '<div class="alerta">Te faltan '+sin+' sin responder. ¿Terminar?<div class="fila-btn" style="margin-bottom:0"><button class="btn pri" data-a="sconf">Sí, terminar</button><button class="btn" data-a="sseguir">Seguir</button></div></div>' : "";
  $("#app").innerHTML='<div class="pad"><div class="cabq"><span class="suave">Pregunta '+(S.i+1)+' de '+n+'</span><span><span class="reloj" id="reloj">'+fmt(S.t)+'</span> <span class="chico suave">sugerido: '+sug+' min</span></span></div>'+
    '<p class="chico suave" style="margin:2px 0 0">'+nombreArea(q.a)+'. '+q.s+'</p>'+
    ctxH(q)+'<p class="enun">'+q.q+'</p>'+ops+
    '<div class="fila-btn"><button class="btn" data-a="sant" '+(S.i===0?"disabled":"")+'>Anterior</button><button class="btn" data-a="smarca">'+(it.marca?"Quitar marca":"Marcar")+'</button>'+(S.i<n-1?'<button class="btn pri" data-a="ssig">Siguiente</button>':'<button class="btn pri" data-a="sfin">Terminar</button>')+'</div>'+conf+
    '<div class="navg">'+nav+'</div><button class="btn" data-a="sfin">Terminar ahora</button></div>';
}
function sFinalizar(){
  clearInterval(S.timer); S.timer=null; S.fase="fin"; S.conf=false;
  var ok=0;
  S.items.forEach(function(it){ var a=it.r!==null && it.op[it.r].ok; if(a) ok++; reg(it.q,a); });
  P.h.push({f:new Date().toLocaleDateString("es-MX",{day:"numeric",month:"short"}),n:S.items.length,ok:ok}); P.h=P.h.slice(-8);
  guardar(); render(); window.scrollTo(0,0);
}
function vSimRes(){
  var porA={}, porS={}, ok=0;
  S.items.forEach(function(it){
    var a=it.r!==null && it.op[it.r].ok; if(a) ok++;
    var q=it.q, pa=porA[q.a]=porA[q.a]||{t:0,ok:0}; pa.t++; if(a) pa.ok++;
    var k=q.a+"|"+q.s, ps=porS[k]=porS[k]||{t:0,ok:0,a:q.a,s:q.s}; ps.t++; if(a) ps.ok++;
  });
  var n=S.items.length, p=n?Math.round(ok/n*100):0;
  var subs=Object.keys(porS).map(function(k){ return porS[k]; }).sort(function(x,y){ return x.ok/x.t-y.ok/y.t; });
  var filas=subs.map(function(s){ var pc=Math.round(s.ok/s.t*100); return '<div class="ar-fila"><span class="sw a'+(areaIdx(s.a)+1)+'"></span><span class="ar-n">'+s.s+'</span><span class="ar-d">'+s.ok+' de '+s.t+'</span></div><div class="barra a'+(areaIdx(s.a)+1)+'"><i style="width:'+pc+'%"></i></div>'; }).join("");
  var peor=subs[0], ref=(peor && peor.ok<peor.t)? '<div class="dato"><b>Refuerza primero: '+peor.s+'</b> ('+peor.ok+' de '+peor.t+' correctas).</div>' : '<div class="dato"><b>Sin temas débiles en este simulacro.</b></div>';
  var rev=S.items.map(function(it,k){
    var a=it.r!==null && it.op[it.r].ok; if(S.ver==="falladas" && a) return "";
    var cor=it.op.filter(function(o){ return o.ok; })[0].t;
    return '<div class="rev '+(a?"bien":"mal")+'"><p class="estado">'+(k+1)+'. '+(a?"Correcta":(it.r===null?"Sin responder":"Incorrecta"))+'</p>'+ctxH(it.q)+'<p class="enun" style="font-size:17px">'+it.q.q+'</p>'+(it.r!==null&&!a?'<p class="chico"><b>Tu respuesta:</b> '+it.op[it.r].t+'</p>':'')+'<p class="chico"><b>Correcta:</b> '+cor+'</p><div class="expl">'+it.q.e+'<br><span class="suave">'+it.q.f+'</span></div></div>';
  }).join("");
  $("#app").innerHTML='<div class="pad"><h2>'+ok+' de '+n+' correctas ('+p+' %)</h2>'+
    '<p class="chico suave">Tu tiempo: '+fmt(S.t)+'. Es un porcentaje de este banco, no el puntaje oficial.</p>'+ref+'<h3>Por tema</h3>'+filas+
    '<div class="fila-btn"><button class="btn pri" data-a="sotra">Repetir</button><button class="btn" data-a="svolver">Cambiar área</button></div>'+
    '<h3>Revisión</h3><div class="fila-btn"><button class="btn'+(S.ver==="todas"?" pri":"")+'" data-a="sver" data-v="todas">Todas</button><button class="btn'+(S.ver==="falladas"?" pri":"")+'" data-a="sver" data-v="falladas">Solo falladas</button></div>'+rev+'</div>';
}

/* ================= AL AZAR ================= */
var Z={f:"todas",q:null,ops:null,r:null,n:0,ok:0};
function azarPool(){
  return QS.filter(function(q){
    var f=Z.f;
    if(f==="todas") return true;
    if(f==="errores") return P.er.indexOf(q.id)>=0;
    if(f.indexOf("sub:")===0) return (q.a+"|"+q.s)===f.slice(4);
    return q.a===f;
  });
}
function azarNueva(){
  var p=azarPool(); if(!p.length){ Z.q=null; return; }
  var q, tries=0;
  do{ q=p[Math.floor(Math.random()*p.length)]; tries++; }while(Z.q && q.id===Z.q.id && p.length>1 && tries<12);
  Z.q=q; Z.ops=mezclar(q); Z.r=null;
}
function vAzar(){
  var opts='<option value="todas"'+(Z.f==="todas"?" selected":"")+'>Todas las áreas disponibles</option>'+conContenido().map(function(a){ return '<option value="'+a.id+'"'+(Z.f===a.id?" selected":"")+'>'+a.nombre+'</option>'; }).join("")+'<option value="errores"'+(Z.f==="errores"?" selected":"")+'>Solo mis errores ('+P.er.length+')</option>';
  if(Z.f.indexOf("sub:")===0){ opts+='<option value="'+Z.f+'" selected>Tema: '+Z.f.split("|")[1]+'</option>'; }

    var q=Z.q, bl=Z.r!==null;
    var ops=Z.ops.map(function(o,j){
      var cl="opcion"; if(bl){ if(o.ok) cl+=" ok"; else if(Z.r===j) cl+=" mal"; }
      return '<button class="'+cl+'" data-a="zresp" data-k="'+j+'" '+(bl?"disabled":"")+'><span class="ovalo"></span><span class="let">'+"ABC".charAt(j)+'</span><span>'+o.t+'</span></button>';
    }).join("");
    cuerpo='<p class="chico suave" style="margin-bottom:0">'+nombreArea(q.a)+'. '+q.s+'</p>'+ctxH(q)+'<p class="enun">'+q.q+'</p>'+ops+
      (bl? '<div class="expl"><b>'+(Z.ops[Z.r].ok?"Correcto.":"No es esa.")+'</b> '+q.e+'<br><span class="suave">'+q.f+'</span></div>' : "")+
      '<div class="fila-btn"><button class="btn pri" data-a="znueva">'+(bl?"Otra pregunta":"Saltar")+'</button></div>';
  }
  $("#app").innerHTML='<div class="pad"><h2>Al azar</h2><select data-i="zfiltro" aria-label="Qué practicar">'+opts+'</select>'+
    '<p class="chico suave">En esta sesión: '+Z.ok+' correctas de '+Z.n+'.</p>'+cuerpo+'</div>';

    '<div class="fila-btn"><button class="btn" data-a="borrar">Borrar mi progreso</button><button class="btn" data-a="cerrar">Cerrar</button></div>';
  $("#dlg").classList.add("on");
}

/* ================= EVENTOS ================= */
var ACC={
  tab:function(d){ irTab(d.t); },
  dlg:function(){ abrirDlg(""); },
  cerrar:function(){ $("#dlg").classList.remove("on"); },
  copiar:function(){
    var t=$("#cod"); t.select(); var ok=false;
    try{ if(navigator.clipboard){ navigator.clipboard.writeText(t.value); ok=true; } }catch(e){}
    if(!ok){ try{ ok=document.execCommand("copy"); }catch(e){} }
    $("#dmsg").textContent= ok? "Código copiado." : "Selecciona el texto y cópialo manualmente.";
  },
  cargar:function(){ var ok=cargarCodigo($("#cod2").value); if(ok){ abrirDlg("Progreso cargado."); render(); } else { $("#dmsg").textContent="Ese código no es válido."; } },
  borrar:function(){ P=vacio(); guardar(); abrirDlg("Progreso borrado."); render(); },
  bloque:function(d){ abrirBloque(d.ar,+d.i); },
  volver:function(){ V.blk=null; render(); window.scrollTo(0,0); },
  cd:function(d){ B.ab[+d.c]=!B.ab[+d.c]; vBloque(); },
  sabe:function(d){ P.tj[d.id]="sabe"; guardar(); vBloque(); },
  bresp:function(d){
    var a=areaPor(V.blk.ar), b=a.bloques[V.blk.i], qi=+d.q; if(B.r[qi]!==null) return;
    B.r[qi]=+d.k; reg(b.qs[qi],B.ops[qi][+d.k].ok); guardar(); vBloque();
  },
  bfin:function(){ P.b[V.blk.ar+(V.blk.i+1)]=true; guardar(); V.blk=null; render(); window.scrollTo(0,0); },
  refuerzo:function(d){ Z.f="sub:"+d.k; Z.n=0; Z.ok=0; Z.q=null; azarNueva(); V.tab="azar"; V.blk=null; pintarNav(); render(); window.scrollTo(0,0); },
  sempezar:function(){ sEmpezar(); },
  sresp:function(d){ S.items[S.i].r=+d.k; vSimPreg(); },
  ssig:function(){ if(S.i<S.items.length-1){ S.i++; S.conf=false; vSimPreg(); window.scrollTo(0,0); } },
  sant:function(){ if(S.i>0){ S.i--; S.conf=false; vSimPreg(); window.scrollTo(0,0); } },
  smarca:function(){ var it=S.items[S.i]; it.marca=!it.marca; vSimPreg(); },
  ssalta:function(d){ S.i=+d.k; S.conf=false; vSimPreg(); window.scrollTo(0,0); },
  sfin:function(){ var sin=S.items.filter(function(x){ return x.r===null; }).length; if(sin>0 && !S.conf){ S.conf=true; vSimPreg(); } else sFinalizar(); },
  sconf:function(){ sFinalizar(); },
  sseguir:function(){ S.conf=false; vSimPreg(); },
  sotra:function(){ sEmpezar(); },
  svolver:function(){ S.fase="inicio"; render(); },
  sver:function(d){ S.ver=d.v; vSimRes(); },
  zresp:function(d){ if(Z.r!==null) return; Z.r=+d.k; var ok=Z.ops[Z.r].ok; Z.n++; if(ok) Z.ok++; reg(Z.q,ok); guardar(); vAzar(); },
  znueva:function(){ azarNueva(); vAzar(); },
  tvoltea:function(){ T.v=!T.v; vTarj(); },
  tsig:function(){ var n=listaTarj().length; if(n){ T.i=(T.i+1)%n; T.v=false; vTarj(); } },
  tant:function(){ var n=listaTarj().length; if(n){ T.i=(T.i-1+n)%n; T.v=false; vTarj(); } },
  tsabe:function(d){ P.tj[d.id]="sabe"; guardar(); T.v=false; vTarj(); },
  trep:function(d){ P.tj[d.id]="rep"; guardar(); ACC.tsig(); }
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b) return;
  var f=ACC[b.getAttribute("data-a")]; if(f) f(b.dataset);
});
document.addEventListener("change",function(e){
  var t=e.target, k=t.getAttribute("data-i"); if(!k) return;
  if(k==="sarea"){ S.area=t.value; vSim(); }
  else if(k==="zfiltro"){ Z.f=t.value; Z.n=0; Z.ok=0; Z.q=null; azarNueva(); vAzar(); }
  else if(k==="tarea"){ T.a=t.value; T.i=0; T.v=false; vTarj(); }
  else if(k==="tsolo"){ T.solo=t.checked; T.i=0; vTarj(); }
});
$("#dlg").addEventListener("click",function(e){ if(e.target===$("#dlg")) ACC.cerrar(); });

pintarNav(); render();
</script>
</body>
</html>
